<html lang="ko">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Stellar Vanguard</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #000;
            font-family: sans-serif;
            touch-action: none;
            position: fixed; /* iOS 바운스 스크롤 방지 및 전체화면 고정 */
            top: 0;
            left: 0;
        }
        canvas { display: block; }
        .screen-panel { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2, 5, 15, 0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: white; text-align: center; }
        
        #ui { position: absolute; top: 3vmin; right: 4vmin; color: #0f0; font-size: 4.5vmin; font-weight: bold; z-index: 10; display: none; text-shadow: 0 0 10px #0f0; text-align: right; pointer-events: none; }
        
        #lives-ui { position: absolute; top: 3vmin; left: 4vmin; color: #f00; font-size: 5vmin; z-index: 10; filter: drop-shadow(0 0 5px #f00); display: none; pointer-events: none; transform-origin: left top; transition: transform 0.2s; }
        
        #boss-ui { position: absolute; top: 15vmin; left: 50%; transform: translateX(-50%); width: 55vmin; height: 3vmin; border: 0.4vmin solid #fff; background: rgba(0,0,0,0.5); display: none; z-index: 10; box-shadow: 0 0 10vmin #f00; }
        #boss-hp { width: 100%; height: 100%; background: linear-gradient(90deg, #f00, #ff5555); transition: width 0.2s; }
        #countdown { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ffcc00; font-size: 25vmin; font-weight: bold; text-shadow: 0 0 8vmin #ffcc00, 0 0 3vmin #fff; display: none; z-index: 300; pointer-events: none; white-space: nowrap; }

        @keyframes pulse { from { opacity: 0.4; } to { opacity: 1; } }
        #loading-text { color: #00ffff; font-size: 8vmin; font-weight: bold; text-shadow: 0 0 4vmin #00ffff; animation: pulse 0.8s infinite alternate; letter-spacing: 0.5vmin; }

        #damage-flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 0, 50, 0.4); opacity: 0; pointer-events: none; z-index: 140; transition: opacity 0.1s ease-out; }

        .main-btn { padding: 2.2vmin 0; font-size: 4vmin; cursor: pointer; background: linear-gradient(90deg, #00ffcc, #00aa88); border: none; border-radius: 2vmin; color: #000; font-weight: bold; box-shadow: 0 0 4vmin rgba(0,255,255,0.6); transition: all 0.2s; margin: 2vmin 0; width: 85%; }
        .main-btn:active { transform: scale(0.95); opacity: 0.8; }
        
        .toggle-container { display: flex; flex-direction: column; align-items: center; gap: 1.5vmin; margin: 2vmin 0; width: 100%; border-bottom: 0.2vmin solid rgba(0,255,255,0.2); padding-bottom: 2vmin; z-index: 10; }
        .toggle-container:last-of-type { border-bottom: none; }
        .row-btns { display: flex; justify-content: center; gap: 3vmin; width: 100%; }
        .toggle-btn { padding: 1.5vmin 0; font-size: 3.2vmin; cursor: pointer; background: rgba(20,20,30,0.8); border: 0.3vmin solid #555; border-radius: 2vmin; color: #fff; font-weight: bold; width: 45%; transition: all 0.2s; text-align: center; }
        .toggle-btn.active { background: #00ffff; color: #000; border-color: #fff; box-shadow: 0 0 3vmin #00ffff; }
        
        .red-box { 
            border: 0.5vmin solid rgba(0, 255, 255, 0.3); 
            box-shadow: 0 0 6vmin rgba(0, 255, 255, 0.15), inset 0 0 4vmin rgba(0, 255, 255, 0.1); 
            background: linear-gradient(145deg, rgba(5, 10, 25, 0.95), rgba(15, 5, 30, 0.95)); 
            padding: 4vmin 4vmin; 
            border-radius: 4vmin; 
            position: relative; 
            width: 85%; 
            max-width: 500px; 
            min-height: 60vmin;
            max-height: 90vh;
            max-height: 90dvh;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            box-sizing: border-box; 
            overflow: hidden; 
            backdrop-filter: blur(10px);
        }
        .red-box::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(0,255,255,0.05) 0%, transparent 60%);
            animation: rotateBg 15s linear infinite; pointer-events: none; z-index: 1;
        }
        .red-box::after {
            content: ''; position: absolute; top: -100%; left: 0; width: 100%; height: 20%;
            background: linear-gradient(to bottom, transparent, rgba(0, 255, 255, 0.15), transparent);
            animation: scanline 4s linear infinite; pointer-events: none; z-index: 2;
        }
        @keyframes rotateBg { 100% { transform: rotate(360deg); } }
        @keyframes scanline { 0% { top: -50%; } 100% { top: 150%; } }

        #text-title { font-size: 4.5vmin; position: relative; top: 2.5vmin; margin-bottom: 2vmin; color: #fff; text-shadow: 0 0 3vmin #00ffff; animation: floatTitle 2s ease-in-out infinite alternate; z-index: 10; white-space: nowrap; }
        @keyframes floatTitle {
            0% { transform: translateY(-0.2vmin); text-shadow: 0 0 3vmin #00ffff; }
            100% { transform: translateY(1.8vmin); text-shadow: 0 0 6vmin #00ffff, 0 0 2vmin #fff; }
        }
        #text-desc { z-index: 10; position: relative; }

        .settings-btn { position: absolute; top: 1.2vmin; right: 1.2vmin; background: none; border: none; font-size: 5vmin; cursor: pointer; color: #fff; text-shadow: 0 0 1vmin rgba(255,255,255,0.5); padding: 1vmin; transition: transform 0.4s; z-index: 20; }
        .settings-btn:hover { transform: rotate(90deg) scale(1.1); }

        #settings-panel { display: none; flex-direction: column; align-items: center; width: 100%; }
        #msg, #revive-confirm { display: none; }

        #msg, #revive-confirm { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 150; }
        #exit-confirm { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 400; text-align: center; }

        #text-revive-title { white-space: nowrap; font-size: 5.5vmin !important; }
        #heart-slot { width: 100%; height: 10vmin; margin-bottom: 4vmin; background: #111; border: 0.6vmin solid #ffcc00; border-radius: 2vmin; box-shadow: inset 0 0 4vmin #000, 0 0 4vmin #ffcc00; overflow: hidden; position: relative; box-sizing: content-box; z-index: 10; display: flex; align-items: flex-start; justify-content: center; }
        #slot-reel { display: flex; flex-direction: column; width: 100%; transition: transform 2.5s cubic-bezier(0.15, 0.85, 0.15, 1); transform: translateY(0); }
        .slot-item { height: 10vmin; width: 100%; font-size: 7vmin; display: flex; flex-direction: row; justify-content: center; align-items: center; gap: 0.5vmin; box-sizing: border-box; flex-shrink: 0; white-space: nowrap; }

        #mock-ad-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; color: #fff; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .ad-spinner { border: 1.5vmin solid #333; border-top: 1.5vmin solid #00ffff; border-radius: 50%; width: 15vmin; height: 15vmin; animation: spin 1s linear infinite; margin-bottom: 5vmin; }

        .copyright { position: absolute; bottom: 3vmin; right: 4vmin; color: #555; font-size: 2.5vmin; margin: 0; z-index: 10; pointer-events: none; }

        #leaderboard-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 350; }
        #lb-main-container { display: none; width: 100%; overflow-y: auto; max-height: 45vmin; margin-bottom: 3vmin; scrollbar-width: thin; scrollbar-color: #ffcc00 rgba(0,0,0,0.3); z-index: 10; }
        #lb-main-container::-webkit-scrollbar { width: 3vmin; }
        #lb-main-container::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); border-radius: 1.5vmin; }
        #lb-main-container::-webkit-scrollbar-thumb { background: #ffcc00; border-radius: 1.5vmin; border: 0.5vmin solid #000; }
        #lb-main-container::-webkit-scrollbar-thumb:hover { background: #ffaa00; }
        .lb-table { width: 100%; color: #fff; font-size: 3.2vmin; border-collapse: collapse; position: relative; }
        .lb-table th, .lb-table td { padding: 1.2vmin; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .lb-table th { color: #00ffff; font-size: 3.5vmin; position: sticky; top: 0; background: rgba(10,10,20,0.9); z-index: 11; }
        .lb-rank { color: #ffcc00; font-weight: bold; }
        .lb-name { color: #fff; font-weight: bold;}
        .lb-score { color: #00ffcc; font-weight: bold; }
        #name-input-container { display: none; flex-direction: column; align-items: center; margin-bottom: 5vmin; width: 100%; z-index: 10; position: relative; }
        #player-name-input { font-size: 4vmin; padding: 2vmin; width: 75%; text-align: center; background: rgba(0,0,0,0.5); color: #00ffff; border: 2px solid #00ffff; border-radius: 2vmin; text-transform: uppercase; margin-bottom: 3vmin; outline: none; box-shadow: inset 0 0 10px rgba(0,255,255,0.5); font-weight: bold; }

        /* Settings Screen UI Optimization overrides */
        #settings-screen .red-box {
            padding: 3vmin 4vmin;
            min-height: auto;
        }
        #settings-screen .toggle-container {
            margin: 1vmin 0;
            padding-bottom: 1.2vmin;
            gap: 0.8vmin;
        }
        #settings-screen .toggle-container p {
            font-size: 3.8vmin !important;
        }
        #settings-screen .toggle-btn {
            padding: 1vmin 0;
            font-size: 2.8vmin;
            border-radius: 1.5vmin;
        }
        #settings-screen #lang-select {
            padding: 1vmin 2vmin !important;
            font-size: 3vmin !important;
            border-radius: 1.5vmin;
        }
        #settings-screen #btn-back {
            margin-top: 2.5vmin;
            padding: 1.5vmin 0;
            font-size: 3.8vmin;
            border-radius: 1.5vmin;
        }
    </style>
</head>
<body>

    <div id="damage-flash"></div>

    <div id="loading-screen" class="screen-panel" style="z-index: 999; display: none; background: #000;">
        <div id="loading-text">LOADING...</div>
    </div>

    <div id="overlay" class="screen-panel">
        <div class="red-box">
            <button class="settings-btn" onclick="openSettings('overlay')">⚙️</button>
            <div id="main-panel" style="width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 10;">
                <h2 id="text-title">🚀 Stellar Vanguard</h2>
                <p id="text-desc" style="font-size: 4vmin; color: #aaddff; margin-bottom: 8vmin; letter-spacing: 0.2vmin; line-height: 1.5; text-shadow: 0 0 10px rgba(0,255,255,0.3);"></p>
                <button id="btn-start" class="main-btn" onclick="startGame()"></button>
            </div>

        <p class="copyright">Powered by Three.js (MIT License)</p>
    </div>

    <div id="settings-screen" class="screen-panel" style="z-index: 500; display: none;">
        <div class="red-box">
            <h2 id="text-settings-title" style="color: #00ffff; margin-bottom: 2.5vmin; text-shadow: 0 0 3vmin #00ffff; font-size: 5.5vmin; z-index: 10; position: relative;">SETTINGS</h2>
            <div class="toggle-container">
                <p id="text-quality" style="color: #fff; margin: 0; font-weight: bold; font-size: 4.5vmin;"></p>
                <div class="row-btns">
                    <button id="btn-q-high" class="toggle-btn active" onclick="setQuality('HIGH')"></button>
                    <button id="btn-q-low" class="toggle-btn" onclick="setQuality('LOW')"></button>
                </div>
            </div>
            <div class="toggle-container">
                <p id="text-audio" style="color: #fff; margin: 0; font-weight: bold; font-size: 4.5vmin;"></p>
                <div class="row-btns">
                    <button id="btn-toggle-sfx" class="toggle-btn" onclick="toggleSFX()"></button>
                    <button id="btn-toggle-bgm" class="toggle-btn" onclick="toggleBGM()"></button>
                </div>
            </div>
            <div class="toggle-container">
                <p id="text-lang" style="color: #fff; margin: 0; font-weight: bold; font-size: 4.5vmin;">LANGUAGE</p>
                <div class="row-btns" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 1.5vmin; width: 100%;">
                    <select id="lang-select" onchange="localStorage.setItem('smileslife-preferred-lang', this.value); window.location.search = '?lang=' + this.value;" style="padding: 1.5vmin 3vmin; font-size: 3.5vmin; background: rgba(20,20,30,0.8); border: 0.3vmin solid #555; border-radius: 2vmin; color: #fff; font-weight: bold; width: 90%; transition: all 0.2s; outline: none; text-align: center; text-align-last: center;">
                        <option value="ko">한국어</option>
                        <option value="en">English</option>
                        <option value="es">Español</option>
                        <option value="ja">日本語</option>
                        <option value="zh">简体中文</option>
                        <option value="zh-TW">繁體中文</option>
                    </select>
                </div>
            </div>
            <script>
            window.addEventListener('DOMContentLoaded', () => {
                const select = document.getElementById('lang-select');
                if (select) {
                    const lang = new URLSearchParams(window.location.search).get('lang') || localStorage.getItem('smileslife-preferred-lang') || 'ko';
                    select.value = lang;
                }
            });
            </script>

            <button id="btn-back" class="main-btn" style="background: rgba(255,255,255,0.2); color: #fff; box-shadow: none; margin-top: 4vmin; font-size: 4.5vmin; z-index: 10; position: relative;" onclick="closeSettings()"></button>
        </div>
    </div>
    
    <div id="countdown">3</div>
    <div id="lives-ui">❤️❤️❤️</div>
    <div id="boss-ui"><div id="boss-hp"></div></div>
    
    <div id="ui"><span id="score-label">Score</span>: <span id="current-score">0</span></div>
    
    <div id="revive-confirm" class="screen-panel">
        <div class="red-box">
            <h2 id="text-revive-title" style="color: #ffcc00; font-size: 5.5vmin; margin: 0 0 2vmin 0; text-shadow: 0 0 4vmin #ffcc00; z-index: 10; position: relative;">LUCKY REVIVE!</h2>
            <p id="text-revive-desc" style="color: #ddd; font-size: 3.2vmin; margin: 0 0 4vmin 0; z-index: 10; position: relative;"></p>
            <div id="heart-slot"></div>
            <div style="display: flex; flex-direction: column; gap: 3vmin; align-items: center; width: 100%; z-index: 10; position: relative;">

                <button id="btn-revive-no" class="toggle-btn" style="background: rgba(50,50,50,0.8); color: #aaa; width: 100%; border: none; padding: 2.5vmin; font-size: 3.5vmin;" onclick="skipRevive()"></button>
            </div>

    <div id="msg" class="screen-panel">
        <div class="red-box">
            <button class="settings-btn" onclick="openSettings('msg')">⚙️</button>
            <div id="over-panel" style="width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 10; position: relative;">
                <h1 id="text-gameover" style="font-size: 8vmin; margin: 0 0 3.5vmin 0; color:#ff0033; text-shadow: 0 0 4vmin #ff0033;">GAME OVER</h1>
                <p id="finalScoreDisplay" style="font-size: 6vmin; margin: 0 0 6vmin 0; color: #fff; font-weight:bold; text-shadow: 0 0 2vmin rgba(255,255,255,0.5);"></p>
                
                <button id="btn-show-ranking" class="toggle-btn" style="background: rgba(20,20,40,0.8); color: #ffcc00; border-color: #ffcc00; width: 85%; margin-bottom: 3vmin; padding: 3vmin 0;" onclick="showLeaderboardScreen(false)"></button>

            </div>
        </div>
    </div>

    <div id="leaderboard-screen">
        <div class="red-box" style="border-color: #ffcc00; box-shadow: 0 0 6vmin rgba(255,204,0,0.3), inset 0 0 4vmin rgba(255,204,0,0.1);">
            <h2 id="text-lb-title" style="color: #ffcc00; font-size: 6vmin; margin-top: 0; margin-bottom: 3vmin; text-shadow: 0 0 3vmin #ffcc00; z-index: 10; position: relative; white-space: nowrap;">TOP 20 RANKING</h2>
            
            <div id="name-input-container">
                <p id="text-new-record" style="color: #0f0; font-size: 3.8vmin; font-weight:bold; margin: 0 0 2vmin 0; text-shadow: 0 0 2vmin #0f0; white-space: nowrap;"></p>
                <input type="text" id="player-name-input" maxlength="5">
                <button id="btn-register-score" class="main-btn" style="width: 80%; padding: 2vmin; font-size: 4.5vmin; margin-top: 0; background: linear-gradient(90deg, #ffcc00, #ffaa00); box-shadow: 0 0 3vmin #ffcc00;" onclick="submitHighScore()"></button>

            <div id="lb-main-container">
                <table class="lb-table" id="lb-table">
                    <thead><tr><th id="text-lb-rank"></th><th id="text-lb-name"></th><th id="text-lb-score"></th></tr></thead>

        </div>
    </div>

    <div id="exit-confirm">
        <div class="red-box">
            <button class="settings-btn" onclick="openSettings('exit')">⚙️</button>

            <p id="text-exit-desc" style="color: #fff; font-size: 4.5vmin; margin-bottom: 6vmin; z-index: 10; position: relative;"></p>
            <div class="toggle-container" style="flex-direction: row; gap: 3vmin; justify-content: center; border: none; margin: 0;">
                <button id="btn-exit-yes" class="main-btn" style="background: rgba(255,0,50,0.8); color: #fff; min-width: 35vmin; margin: 0; font-size: 4.5vmin; width: auto; border: 0.2vw solid #ff0033; box-shadow: 0 0 2vmin #ff0033;" onclick="confirmExit()">Yes</button>
                <button id="btn-exit-no" class="main-btn" style="min-width: 35vmin; margin: 0; font-size: 4.5vmin; width: auto;" onclick="cancelExit()">No</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        function createCircleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(8, 8, 0, 8, 8, 8);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.7, 'rgba(255, 255, 255, 0.7)');
            grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, 16, 16);
            return new THREE.CanvasTexture(canvas);
        }

        const API_URL = "https://script.google.com/macros/s/AKfycbzdrxjy05btP5_EA6LW_2jMnc_M-hWsGJpJehdzi-18QCp9kwI1komUUjxNTHWmbG3vfw/exec"; 

        let topScores = [];

        async function fetchLeaderboard() {
            try {
                if (API_URL) {
                    let res = await fetch(API_URL);
                    let data = await res.json();
                    topScores = data;
                } else {
                    let localData = localStorage.getItem('stellarVanguardTop10');
                    if (localData) topScores = JSON.parse(localData);
                    else topScores = [{name:"AAA", score:500}, {name:"BBB", score:300}, {name:"CCC", score:100}];
                }
            } catch(e) { console.error(e); }
            renderLeaderboard();
        }

        async function submitHighScore() {
            let nameInput = document.getElementById('player-name-input').value.trim().toUpperCase();
            if (!nameInput) {
                alert(langData.pleaseEnterName);
                return;
            }
            document.getElementById('name-input-container').style.display = 'none';
            document.getElementById('lb-main-container').style.display = 'block';
            
            let newRecord = { name: nameInput, score: score };
            topScores.push(newRecord);
            topScores.sort((a, b) => b.score - a.score);
            topScores = topScores.slice(0, 20);
            
            renderLeaderboard();
            
            document.getElementById('loading-screen').style.display = 'flex';
            try {
                if (API_URL) {
                    await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify(newRecord)
                    });
                } else {
                    localStorage.setItem('stellarVanguardTop10', JSON.stringify(topScores));
                }
            } catch(e) { console.error(e); }
            document.getElementById('loading-screen').style.display = 'none';
        }

        function renderLeaderboard() {
            const tbody = document.getElementById('lb-body');
            tbody.innerHTML = '';
            topScores.forEach((s, i) => {
                tbody.innerHTML += `<tr><td class="lb-rank">${i+1}</td><td class="lb-name">${s.name}</td><td class="lb-score">${s.score}</td></tr>`;
            });
        }

        async function showLeaderboardScreen(isNewRecord) {
            document.getElementById('msg').style.display = 'none';
            
            if(topScores.length === 0 || !isNewRecord) {
                document.getElementById('loading-screen').style.display = 'flex';
                await fetchLeaderboard();
                document.getElementById('loading-screen').style.display = 'none';
            } else {
                renderLeaderboard();
            }

        function playBGM() {

            const normalVol = bgmFade * 0.05;

                    hatSrc.start(now); hatSrc.stop(now + 0.05);

                const filter = audioCtx.createBiquadFilter(), gain = audioCtx.createGain();
                
                osc1.type = 'sawtooth'; osc1.frequency.setValueAtTime(freq, now); 
                osc2.type = 'square'; osc2.frequency.setValueAtTime(freq / 2, now); osc2.detune.setValueAtTime(10, now);
                
                filter.type = 'lowpass'; filter.Q.setValueAtTime(6, now);
                filter.frequency.setValueAtTime(1200, now); filter.frequency.exponentialRampToValueAtTime(150, now + 0.15); 
                
                gain.gain.setValueAtTime(normalVol, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15); 
                
                osc1.connect(filter); osc2.connect(filter); filter.connect(gain); gain.connect(masterCompressor);

            }

                    kickOsc.connect(kickGain); kickGain.connect(masterCompressor);
                    kickOsc.start(now); kickOsc.stop(now + 0.2);
                }

                const bossNotes = [65.41, 65.41, 73.42, 65.41, 82.41, 65.41, 73.42, 65.41]; 
                const freq = bossNotes[Math.floor(bgmStep / 2) % 8];
                
                const oscB1 = audioCtx.createOscillator(), oscB2 = audioCtx.createOscillator(), gainB = audioCtx.createGain();

                gainB.gain.setValueAtTime(bossVol * 1.5, now); gainB.gain.linearRampToValueAtTime(0.001, now + 0.3);

            let baseFov = 55; 
            
            camera.aspect = currentAspect;
            
            if (currentAspect < baseAspect) {
                const hFov = 2 * Math.atan(Math.tan((baseFov * Math.PI) / 360) * baseAspect);
                camera.fov = (2 * Math.atan(Math.tan(hFov / 2) / currentAspect) * 180) / Math.PI;
            } else {
                camera.fov = baseFov;

            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);

        function shootMissile() {
            const m = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,1.5,8), new THREE.MeshBasicMaterial({color:0x00ffff, emissive: 0x00ffff}));
            m.rotation.x = Math.PI/2; m.frustumCulled = false;
            const barrelPos = new THREE.Vector3();
            
            if(playerMechGroup.visible) {
                const targetArm = fireFromLeft ? mUpperArmL : mUpperArmR;
                if(targetArm) {
                    targetArm.getWorldPosition(barrelPos);
                    m.position.copy(barrelPos);
                    m.position.x += (fireFromLeft ? -0.3 : 0.3);
                    m.position.y += 0.2;
                    m.position.z -= 1.0;
                    targetArm.rotation.x = -0.3;
                    const armRef = targetArm;
                    setTimeout(() => { if(armRef) armRef.rotation.x = 0; }, 100);
                }
                fireFromLeft = !fireFromLeft;
            } else {
                m.position.copy(playerGroup.position);
                m.position.z -= 2;
            }
            
            m.userData = { basePos: m.position.clone() }; scene.add(m); missiles.push(m); playSound('laser');
        }

        function animate() {
            if (!isStarted) return; 
            requestAnimationFrame(animate);
            if (isPaused && !isCountingDown) { renderer.render(scene, camera); return; }

            let dt = clock.getDelta();
            if (dt > 0.1) dt = 0.0166; 
            timeAccumulator += dt;

            while (timeAccumulator >= 0.0166) {
                if (hitStopFrames > 0) {
                    hitStopFrames--;
                } else {
                    updateGameLogic();
                }
                timeAccumulator -= 0.0166;
            }

            renderer.render(scene, camera);
        }

        function updateGameLogic() {
            
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                if(p.userData.velocity) {
                    p.userData.basePos.add(p.userData.velocity); 
                    p.rotation.x += p.userData.rotSpeed?.x || 0; 
                    p.rotation.y += p.userData.rotSpeed?.y || 0; 
                    p.userData.velocity.y -= 0.01; 
                    
                    applyCurvedWorld(p, p.userData.basePos.z, p.userData.basePos.x);
                    p.position.y = p.userData.basePos.y; 
                    
                    const shrink = p.userData.shrinkSpeed || 0.95;
                    
                    if (p.scale.x > 0.01) {
                        p.scale.multiplyScalar(shrink);
                    } else { 
                        scene.remove(p); 
                        p.geometry.dispose(); 
                        p.material.dispose(); 
                        particles.splice(i, 1); 
                    }
                }
            }

            if (isCountingDown) {
                camera.position.set(0, 6.0, 16.0); 
                camera.lookAt(0, 2.0, -50); 
                camera.rotation.z = 0;
                
                horizGroup.children.forEach(line => { 
                    line.userData.baseZ += speed; 
                    if (line.userData.baseZ >= 20) line.userData.baseZ -= 420; 
                    let positions = line.geometry.attributes.position.array;
                    let dist = Math.max(0, -line.userData.baseZ);
                    let curveXOffset = trackCurve * (dist * dist) * 0.0008;
                    let curveYOffset = (dist * dist) * UPHILL_CURVE;
                    
                    for(let i=0; i<positions.length/3; i++) {
                        let baseX = line.userData.origX[i];
                        positions[i*3] = baseX + curveXOffset; 
                        positions[i*3 + 1] = 0.06 + (baseX * baseX * PIPE_CURVE) + curveYOffset; 
                    }
                    
                    line.geometry.attributes.position.needsUpdate = true;
                    line.position.z = line.userData.baseZ;
                });
                
                for(let cm of curveMeshes) { 
                    let positions = cm.mesh.geometry.attributes.position.array; 
                    for(let i=0; i<cm.origX.length; i++) { 
                        let z = positions[i*3 + 2]; 
                        let dist = Math.max(0, -z); 
                        let baseX = cm.origX[i]; 
                        let baseY = cm.origY[i];
                        let curveXOffset = trackCurve * (dist * dist) * 0.0008; 
                        let curveYOffset = (dist * dist) * UPHILL_CURVE; 
                        
                        positions[i*3] = baseX + curveXOffset; 
                        positions[i*3 + 1] = baseY + (baseX * baseX * PIPE_CURVE) + curveYOffset; 
                    } 
                    cm.mesh.geometry.attributes.position.needsUpdate = true; 
                }
                
                if (stars) { 
                    stars.position.z += speed * 2.0; 
                    if (stars.position.z > 200) stars.position.z -= 200; 
                    
                    const targetOpacity = (isBossMode || isBossSpawning) ? 0.0 : 0.8;
                    stars.material.opacity += (targetOpacity - stars.material.opacity) * 0.05;
                }
                
                planets.forEach((p, i) => { 
                    p.userData.basePos.z += speed * 0.3; 
                    p.rotation.y += p.userData.rotY; 
                    p.rotation.x += p.userData.rotX; 
                    applyCurvedWorld(p, p.userData.basePos.z, p.userData.basePos.x, p.userData.baseY); 
                    
                    if (p.userData.basePos.z > 50) { 
                        const side = p.userData.basePos.x > 0 ? 1 : -1; 
                        scene.remove(p); 
                        p.geometry.dispose(); 
                        p.material.dispose(); 
                        planets.splice(i, 1); 
                        createPlanet(-350 - Math.random() * 50, side); 
                    }
                });
                return; 
            }

            if (!isGameOver) {
                frameCount++;
                if (frameCount % 150 === 0 && !isBossSpawning && !isBossMode) {
                    targetTrackCurve = (Math.random() - 0.5) * 4.0; 
                } else if (isBossSpawning || isBossMode) {
                    targetTrackCurve = 0; 
                }
                
                trackCurve += (targetTrackCurve - trackCurve) * 0.015; 
                
                // ★ 카메라 하강 (동적 고도) 로직 추가
                let targetCamY = 6.0 - (speed - 0.45) * 4.0; // 속도에 비례해 고도 하강
                if (targetCamY < 4.8) targetCamY = 4.8; // 하한선 (너무 내려가지 않게)
                if (isBossMode || isBossSpawning) targetCamY = 6.0; // 보스전은 넓게 보기 위해 원상복구

                camera.position.x = 0;
                camera.position.z = 16.0;
                camera.position.y += (targetCamY - camera.position.y) * 0.05; 
                camera.lookAt(0, 2.0, -50); 
                camera.rotation.z = 0;
                
                if (cameraShake > 0) {
                    camera.position.x += (Math.random() - 0.5) * (cameraShake * 0.1);
                    camera.position.y += (Math.random() - 0.5) * (cameraShake * 0.1);
                    cameraShake--;
                }

                horizGroup.children.forEach(line => { 
                    line.userData.baseZ += speed; 
                    if (line.userData.baseZ >= 20) line.userData.baseZ -= 420; 
                    
                    let positions = line.geometry.attributes.position.array;
                    let dist = Math.max(0, -line.userData.baseZ);
                    let curveXOffset = trackCurve * (dist * dist) * 0.0008;
                    let curveYOffset = (dist * dist) * UPHILL_CURVE;
                    
                    for(let i=0; i<positions.length/3; i++) {
                        let baseX = line.userData.origX[i];
                        positions[i*3] = baseX + curveXOffset; 
                        positions[i*3 + 1] = 0.06 + (baseX * baseX * PIPE_CURVE) + curveYOffset; 
                    }
                    
                    line.geometry.attributes.position.needsUpdate = true;
                    line.position.z = line.userData.baseZ;
                });
                
                for(let cm of curveMeshes) { 
                    let positions = cm.mesh.geometry.attributes.position.array; 
                    for(let i=0; i<cm.origX.length; i++) { 
                        let z = positions[i*3 + 2]; 
                        let dist = Math.max(0, -z); 
                        let baseX = cm.origX[i]; 
                        let baseY = cm.origY[i];
                        let curveXOffset = trackCurve * (dist * dist) * 0.0008; 
                        let curveYOffset = (dist * dist) * UPHILL_CURVE; 
                        
                        positions[i*3] = baseX + curveXOffset; 
                        positions[i*3 + 1] = baseY + (baseX * baseX * PIPE_CURVE) + curveYOffset; 
                    } 
                    cm.mesh.geometry.attributes.position.needsUpdate = true; 
                }

                if (stars) { 
                    stars.position.z += speed * 2.0; 
                    if (stars.position.z > 200) stars.position.z -= 200; 
                    
                    const targetOpacity = (isBossMode || isBossSpawning) ? 0.0 : 0.8;
                    stars.material.opacity += (targetOpacity - stars.material.opacity) * 0.05;
                }

                if (isBossMode || isBossSpawning || isTransformingToMech || isTransformingToShip) { 
                    if (bgmFade > 0) bgmFade = Math.max(0, bgmFade - 0.01); 
                } else { 
                    if (bgmFade < 1) bgmFade = Math.min(1, bgmFade + 0.01); 
                }
                
                if (!isBossMode && !isBossSpawning && !isTransformingToMech && !isTransformingToShip && obstaclesPassed >= nextBossTarget) {
                    isBossSpawning = true; 
                }

                if (!isBossMode && !isBossSpawning && !isTransformingToMech && !isTransformingToShip) {
                    let spawnInterval = Math.max(10, 18 - (speed - 0.45) * 10);
                    
                    if (frameCount > postBossGrace && frameCount > 60 && (frameCount - lastSpawnFrame > spawnInterval) && Math.random() < 0.1) {
                        let laneX = (Math.floor(Math.random()*5)-2)*LANE_WIDTH;
                        let rand = Math.random(); 
                        let distanceToBoss = nextBossTarget - obstaclesPassed;
                        
                        if (stageHeartSpawned === 0 && distanceToBoss <= 20 && Math.random() < 0.5) { 
                            createHeartAt(laneX, -300); 
                            stageHeartSpawned++; 
                            lastHeartSpawnFrame = frameCount;
                        } else if (rand < 0.01 && (frameCount - lastHeartSpawnFrame > 800)) { 
                            createHeartAt(laneX, -300); 
                            lastHeartSpawnFrame = frameCount;
                        } else if (rand < 0.16) { 
                            createJumpPadAt(laneX, -300); 
                        } else { 
                            createObstacleAt(laneX, -300); 
                        }
                        
                        lastSpawnFrame = frameCount;
                    }
                } 
                else if (isBossSpawning) { 
                    if (obstacles.length === 0 && jumpPads.length === 0 && hearts.length === 0) {
                        spawnBoss(); 
                    }
                } 
                else if (isTransformingToMech) {
                    transformTimer++; speed *= 0.95; boss.userData.basePos.z += (-40 - boss.userData.basePos.z) * 0.05; currentLane = 0; targetTilt = 0; targetX = 0;
                    
                    if (transformTimer === 1) {
                        boss.userData.baseY = 100; 
                        boss.userData.basePos.z = -150; 
                    }

                    if (transformTimer < 60) { 
                        playerShipGroup.rotation.y += 0.3; 
                        playerGroup.position.y += (1.5 - playerGroup.position.y) * 0.05; 
                    } else if (transformTimer === 60) { 
                        energyFlash(playerGroup.position); 
                        playerShipGroup.visible = false; 
                        playerMechGroup.visible = true; 
                        playerMechGroup.scale.set(0.1, 0.1, 0.1); 
                        playerMechGroup.rotation.y = Math.PI * 4; 
                    } else if (transformTimer < 120) { 
                        playerMechGroup.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1); 
                        playerMechGroup.rotation.y += (0 - playerMechGroup.rotation.y) * 0.1; 
                        playerGroup.position.y += (0.5 - playerGroup.position.y) * 0.1; 
                    } 

                    if (transformTimer > 60 && transformTimer < 100) {
                        boss.userData.baseY += (3.9 - boss.userData.baseY) * 0.15;
                        boss.userData.basePos.z += (-40 - boss.userData.basePos.z) * 0.15;
                    } else if (transformTimer === 100) {
                        boss.userData.baseY = 3.9;
                        boss.userData.basePos.z = -40;
                        playSound('explode'); 
                        explodeAt(boss.position, 0xffaa00, 40, true, 1.5); 
                        cameraShake = 20; 
                    }

                    if (boss) {
                        let bossRotZ = applyCurvedWorld(boss, boss.userData.basePos.z, boss.userData.basePos.x, boss.userData.baseY);
                        boss.rotation.z = bossRotZ;
                    }

                    if (transformTimer >= 120) { 
                        isTransformingToMech = false; 
                        isBossMode = true; 
                        boss.userData.lastFireFrame = frameCount; 
                    }
                }
                else if (isBossMode) {
                    speed *= 0.95; 
                    let bData = boss.userData;

                    if (bData.attackState === 0) {
                        if (frameCount % 80 === 0) bData.targetX = (Math.floor(Math.random()*5)-2)*LANE_WIDTH;
                        bData.basePos.x += (bData.targetX - bData.basePos.x) * 0.05;
                        let dynamicZ = -38 + Math.sin(frameCount * 0.02) * 10; 
                        bData.basePos.z += (dynamicZ - bData.basePos.z) * 0.02;
                        
                        bData.armPhase += 0.1; const swing = Math.sin(bData.armPhase) * 0.8;
                        bData.armL.rotation.x = swing; bData.armR.rotation.x = -swing; bData.legL.rotation.x = -swing; bData.legR.rotation.x = swing;
                        
                        let elapsed = frameCount - bData.lastFireFrame; 
                        let progress = Math.min(1.0, Math.pow(elapsed / bData.fireInterval, 2));
                        
                        bData.mats.forEach(m => { 
                            m.color.copy(m.baseColor).lerp(bData.warnColor, progress); 
                            m.emissive.copy(m.baseEmissive).lerp(bData.warnEmissive, progress); 
                        });
                        
                        if (elapsed >= bData.fireInterval) { 
                            if (Math.random() < 0.3) {
                                bData.attackState = 1; 
                                bData.dashTimer = 0;
                                playSound('boss_fire'); 
                            } else {
                                shootBossProjectile(bData.themeColor); 
                                playSound('boss_fire'); 
                                bData.lastFireFrame = frameCount; 
                                bData.mats.forEach(m => { 
                                    m.color.copy(m.baseColor); 
                                    m.emissive.copy(m.baseEmissive); 
                                }); 
                            }
                        }
                    } else if (bData.attackState === 1) {
                        bData.dashTimer++;
                        
                        bData.basePos.x += (bData.targetX - bData.basePos.x) * 0.1;
                        bData.baseY += (5.0 - bData.baseY) * 0.1;

                        let pulse = (Math.sin(bData.dashTimer * 0.5) + 1) / 2;
                        bData.mats.forEach(m => { 
                            m.color.copy(m.baseColor).lerp(bData.warnColor, pulse); 
                            m.emissive.copy(bData.warnEmissive).multiplyScalar(pulse); 
                        });

                        bData.armL.rotation.x -= 0.1; 
                        bData.armR.rotation.x -= 0.1;

                        if (bData.dashTimer > 45) { 
                            bData.attackState = 2;
                            playSound('explode'); 
                        }
                    } else if (bData.attackState === 2) {
                        bData.basePos.z += 2.5; 
                        bData.baseY += (3.9 - bData.baseY) * 0.2; 
                        
                        let isHit = Math.abs(playerGroup.position.x - bData.basePos.x) < 1.0 && 
                                    Math.abs(playerGroup.position.z - bData.basePos.z) < 3.5;
                                    
                        if (!isInvincible && isHit) {
                            handleHit();
                        }

                        if (bData.basePos.z > 15) {
                            bData.attackState = 3;
                        }
                    } else if (bData.attackState === 3) {
                        bData.basePos.z -= 1.0; 
                        bData.mats.forEach(m => { 
                            m.color.copy(m.baseColor); 
                            m.emissive.copy(m.baseEmissive); 
                        });
                        
                        bData.armL.rotation.x *= 0.8; 
                        bData.armR.rotation.x *= 0.8;

                        if (bData.basePos.z <= -38) {
                            bData.attackState = 0;
                            bData.lastFireFrame = frameCount; 
                            bData.basePos.z = -38;
                        }
                    }

                    if (frameCount % 20 === 0) shootMissile(); 
                    
                    let bossRotZ = applyCurvedWorld(boss, bData.basePos.z, bData.basePos.x, bData.baseY);
                    boss.rotation.z = bossRotZ;
                }
                else if (isTransformingToShip) {
                    transformTimer++; speed *= 0.95; currentLane = 0; targetTilt = 0; targetX = 0;
                    
                    if (transformTimer < 60) { 
                        playerMechGroup.rotation.y -= 0.3; 
                        playerGroup.position.y += (1.5 - playerGroup.position.y) * 0.05; 
                    } 
                    else if (transformTimer === 60) { 
                        energyFlash(playerGroup.position); 
                        playerMechGroup.visible = false; 
                        playerShipGroup.visible = true; 
                        playerShipGroup.scale.set(0.1, 0.1, 0.1); 
                        playerShipGroup.rotation.y = Math.PI * 4; 
                    } 
                    else if (transformTimer < 120) { 
                        playerShipGroup.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1); 
                        playerShipGroup.rotation.y += (0 - playerShipGroup.rotation.y) * 0.1; 
                        playerGroup.position.y += (0.5 - playerGroup.position.y) * 0.1; 
                    } 
                    else { 
                        isTransformingToShip = false; 
                        postBossGrace = frameCount + 300; 
                        speed = baseSpeed; 
                        stageHeartSpawned = 0; 
                        lastSpawnFrame = frameCount; 
                    }
                }

                if (playerMechGroup.visible) {
                    const foldAngleY = 1.6;
                    const foldAngleZ = 1.2;
                    
                    lWingParts.w1.rotation.y = foldAngleY; lWingParts.w1.rotation.z = foldAngleZ;
                    lWingParts.w2.rotation.y = 0.3; lWingParts.w2.rotation.z = 0.1;
                    lWingParts.w3.rotation.y = 0.2; lWingParts.w3.rotation.z = 0.1;
                    
                    rWingParts.w1.rotation.y = -foldAngleY; rWingParts.w1.rotation.z = -foldAngleZ;
                    rWingParts.w2.rotation.y = -0.3; rWingParts.w2.rotation.z = -0.1;
                    rWingParts.w3.rotation.y = -0.2; rWingParts.w3.rotation.z = -0.1;
                }

                for (let i = hearts.length - 1; i >= 0; i--) { 
                    let h = hearts[i]; 
                    h.userData.basePos.z += speed; 
                    h.rotation.y += h.userData.rotY; 
                    let hBaseY = h.userData.startY + Math.sin(frameCount * 0.1 + h.userData.phase) * 0.2; 
                    applyCurvedWorld(h, h.userData.basePos.z, h.userData.basePos.x, hBaseY); 
                    
                    if (!isGameOver && Math.abs(playerGroup.position.x - h.userData.basePos.x) < 1.0 && 
                        Math.abs(playerGroup.position.z - h.userData.basePos.z) < 1.5 && 
                        Math.abs(playerGroup.position.y - h.position.y) < 1.5) { 
                        
                        lives++; 
                        updateLivesUI(); 
                        playSound('life_up'); 
                        showFloatingText("❤️ +1", h.position, "#ff0033"); 
                        scene.remove(h); 
                        hearts.splice(i, 1); 
                    } else if (h.userData.basePos.z > 15) { 
                        scene.remove(h); 
                        hearts.splice(i, 1); 
                    } 
                }
                
                for (let i = jumpPads.length - 1; i >= 0; i--) { 
                    let pad = jumpPads[i]; 
                    pad.userData.basePos.z += speed; 
                    let padRotZ = applyCurvedWorld(pad, pad.userData.basePos.z, pad.userData.basePos.x, pad.userData.baseY); 
                    pad.rotation.z = padRotZ; 
                    
                    if (!isJumping && !isGameOver && Math.abs(playerGroup.position.x - pad.userData.basePos.x) < 0.8 && 
                        Math.abs(playerGroup.position.z - pad.userData.basePos.z) < 1.2) { 
                        
                        isJumping = true; 
                        jumpVelocityY = 0.35; 
                        landingBounceStep = 0; 
                        score += 2; 
                        updateScoreUI(); 
                        playSound('jump'); 
                        showFloatingText("+2", playerGroup.position, "#00ffaa"); 
                    } 
                    
                    if (pad.userData.basePos.z > 15) { 
                        scene.remove(pad); 
                        jumpPads.splice(i, 1); 
                    } 
                }
                
                for (let i = obstacles.length - 1; i >= 0; i--) { 
                    let obs = obstacles[i]; 
                    let moveSpeed = speed; 
                    
                    if (obs.userData.isBossProj) {
                        moveSpeed = obs.userData.speed; 
                    } else if (isBossMode || isTransformingToMech || isTransformingToShip) {
                        moveSpeed = 0.45; 
                    }
                    
                    obs.userData.basePos.z += moveSpeed; 
                    
                    if (!obs.userData.isBossProj) { 
                        obs.rotation.x += obs.userData.rx; 
                        obs.rotation.y += obs.userData.ry; 
                        obs.rotation.z += (obs.userData.rz || 0); 
                    } 
                    
                    let obsRotZ = applyCurvedWorld(obs, obs.userData.basePos.z, obs.userData.basePos.x, obs.userData.baseY); 
                    
                    if (obs.userData.isBossProj) { 
                        obs.rotation.z = obsRotZ; 
                    } 
                    
                    let isHit = Math.abs(playerGroup.position.x - obs.userData.basePos.x) < 1.0 && 
                                Math.abs(playerGroup.position.z - obs.userData.basePos.z) < 1.2 && 
                                Math.abs(playerGroup.position.y - obs.position.y) < 2.0; 
                                
                    if (!isInvincible && isHit) {
                        handleHit(); 
                    }
                    
                    if (obs.userData.basePos.z > 15) { 
                        scene.remove(obs); 
                        obstacles.splice(i, 1); 
                        
                        if(!isBossMode && !isBossSpawning && !isTransformingToMech && !isTransformingToShip && !obs.userData.isBossProj) { 
                            score++; 
                            obstaclesPassed++; 
                            updateScoreUI(); 
                            speed += 0.012;
                            playSound('score'); 
                        } 
                    } 
                }
                
                for (let i = planets.length - 1; i >= 0; i--) { 
                    let p = planets[i]; 
                    p.userData.basePos.z += speed * 0.3; 
                    p.rotation.y += p.userData.rotY; 
                    p.rotation.x += p.userData.rotX; 
                    applyCurvedWorld(p, p.userData.basePos.z, p.userData.basePos.x, p.userData.baseY); 
                    
                    if (p.userData.basePos.z > 50) { 
                        const side = p.userData.basePos.x > 0 ? 1 : -1; 
                        scene.remove(p); 
                        p.geometry.dispose(); 
                        p.material.dispose(); 
                        planets.splice(i, 1); 
                        createPlanet(-350 - Math.random() * 50, side); 
                    } 
                }
                
                missiles.forEach((m, i) => { 
                    m.userData.basePos.z -= 2.5; 
                    applyCurvedWorld(m, m.userData.basePos.z, m.userData.basePos.x, m.userData.baseY); 
                    
                    if (boss && m.position.distanceTo(boss.position) < 5) { 
                        bossHP -= 1.33; 
                        score += 3; 
                        updateScoreUI(); 
                        scene.remove(m); 
                        missiles.splice(i,1); 
                        
                        hitStopFrames = 2; 
                        
                        document.getElementById('boss-hp').style.width = Math.max(0, (bossHP / maxBossHP) * 100) + '%'; 
                        
                        if (bossHP <= 0) {
                            clearBoss(); 
                        }
                    } else if (m.userData.basePos.z < -120) { 
                        scene.remove(m); 
                        missiles.splice(i,1); 
                    } 
                });

                if (!isTransformingToMech && !isTransformingToShip) {
                    let diff = targetX - playerGroup.position.x;
                    playerGroup.position.x += diff * 0.12; 
                }

                let currentX = playerGroup.position.x;
                let playerPipeY = currentX * currentX * PIPE_CURVE;
                let pipeAngle = Math.atan(2 * PIPE_CURVE * currentX);

                if (isJumping) {
                    playerGroup.position.y += jumpVelocityY; 
                    jumpVelocityY -= jumpGravity; 
                    let floorY = 0.5 + playerPipeY;
                    let shadowScale = Math.max(0.3, 1.0 - (playerGroup.position.y - floorY) * 0.2); 
                    shadow.scale.set(shadowScale, shadowScale, 1.0); 
                    shadow.material.opacity = shadowScale;
                    
                    if (playerGroup.position.y <= floorY) { 
                        if (landingBounceStep === 0) { 
                            playerGroup.position.y = floorY; jumpVelocityY = 0.12; landingBounceStep = 1; playSound('land'); 
                            spawnDust(playerGroup.position); 
                        } 
                        else if (landingBounceStep === 1) { 
                            playerGroup.position.y = floorY; jumpVelocityY = 0.06; landingBounceStep = 2; playSound('land'); 
                        } 
                        else { 
                            playerGroup.position.y = floorY; isJumping = false; landingBounceStep = 0; playSound('land'); 
                            shadow.scale.set(1, 1, 1); shadow.material.opacity = 1.0; 
                        }
                    }
                } else {
                    if (!isTransformingToMech && !isTransformingToShip) {
                        playerGroup.position.y = Math.sin(Date.now()*0.002)*0.1 + 0.5 + playerPipeY; 
                    }
                }
                
                playerGroup.rotation.z += (targetTilt + pipeAngle - playerGroup.rotation.z)*0.15; 
                targetTilt *= 0.9; 
                shadow.position.x = playerGroup.position.x;
                shadow.position.y = 0.08 + playerPipeY;
                shadow.rotation.z = pipeAngle;
            }

            if (hitShakeTime > 0) {
                hitShakeTime -= 0.0166;
                const shakeScale = 0.25 * (hitShakeTime / 0.8);
                playerGroup.position.x += (Math.random() - 0.5) * shakeScale;
                playerGroup.position.y += (Math.random() - 0.5) * shakeScale;
                playerGroup.position.z += (Math.random() - 0.5) * shakeScale;
            }
        }

        function clearBoss() {
            isBossMode = false; 
            
            postBossGrace = frameCount + 999999; 
            
            playSound('boss_clear');
            energyFlash(boss.position); 
            explodeAt(boss.position, 0xff0000, 100, true); 
            explodeAt(boss.position, 0xffaa00, 100, true); 
            explodeAt(boss.position, 0xffffff, 50, true); 
            scene.remove(boss); boss = null;
            
            obstacles.forEach(o => { explodeAt(o.position, 0xffaa00, 15); scene.remove(o); }); obstacles = [];
            jumpPads.forEach(j => scene.remove(j)); jumpPads = [];
            hearts.forEach(h => scene.remove(h)); hearts = [];
            
            document.getElementById('boss-ui').style.display = 'none'; 
            score += 100; updateScoreUI();
            
            if (lives < 5) { 
                const animHeart = document.createElement('div');
                animHeart.innerText = '❤️';
                animHeart.style.position = 'absolute';
                animHeart.style.left = '50%';
                animHeart.style.top = '40%';
                animHeart.style.fontSize = '25vmin';
                animHeart.style.transform = 'translate(-50%, -50%) scale(0)';
                animHeart.style.transition = 'transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                animHeart.style.zIndex = '1000';
                animHeart.style.filter = 'drop-shadow(0 0 20px #ff0033)';
                document.body.appendChild(animHeart);

                setTimeout(() => { animHeart.style.transform = 'translate(-50%, -50%) scale(1)'; }, 100);

                setTimeout(() => {
                    animHeart.style.transition = 'all 0.8s ease-in';
                    animHeart.style.left = '5vmin';
                    animHeart.style.top = '4vmin';
                    animHeart.style.transform = 'translate(-50%, -50%) scale(0.2)';
                    animHeart.style.opacity = '0.5';
                }, 1200);

                setTimeout(() => {
                    animHeart.remove();
                    lives++; updateLivesUI(); playSound('life_up'); 
                    const livesEl = document.getElementById('lives-ui');
                    livesEl.style.transform = 'scale(1.5)';
                    setTimeout(() => livesEl.style.transform = 'scale(1)', 200);
                }, 2000);
            }
            
            bossStage++; nextBossTarget += 150; baseSpeed += 0.25; 
            setTimeout(() => { isTransformingToShip = true; transformTimer = 0; playSound('transform'); }, 2500);
        }

        function movePlayer(dir) {
            if(!isStarted || isGameOver || isCountingDown || isPaused || isTransformingToMech || isTransformingToShip) return; 
            const next = currentLane + dir; 
            if(next >= -MAX_LANE && next <= MAX_LANE) { 
                currentLane = next; 
                targetX = currentLane * LANE_WIDTH; 
                playSound('move'); 
                targetTilt = dir * -0.4; 
            } else {
                spawnWallSpark(dir);
                targetTilt = dir * 0.3; 
            }
        }

        function updateScoreUI() { document.getElementById('current-score').innerText = score; }
        
        async function showGameOverUI() { 
            document.getElementById('finalScoreDisplay').innerText = langData.finalScore + score; 
            
            document.getElementById('loading-screen').style.display = 'flex';
            await fetchLeaderboard();
            document.getElementById('loading-screen').style.display = 'none';

            let isNewRecord = false;
            if (score > 0 && (topScores.length < 20 || score > (topScores[topScores.length - 1]?.score || 0))) {
                isNewRecord = true;
            }
            
            if (isNewRecord) {
                showLeaderboardScreen(true);
            } else {
                document.getElementById('msg').style.display = 'flex'; 
            }
        }
        
        function resetGame() { 
            restartCount++; 
            document.getElementById('msg').style.display = 'none'; 
            adBreak({
                type: 'start',
                name: 'restart-game',
                beforeAd: () => { bgmVol = 0; },
                afterAd: () => { bgmVol = bgmEnabled ? 0.3 : 0; executeReset(); }
            });
        }

        function executeReset() {
            isGameOver = false; isInvincible = false; isBossMode = false; isBossSpawning = false; isPaused = false; isTransformingToMech = false; isTransformingToShip = false; 
            if(slotInterval) clearInterval(slotInterval);
            
            reviveCount = 0; score = 0; obstaclesPassed = 0; nextBossTarget = 150; bossStage = 1; speed = 0.45; baseSpeed = 0.45; currentLane = 0; frameCount = 0; postBossGrace = 0; targetTilt = 0; targetX = 0; lives = 3; bgmFade = 1.0; bossHP = maxBossHP; isJumping = false; jumpVelocityY = 0; landingBounceStep = 0;
            stageHeartSpawned = 0; trackCurve = 0; targetTrackCurve = 0; timeAccumulator = 0;
            lastHeartSpawnFrame = 0; hitStopFrames = 0; hitShakeTime = 0;
            
            updateScoreUI(); updateLivesUI(); 
            document.getElementById('msg').style.display = 'none'; 
            document.getElementById('boss-ui').style.display = 'none'; 
            document.getElementById('revive-confirm').style.display = 'none';
            document.getElementById('leaderboard-screen').style.display = 'none';
            
            if (boss) { scene.remove(boss); boss = null; }
            obstacles.forEach(o => scene.remove(o)); obstacles = []; 
            jumpPads.forEach(j => scene.remove(j)); jumpPads = []; 
            hearts.forEach(h => scene.remove(h)); hearts = []; 
            missiles.forEach(m => scene.remove(m)); missiles = []; 
            particles.forEach(p => { scene.remove(p); if(p.geometry) p.geometry.dispose(); if(p.material) p.material.dispose(); }); particles = [];
            lastPlanetY = { '-1': 0, '1': 0 }; planets.forEach(p => { scene.remove(p); p.geometry.dispose(); p.material.dispose(); }); planets = [];
            
            for (let z = 0; z > -400; z -= 100) { createPlanet(z, -1); createPlanet(z - 50, 1); }
            preSpawnTrack(); 

            playerShipGroup.visible = true; playerMechGroup.visible = false; 
            playerShipGroup.rotation.set(0, 0, 0); playerShipGroup.scale.set(1, 1, 1);
            playerMechGroup.rotation.set(0, 0, 0); playerMechGroup.scale.set(1, 1, 1);

            playerGroup.position.set(0, 0.5, 0); playerGroup.rotation.set(0, 0, 0); playerGroup.visible = true; shadow.position.set(0, 0.08, 0); shadow.visible = true;
            
            camera.position.set(0, 6.0, 16.0); camera.lookAt(0, 2.0, -50); camera.rotation.z = 0;
            renderer.render(scene, camera);
            
            startCountdown();
            setQuality(qualityMode);
        }
        
        window.addEventListener('resize', () => { adjustCameraFOV(); });
        applyI18n();
    </script>
</body>
</html>
