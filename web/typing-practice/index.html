<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>타자연습</title>
    <style>
        :root {
            --bg-color: #f5f6fa;
            --card-bg: #ffffff;
            --text-color: #2f3640;
            --border-color: rgba(0,0,0,0.08);
            --accent-color: #0078D4;
            --accent-hover: #005a9e;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: auto;
            padding: 20px 0;
        }

        .typing-container {
            width: 100%;
            max-width: 550px;
            background: var(--card-bg);
            border-radius: 14px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mode-selector {
            display: flex;
            gap: 5px;
        }

        .btn {
            background: #f1f2f6;
            border: 1px solid #ced6e0;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn.active {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .dash-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .dash-label {
            font-size: 12px;
            color: #718093;
            font-weight: 600;
        }

        .dash-val {
            font-size: 20px;
            font-weight: bold;
            font-family: monospace;
            color: var(--accent-color);
        }

        .typing-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .target-text-box {
            background: #f1f2f6;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            min-height: 52px;
            display: flex;
            align-items: center;
            position: relative;
            word-break: break-all;
        }

        .user-input-box {
            position: relative;
        }

        .input-field {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
        }

        .input-field:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(0, 120, 212, 0.1);
        }

        .keyboard-hint {
            font-size: 11px;
            color: #718093;
            text-align: right;
            margin-top: 5px;
        }

        .result-overlay {
            display: none;
            text-align: center;
            padding: 20px;
            background: #f5f6fa;
            border-radius: 8px;
            font-weight: bold;
        }

        /* 모바일 반응형 디자인 */
        @media (max-width: 600px) {
            body {
                padding: 15px 10px;
            }
            .typing-container {
                padding: 15px;
                gap: 15px;
            }
            .header {
                flex-direction: column;
                align-items: center;
                gap: 12px;
                padding-bottom: 12px;
            }
            .title {
                font-size: 16px;
            }
            .dashboard {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 8px !important;
                padding: 10px !important;
            }
            .dash-val {
                font-size: 16px !important;
            }
            .target-text-box {
                font-size: 14px !important;
                padding: 10px !important;
                min-height: 44px !important;
            }
            .input-field {
                padding: 10px !important;
                font-size: 14px !important;
            }
            .keyboard-hint {
                font-size: 10px !important;
                text-align: center !important;
            }
        }
    </style>
    <script src="../../adsense-loader.js"></script>
</head>
<body>

                    <button class="btn" id="lang-secondary" onclick="setTypingLang('secondary')">Secondary</button>
                </div>
                <div class="mode-selector">
                    <button class="btn active" id="mode-word" onclick="setMode('word')" data-i18n="modeWord">단어 연습</button>
                    <button class="btn" id="mode-sentence" onclick="setMode('sentence')" data-i18n="modeSentence">문장 연습</button>
                </div>
                <select id="lang-select" onchange="changeLanguage(this.value)" style="padding: 5px 10px; border-radius: 6px; border: 1px solid #ced6e0; background: #f1f2f6; color: var(--text-color); font-size: 12px; font-weight: bold; cursor: pointer; outline: none;">
                    <option value="ko">한국어</option>
                    <option value="en">English</option>
                    <option value="es">Español</option>
                    <option value="ja">日本語</option>
                    <option value="zh-TW">繁體中文</option>
                </select>
            </div>
        </div>

        <div class="dashboard">
            <div class="dash-item">
                <span class="dash-label" id="label-cpm" data-i18n="cpm">현재 타수</span>
                <span class="dash-val" id="cpm-val">0</span>
            </div>
            <div class="dash-item">
                <span class="dash-label" id="label-avg-cpm" data-i18n="avgCpm">평균 타수</span>

            </div>
            <div class="dash-item">
                <span class="dash-label" id="label-max-cpm" data-i18n="maxCpm">최고 타수</span>
                <span class="dash-val" id="max-cpm-val">0</span>
            </div>
            <div class="dash-item">
                <span class="dash-label" id="label-accuracy" data-i18n="accuracy">정확도</span>
                <span class="dash-val" id="accuracy-val">100%</span>
            </div>
        </div>

        <div class="typing-area">
            <div class="target-text-box" id="target-text" data-i18n="startMsg">시작하려면 입력창을 클릭하고 입력을 시작하세요.</div>
            <div class="user-input-box">
                <input type="text" class="input-field" id="input-field" placeholder="여기에 입력하세요..." autocomplete="off" oninput="onInput()" onkeydown="onKeyDown(event)">
            </div>
            <div class="keyboard-hint" data-i18n="wordHint">단어는 공백(Space) 또는 엔터(Enter) 입력 시 넘어갑니다.</div>
        </div>
    </div>

        let uiLang = 'ko';
        let selectedTypingMode = 'primary'; // 'primary' or 'secondary'
        let currentMode = 'word';

        let correctKeystrokes = 0;

        function initLanguage() {
            const urlParams = new URLSearchParams(window.location.search);
            let lang = urlParams.get('lang') || localStorage.getItem('smileslife-preferred-lang');
            
            if (!lang) {
                const userLang = navigator.language || navigator.userLanguage;
                if (userLang.startsWith('ko')) lang = 'ko';
                else if (userLang.startsWith('es')) lang = 'es';
                else if (userLang.startsWith('ja')) lang = 'ja';
                else if (userLang.startsWith('zh')) lang = 'zh-TW';
                else lang = 'en';
            } else {
                if (lang === 'ko' || lang === 'ko-kr') lang = 'ko';
                else if (lang === 'es') lang = 'es';
                else if (lang === 'ja') lang = 'ja';
                else if (lang.startsWith('zh')) lang = 'zh-TW';
                else lang = 'en';
            }
            
            uiLang = lang;
            document.getElementById('lang-select').value = lang;
            selectedTypingMode = 'primary'; 
            applyLanguage(lang);
            localStorage.setItem('smileslife-preferred-lang', lang);
        }

        function applyLanguage(lang) {
            const t = TRANSLATIONS[lang] || TRANSLATIONS['ko'];
            document.title = t.title;
            document.getElementById('page-title').innerText = t.title;
            
            document.getElementById('label-cpm').innerText = t.cpm;
            document.getElementById('label-avg-cpm').innerText = t.avgCpm;
            document.getElementById('label-max-cpm').innerText = t.maxCpm;
            document.getElementById('label-accuracy').innerText = t.accuracy;
            
            const inputEl = document.getElementById('input-field');
            if (inputEl) {
                inputEl.placeholder = t.placeholder;
            }
            
            document.getElementById('mode-word').innerText = t.modeWord;
            document.getElementById('mode-sentence').innerText = t.modeSentence;
            
            const config = LANG_CONFIGS[lang] || LANG_CONFIGS['ko'];
            document.getElementById('lang-primary').innerText = config.primary.label;
            document.getElementById('lang-secondary').innerText = config.secondary.label;
            
            if (!startTime) {
                targetTextEl.innerText = t.startMsg;
            }
            
            const hintEl = document.querySelector('.keyboard-hint');
            if (hintEl) {
                if (currentMode === 'word') {
                    hintEl.innerText = t.wordHint;
                } else {
                    hintEl.innerText = t.sentenceHint;
                }
            }
        }

        function changeLanguage(val) {
            localStorage.setItem('smileslife-preferred-lang', val);
            const url = new URL(window.location.href);
            url.searchParams.set('lang', val);
            window.history.pushState({}, '', url);
            uiLang = val;
            applyLanguage(val);
            selectedTypingMode = 'primary';
            resetPractice();
        }

        function setTypingLang(mode) {
            selectedTypingMode = mode;
            document.getElementById('lang-primary').classList.remove('active');
            document.getElementById('lang-secondary').classList.remove('active');
            
            if (mode === 'primary') {
                document.getElementById('lang-primary').classList.add('active');
            } else {
                document.getElementById('lang-secondary').classList.add('active');
            }
            resetPractice();
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('mode-word').classList.remove('active');
            document.getElementById('mode-sentence').classList.remove('active');
            
            if (mode === 'word') {
                document.getElementById('mode-word').classList.add('active');
            } else {
                document.getElementById('mode-sentence').classList.add('active');
            }
            resetPractice();
        }

        function resetPractice() {
            inputField.value = '';
            startTime = null;
            activeTimer = false;
            totalKeystrokes = 0;
            correctKeystrokes = 0;
            cumulativeTime = 0;
            cumulativeKeystrokes = 0;
            cumulativeTotalKeystrokes = 0;
            cpmVal.innerText = '0';
            document.getElementById('avg-cpm-val').innerText = '0';
            maxCpm = 0;
            maxCpmVal.innerText = '0';
            accuracyVal.innerText = '100%';
            
            document.getElementById('lang-primary').classList.remove('active');
            document.getElementById('lang-secondary').classList.remove('active');
            if (selectedTypingMode === 'primary') {
                document.getElementById('lang-primary').classList.add('active');
            } else {
                document.getElementById('lang-secondary').classList.add('active');
            }

            applyLanguage(uiLang);
            nextTarget();
        }

        function nextTarget() {
            const config = LANG_CONFIGS[uiLang] || LANG_CONFIGS['ko'];
            const activeTypingLang = selectedTypingMode === 'primary' ? config.primary.code : config.secondary.code;
            
            let db;
            if (activeTypingLang === 'ko') {
                db = currentMode === 'word' ? wordDb : sentenceDb;
            } else if (activeTypingLang === 'es') {
                db = currentMode === 'word' ? wordDbEs : sentenceDbEs;
            } else if (activeTypingLang === 'ja') {
                db = currentMode === 'word' ? wordDbJa : sentenceDbJa;
            } else if (activeTypingLang === 'zh-TW') {
                db = currentMode === 'word' ? wordDbZh : sentenceDbZh;
            } else {
                db = currentMode === 'word' ? wordDbEn : sentenceDbEn;
            }
            
            let next;
            do {
                next = db[Math.floor(Math.random() * db.length)];
            } while (next === currentTarget);
            
            currentTarget = next;
            targetTextEl.innerText = currentTarget;
            inputField.value = '';
        }

        function onInput() {
            const typed = inputField.value;

            if (typed.length === 0) {
                activeTimer = false;
                startTime = null;
                correctKeystrokes = 0;
                totalKeystrokes = 0;
                updateAccuracy();
                updateCPM();
                return;
            }

            if (!activeTimer && typed.length > 0) {
                startTime = new Date();
                activeTimer = true;
                startCalculations();
            }

            let typedStrokes = countStrokes(typed);
            
            let correctCount = 0;
            for (let i = 0; i < typed.length; i++) {
                if (typed[i] === currentTarget[i]) {
                    correctCount += countStrokes(typed[i]);
                }
            }

            correctKeystrokes = correctCount;
            totalKeystrokes = typedStrokes;

            if (currentTarget.startsWith(typed)) {
                targetTextEl.style.color = 'inherit';
            } else {
                targetTextEl.style.color = '#d63031';
            }

            updateAccuracy();
            updateCPM();
        }

        function submitTarget() {
            if (activeTimer && startTime) {
                cumulativeTime += (new Date() - startTime) / 1000;
            }
            cumulativeKeystrokes += correctKeystrokes;
            cumulativeTotalKeystrokes += totalKeystrokes;

            activeTimer = false;
            startTime = null;
            correctKeystrokes = 0;
            totalKeystrokes = 0;

            nextTarget();
        }

        function flashError() {
            targetTextEl.style.color = '#d63031';
            setTimeout(() => { targetTextEl.style.color = 'inherit'; }, 300);
        }

        function onKeyDown(e) {
            const typed = inputField.value;

            if (e.key === 'Enter') {
                e.preventDefault();
                if (typed.trim() === currentTarget) {
                    submitTarget();
                } else {
                    flashError();
                }
            } else if (e.key === ' ') {
                if (typed.trim() === currentTarget) {
                    e.preventDefault();
                    submitTarget();
                } else if (currentMode === 'word') {
                    e.preventDefault();
                    flashError();
                }
            }
        }

        function updateCPM() {
            let currentActiveTime = 0;
            if (activeTimer && startTime) {
                currentActiveTime = (new Date() - startTime) / 1000;
            }
            
            let currentCpm = 0;
            if (currentActiveTime > 0.3 && correctKeystrokes > 0) {
                currentCpm = Math.round((correctKeystrokes / currentActiveTime) * 60);
            }
            cpmVal.innerText = currentCpm;

            if (currentCpm > maxCpm) {
                maxCpm = currentCpm;
                maxCpmVal.innerText = maxCpm;
            }

            let avgCpm = 0;
            if (cumulativeTime > 0) {
                avgCpm = Math.round((cumulativeKeystrokes / cumulativeTime) * 60);
            }
            document.getElementById('avg-cpm-val').innerText = avgCpm;
        }

        function startCalculations() {
            if (!activeTimer) return;

            const interval = setInterval(() => {
                if (!activeTimer) {
                    clearInterval(interval);
                    return;
                }
                updateCPM();
            }, 200);
        }

        function updateAccuracy() {
            const totalKeys = cumulativeTotalKeystrokes + totalKeystrokes;
            const correctKeys = cumulativeKeystrokes + correctKeystrokes;
            
            if (totalKeys === 0) {
                accuracyVal.innerText = '100%';
                return;
            }
            const acc = Math.round((correctKeys / totalKeys) * 100);
            accuracyVal.innerText = `${acc}%`;
        }

        function countStrokes(str) {
            let strokes = 0;
            for (let i = 0; i < str.length; i++) {
                const code = str.charCodeAt(i);
                if (code >= 0xAC00 && code <= 0xD7A3) { 
                    const offset = code - 0xAC00;
                    const choice = offset % 28; 
                    const joong = Math.floor((offset % 588) / 28); 
                    const cho = Math.floor(offset / 588); 
                    strokes += 2 + (choice > 0 ? 1 : 0);
                } else {
                    strokes += 1;
                }
            }
            return strokes;
        }

        window.onload = () => {
            initLanguage();
            resetPractice();
        };
    </script>
</body>
</html>
