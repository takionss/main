<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이미지 GIF 변환기 | 움짤 만들기</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SortableJS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <!-- gif.js (Using a version that is more stable for CDNs) -->
    <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans text-slate-900">

    <!-- Header -->
    <header class="bg-white shadow-sm py-6 relative">
        <a href="../../index.html" class="absolute left-8 top-1/2 -translate-y-1/2 text-slate-400 hover:text-indigo-600 transition-colors flex items-center gap-2 font-medium">
            <i class="fas fa-home"></i> 홈으로
        </a>
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-3xl font-bold text-indigo-600 flex items-center justify-center gap-2">
                <i class="fas fa-file-video"></i> 이미지 GIF 변환기
            </h1>
            <p class="text-slate-500 mt-2">여러 장의 이미지를 합쳐 나만의 움짤을 만들어보세요.</p>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-6xl">
        <div class="grid lg:grid-cols-12 gap-8">
            
            <!-- Sidebar: Controls & Preview -->
            <aside class="lg:col-span-4 space-y-6">
                <!-- Settings Card -->
                <div class="bg-white rounded-3xl shadow-lg p-6 space-y-6">
                    <h3 class="text-xl font-bold border-b pb-4 flex items-center gap-2">
                        <i class="fas fa-cog text-indigo-500"></i> 설정
                    </h3>
                    
                    <!-- Speed Control -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2 flex justify-between">
                            재생 속도 (프레임 지연)
                            <span id="delay-val" class="text-indigo-600 font-bold">500ms</span>
                        </label>
                        <input type="range" id="delay-slider" min="50" max="2000" value="500" step="50" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
                    </div>

                    <!-- Size Control -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">출력 가로 크기 (픽셀)</label>
                        <select id="size-select" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 outline-none focus:border-indigo-500 transition-colors">
                            <option value="300">300 px</option>
                            <option value="500" selected>500 px (기본)</option>
                            <option value="800">800 px</option>
                            <option value="original">원본 크기</option>
                        </select>
                    </div>

                    <!-- Generate Button -->
                    <button id="generate-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl shadow-lg transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fas fa-magic"></i> GIF 만들기
                    </button>
                </div>

                <!-- Preview Card -->
                <div class="bg-white rounded-3xl shadow-lg p-6">
                    <h3 class="text-xl font-bold border-b pb-4 mb-4 flex items-center gap-2">
                        <i class="fas fa-play-circle text-indigo-500"></i> 실시간 미리보기
                    </h3>
                    <div class="aspect-square checkerboard rounded-2xl overflow-hidden flex items-center justify-center bg-slate-100 border border-slate-100 relative">
                        <canvas id="preview-canvas" class="max-w-full max-h-full object-contain"></canvas>
                        <div id="no-preview" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 p-4 text-center">
                            <i class="fas fa-images text-4xl mb-2 opacity-20"></i>
                            <p class="text-sm">이미지를 추가하면<br>미리보기가 표시됩니다.</p>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Main: Timeline / Image List -->
            <section class="lg:col-span-8">
                <div id="drop-zone" class="bg-white rounded-3xl shadow-lg p-6 min-h-[600px] flex flex-col">
                    <div class="flex flex-col sm:flex-row items-center justify-between border-b pb-4 mb-6 gap-4">
                        <h3 class="text-xl font-bold flex items-center gap-2">
                            <i class="fas fa-layer-group text-indigo-500"></i> 프레임 타임라인
                        </h3>
                        <div class="flex gap-2">
                            <input type="file" id="file-input" class="hidden" multiple accept="image/*">
                            <button onclick="document.getElementById('file-input').click()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-sm font-medium transition-colors flex items-center gap-2">
                                <i class="fas fa-plus"></i> 이미지 추가
                            </button>
                            <button id="clear-all" class="bg-red-50 hover:bg-red-100 text-red-500 px-4 py-2 rounded-xl text-sm font-medium transition-colors flex items-center gap-2">
                                <i class="fas fa-trash-alt"></i> 전체 삭제
                            </button>
                        </div>
                    </div>

                    <!-- Sortable Grid -->
                    <div id="timeline-grid" class="flex-grow grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 overflow-y-auto max-h-[700px] pr-2 custom-scrollbar">
                        <!-- Thumbnails will be injected here -->
                    </div>

                    <!-- Empty State -->
                    <div id="empty-state" class="flex-grow flex flex-col items-center justify-center py-20 text-slate-400">
                        <div class="w-24 h-24 bg-slate-50 rounded-full flex items-center justify-center mb-6 text-slate-200 text-4xl border-2 border-dashed border-slate-100">
                            <i class="fas fa-upload"></i>
                        </div>
                        <p class="text-lg font-medium">이미지를 업로드하여 프레임을 구성하세요</p>
                        <p class="text-sm">드래그하여 순서를 바꿀 수 있습니다.</p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Modal for Result -->
    <div id="result-modal" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-lg w-full p-8 text-center animate-fade-in">
            <div id="generating-state">
                <div class="relative w-20 h-20 mx-auto mb-6">
                    <div class="absolute inset-0 border-4 border-indigo-100 rounded-full"></div>
                    <div class="absolute inset-0 border-4 border-indigo-600 rounded-full border-t-transparent animate-spin"></div>
                </div>
                <h3 class="text-2xl font-bold mb-2">GIF 인코딩 중...</h3>
                <p class="text-slate-500 mb-4">고품질 움짤을 만들고 있습니다.</p>
                <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden mb-2">
                    <div id="render-progress" class="bg-indigo-600 h-full w-0 transition-all duration-300"></div>
                </div>
                <p id="progress-text" class="text-xs font-mono text-indigo-400">0%</p>
            </div>

            <div id="finished-state" class="hidden">
                <div class="w-20 h-20 bg-green-100 text-green-500 rounded-full mx-auto flex items-center justify-center mb-6 text-3xl">
                    <i class="fas fa-check"></i>
                </div>
                <h3 class="text-2xl font-bold mb-4">GIF 생성 완료!</h3>
                <div class="aspect-square checkerboard rounded-2xl overflow-hidden mb-6 bg-slate-100 flex items-center justify-center border border-slate-100">
                    <img id="result-gif" class="max-w-full max-h-full object-contain" src="" alt="Result GIF">
                </div>
                <div class="flex gap-4">
                    <button id="download-btn" class="flex-grow bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-2xl shadow-lg transition-all flex items-center justify-center gap-2">
                        <i class="fas fa-download"></i> 다운로드
                    </button>
                    <button onclick="closeModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-6 py-4 rounded-2xl font-medium transition-all">
                        닫기
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="py-8 text-center text-slate-400 text-sm">
        <p>© 2026 AI Utility Web. 모든 작업은 브라우저 로컬에서 안전하게 처리됩니다.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
