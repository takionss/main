    <script>
        const uploadSection = document.getElementById('upload-section');
        const processingSection = document.getElementById('processing-section');
        const editorSection = document.getElementById('editor-section');
        const fileInput = document.getElementById('file-input');
        
        const imageCanvas = document.getElementById('image-canvas');
        const maskCanvas = document.getElementById('mask-canvas');
        const imgCtx = imageCanvas.getContext('2d');
        const maskCtx = maskCanvas.getContext('2d');
        
        const brushSlider = document.getElementById('brush-slider');
        const brushVal = document.getElementById('brush-val');
        const eraseBtn = document.getElementById('erase-btn');
        const clearMaskBtn = document.getElementById('clear-mask-btn');
        const downloadBtn = document.getElementById('download-btn');
        
        const canvasFrame = document.getElementById('canvas-frame');
        const cursorCircle = document.getElementById('cursor-circle');

        let originalImg = null;
        let isDrawing = false;
        let hasMask = false;
        let brushSize = 30;

        // 드래그 앤 드롭 이벤트 바인딩
        ['dragenter', 'dragover'].forEach(name => {
            uploadSection.addEventListener(name, (e) => {
                e.preventDefault();
                uploadSection.classList.add('border-pink-500', 'bg-pink-50/50');
            });
        });
        ['dragleave', 'drop'].forEach(name => {
            uploadSection.addEventListener(name, (e) => {
                e.preventDefault();
                uploadSection.classList.remove('border-pink-500', 'bg-pink-50/50');
            });
        });
        uploadSection.addEventListener('drop', (e) => {
            if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
        });
        document.getElementById('select-btn').onclick = () => fileInput.click();
        uploadSection.onclick = (e) => {
            if (e.target !== document.getElementById('select-btn')) fileInput.click();
        };
        fileInput.onchange = e => { if (e.target.files[0]) handleFile(e.target.files[0]); };

        function handleFile(file) {
            uploadSection.classList.add('hidden');
            processingSection.classList.remove('hidden');

            const url = URL.createObjectURL(file);
            originalImg = new Image();
            originalImg.src = url;
            originalImg.onload = () => {
                setupCanvas();
                processingSection.classList.add('hidden');
                editorSection.classList.remove('hidden');
                downloadBtn.disabled = false;
            };
        }

        function setupCanvas() {
            // 최대 너비 제한 (성능 및 스케일 유지용)
            const maxDimension = 1024;
            let width = originalImg.width;
            let height = originalImg.height;

            if (width > maxDimension || height > maxDimension) {
                if (width > height) {
                    height = Math.round((height * maxDimension) / width);
                    width = maxDimension;
                } else {
                    width = Math.round((width * maxDimension) / height);
                    height = maxDimension;
                }
            }

            imageCanvas.width = width;
            imageCanvas.height = height;
            maskCanvas.width = width;
            maskCanvas.height = height;

            imgCtx.drawImage(originalImg, 0, 0, width, height);
            
            // 마스크 투명 블랙 캔버스 초기화
            maskCtx.fillStyle = 'rgba(0,0,0,0)';
            maskCtx.fillRect(0, 0, width, height);

            initBrushEvents();
            updateBrushSize();
        }

        // 브러시 조절
        brushSlider.oninput = () => {
            brushSize = parseInt(brushSlider.value);
            updateBrushSize();
        };

        function updateBrushSize() {
            brushVal.textContent = `${brushSize}px`;
            cursorCircle.style.width = `${brushSize}px`;
            cursorCircle.style.height = `${brushSize}px`;
        }

        function initBrushEvents() {
            // 그리기 기능 구현 (마스크 캔버스에 핑크색 드로잉)
            function getMousePos(e) {
                const rect = imageCanvas.getBoundingClientRect();
                const scaleX = imageCanvas.width / rect.width;
                const scaleY = imageCanvas.height / rect.height;
                
                let clientX, clientY;
                if (e.touches && e.touches[0]) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY,
                    rawX: clientX - rect.left,
                    rawY: clientY - rect.top
                };
            }

            function drawStart(e) {
                isDrawing = true;
                const pos = getMousePos(e);
                maskCtx.beginPath();
                maskCtx.moveTo(pos.x, pos.y);
                
                maskCtx.lineWidth = brushSize;
                maskCtx.lineCap = 'round';
                maskCtx.lineJoin = 'round';
                maskCtx.strokeStyle = 'rgba(219, 39, 119, 1)'; // 마스크를 식별할 마커 칼라
                
                draw(e);
            }

            function draw(e) {
                const pos = getMousePos(e);
                
                // 브러시 커서 동그라미 배치
                cursorCircle.style.display = 'block';
                cursorCircle.style.left = `${pos.rawX}px`;
                cursorCircle.style.top = `${pos.rawY}px`;

                if (!isDrawing) return;
                e.preventDefault();

                maskCtx.lineTo(pos.x, pos.y);
                maskCtx.stroke();
                
                hasMask = true;
                eraseBtn.disabled = false;
                clearMaskBtn.disabled = false;
            }

            function drawEnd() {
                isDrawing = false;
                maskCtx.closePath();
            }

            // 마우스 이벤트
            imageCanvas.addEventListener('mousedown', drawStart);
            window.addEventListener('mousemove', (e) => {
                const rect = imageCanvas.getBoundingClientRect();
                if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
                    draw(e);
                } else {
                    cursorCircle.style.display = 'none';
                    isDrawing = false;
                }
            });
            window.addEventListener('mouseup', drawEnd);

            // 터치 이벤트
            imageCanvas.addEventListener('touchstart', drawStart);
            imageCanvas.addEventListener('touchmove', draw);
            imageCanvas.addEventListener('touchend', drawEnd);

            // 캔버스 프레임을 나갈 때 마우스 커서 숨기기
            canvasFrame.addEventListener('mouseleave', () => {
                cursorCircle.style.display = 'none';
            });
        }

        clearMaskBtn.onclick = () => {
            maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
            hasMask = false;
            eraseBtn.disabled = true;
            clearMaskBtn.disabled = true;
        };

        // 클라이언트 사이드 인페인팅 연산 (Diffusion)
        eraseBtn.onclick = async () => {
            if (!hasMask) return;
            
            editorSection.classList.add('hidden');
            processingSection.classList.remove('hidden');

            // 브라우저 렌더 락 방지용 setTimeout
            setTimeout(() => {
                runInpainting();
                processingSection.classList.add('hidden');
                editorSection.classList.remove('hidden');
                
                // 마스크 클리어
                maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
                hasMask = false;
                eraseBtn.disabled = true;
                clearMaskBtn.disabled = true;
            }, 100);
        };

        function runInpainting() {
            const w = imageCanvas.width;
            const h = imageCanvas.height;
            
            const imgData = imgCtx.getImageData(0, 0, w, h);
            const maskData = maskCtx.getImageData(0, 0, w, h);
            
            const pixels = imgData.data;
            const maskPixels = maskData.data;
            
            // 1. 마스크 마커 검출 (핑크색 칠해진 영역을 바이너리 마스크로 매핑)
            const mask = new Uint8Array(w * h);
            let hasMaskPixel = false;
            for (let i = 0; i < w * h; i++) {
                const idx = i * 4;
                // 알파 값이 일정값 이상이고, 분홍색 감지
                if (maskPixels[idx + 3] > 50) {
                    mask[i] = 1;
                    hasMaskPixel = true;
                }
            }

            if (!hasMaskPixel) return;

            // 2. 다중 반복 픽셀 확산 (Multi-pass Boundary Color Propagation)
            // 경계선에 있는 마스크 픽셀의 색상을 외부 비마스크 픽셀들의 가중 평균값으로 연쇄적으로 물들여 채워 나감
            const tempPixels = new Uint8ClampedArray(pixels);
            const workingMask = new Uint8Array(mask);
            
            let pixelsToFill = 0;
            for(let i=0; i<w*h; i++) if (workingMask[i] === 1) pixelsToFill++;
            
            let maxIterations = 60; // 확산 한도
            let step = 0;
            
            while (pixelsToFill > 0 && step < maxIterations) {
                const nextMask = new Uint8Array(workingMask);
                const passPixels = new Uint8ClampedArray(tempPixels);
                let filledThisPass = 0;

                for (let y = 1; y < h - 1; y++) {
                    for (let x = 1; x < w - 1; x++) {
                        const idx = y * w + x;
                        if (workingMask[idx] === 1) {
                            // 주변 8방향 이웃 탐색
                            let rSum = 0, gSum = 0, bSum = 0, count = 0;
                            
                            // 3x3 커널로 비마스크 픽셀 색상 수집
                            for (let ky = -1; ky <= 1; ky++) {
                                for (let kx = -1; kx <= 1; kx++) {
                                    const nIdx = (y + ky) * w + (x + kx);
                                    if (workingMask[nIdx] === 0) {
                                        const pixIdx = nIdx * 4;
                                        rSum += passPixels[pixIdx];
                                        gSum += passPixels[pixIdx + 1];
                                        bSum += passPixels[pixIdx + 2];
                                        count++;
                                    }
                                }
                            }
                            
                            // 비마스크 이웃이 있다면 평균값으로 메움 (경계 픽셀)
                            if (count > 0) {
                                const targetIdx = idx * 4;
                                tempPixels[targetIdx] = rSum / count;
                                tempPixels[targetIdx + 1] = gSum / count;
                                tempPixels[targetIdx + 2] = bSum / count;
                                nextMask[idx] = 0; // 마스크 채워짐 표시
                                filledThisPass++;
                            }
                        }
                    }
                }

                if (filledThisPass === 0) {
                    // 더 이상 경계면을 만날 수 없다면 커널 크기 확장 (구멍의 깊은 빈공간 대응)
                    // 단순 상하좌우 무차별 번짐 처리
                    for (let y = 1; y < h - 1; y++) {
                        for (let x = 1; x < w - 1; x++) {
                            const idx = y * w + x;
                            if (workingMask[idx] === 1) {
                                const targetIdx = idx * 4;
                                // 가장 가까이 있는 픽셀 색 복사
                                let r = 128, g = 128, b = 128, found = false;
                                for (let dist = 2; dist < 12; dist++) {
                                    const neighbors = [
                                        {x: x - dist, y: y}, {x: x + dist, y: y},
                                        {x: x, y: y - dist}, {x: x, y: y + dist}
                                    ];
                                    for (let n of neighbors) {
                                        if (n.x >= 0 && n.x < w && n.y >= 0 && n.y < h) {
                                            const nIdx = n.y * w + n.x;
                                            if (workingMask[nIdx] === 0) {
                                                const pixIdx = nIdx * 4;
                                                r = passPixels[pixIdx];
                                                g = passPixels[pixIdx + 1];
                                                b = passPixels[pixIdx + 2];
                                                found = true;
                                                break;
                                            }
                                        }
                                    }
                                    if (found) break;
                                }
                                tempPixels[targetIdx] = r;
                                tempPixels[targetIdx + 1] = g;
                                tempPixels[targetIdx + 2] = b;
                                nextMask[idx] = 0;
                                filledThisPass++;
                            }
                        }
                    }
                }

                workingMask.set(nextMask);
                pixelsToFill -= filledThisPass;
                step++;
            }

            // 3. 인페인팅 후 경계면 부드러운 블러링 필터 (Bilateral/Gaussian Blend 모사)
            // 메워진 경계면의 픽셀 계단 현상을 문질러 자연스러운 그라데이션 형성
            const finalPixels = imgCtx.createImageData(w, h);
            finalPixels.data.set(tempPixels);
            
            // 원본 마스크 경계에 3px 가우시안 스무딩 적용
            for (let y = 2; y < h - 2; y++) {
                for (let x = 2; x < w - 2; x++) {
                    const idx = y * w + x;
                    // 원래 마스크 영역이었던 부근만 보정
                    if (mask[idx] === 1) {
                        const pixIdx = idx * 4;
                        let rSum = 0, gSum = 0, bSum = 0, total = 0;
                        for (let ky = -2; ky <= 2; ky++) {
                            for (let kx = -2; kx <= 2; kx++) {
                                const nIdx = ((y + ky) * w + (x + kx)) * 4;
                                rSum += tempPixels[nIdx];
                                gSum += tempPixels[nIdx + 1];
                                bSum += tempPixels[nIdx + 2];
                                total++;
                            }
                        }
                        finalPixels.data[pixIdx] = rSum / total;
                        finalPixels.data[pixIdx + 1] = gSum / total;
                        finalPixels.data[pixIdx + 2] = bSum / total;
                    }
                }
            }

            imgCtx.putImageData(finalPixels, 0, 0);
        }

        downloadBtn.onclick = () => {
            const link = document.createElement('a');
            link.href = imageCanvas.toDataURL('image/png');
            link.download = "smileslife_erased.png";
            link.click();
        };
    </script>
</body>
