<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 배경 제거기 | SmilesLife</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .checkerboard {
            background-image: linear-gradient(45deg, #f0f0f0 25%, transparent 25%), linear-gradient(-45deg, #f0f0f0 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #f0f0f0 75%), linear-gradient(-45deg, transparent 75%, #f0f0f0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
    </style>
    <script>
        // 1. [강력 조치] 방해되는 모든 서비스 워커 강제 제거 및 초기화
        async function clearServiceWorkers() {
            if ('serviceWorker' in navigator) {
                const registrations = await navigator.serviceWorker.getRegistrations();
                if (registrations.length > 0) {
                    for (let registration of registrations) {
                        await registration.unregister();
                    }
                    console.log("Old Service Workers Cleared. Reloading...");
                    window.location.reload(); // 깨끗한 상태로 다시 시작
                }
            }
        }
        clearServiceWorkers();

        // 2. 드래그 앤 드롭 새 창 열림 방지 (즉시 실행)
        window.addEventListener('dragover', e => e.preventDefault(), false);
        window.addEventListener('drop', e => e.preventDefault(), false);
    </script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans text-slate-900">

    <header class="bg-white shadow-sm py-6 relative">
        <a href="../../index.html" class="absolute left-8 top-1/2 -translate-y-1/2 text-slate-400 hover:text-indigo-600 transition-colors flex items-center gap-2">
            <i class="fas fa-home"></i> 홈으로
        </a>
        <h1 class="text-2xl font-bold text-center text-indigo-600 tracking-tight">AI 배경 제거기</h1>
    </header>

    <main class="flex-grow container mx-auto px-4 py-12 max-w-4xl">
        <div id="init-loader" class="mb-8 p-6 rounded-3xl bg-white border border-indigo-50 shadow-sm flex flex-col items-center gap-4">
            <div class="flex items-center gap-3 text-indigo-600 font-bold">
                <div class="animate-spin w-5 h-5 border-2 border-current border-t-transparent rounded-full"></div>
                <span>AI 엔진을 연결하는 중...</span>
            </div>
            <p class="text-slate-400 text-xs text-center leading-relaxed">
                인터넷 속도에 따라 최대 10초 정도 걸릴 수 있습니다.<br>
                변화가 없다면 <b>새로고침(F5)</b>을 한 번 더 해주세요.
            </p>
        </div>

        <section id="upload-section" class="hidden bg-white rounded-3xl shadow-xl p-12 border-2 border-dashed border-indigo-100 flex flex-col items-center transition-all animate-fade-in">
            <div class="w-20 h-20 bg-indigo-50 rounded-full flex items-center justify-center mb-6 text-indigo-500 text-3xl">
                <i class="fas fa-cloud-upload-alt"></i>
            </div>
            <h2 class="text-2xl font-bold mb-8 text-center text-slate-700">이미지를 여기로 끌어다 놓으세요</h2>
            <input type="file" id="file-input" class="hidden" accept="image/*">
            <button id="select-btn" class="bg-indigo-600 text-white px-10 py-4 rounded-2xl font-bold shadow-lg hover:bg-indigo-700 transition-all active:scale-95">
                이미지 선택하기
            </button>
        </section>

        <section id="processing-section" class="hidden bg-white rounded-3xl shadow-xl p-12 text-center">
            <div class="animate-bounce text-5xl text-indigo-600 mb-8"><i class="fas fa-magic"></i></div>
            <h2 id="proc-title" class="text-2xl font-bold mb-4">AI 마법을 부리는 중...</h2>
            <p id="proc-msg" class="text-slate-400 text-sm mb-8 italic">처음 실행 시 AI 모델(약 40MB) 다운로드가 진행됩니다.</p>
            <div class="w-full max-w-sm mx-auto bg-slate-100 h-3 rounded-full overflow-hidden shadow-inner">
                <div id="progress-bar" class="bg-gradient-to-r from-indigo-500 to-purple-500 h-full w-0 transition-all duration-300"></div>
            </div>
        </section>

        <section id="result-section" class="hidden space-y-8 animate-fade-in">
            <div class="grid md:grid-cols-2 gap-8">
                <div class="bg-white p-4 rounded-3xl shadow-lg border border-slate-50">
                    <h3 class="text-xs font-bold text-slate-400 mb-4 uppercase tracking-widest text-center">Original</h3>
                    <div class="aspect-square bg-slate-50 rounded-2xl overflow-hidden flex items-center justify-center">
                        <img id="original-preview" class="max-w-full max-h-full object-contain">
                    </div>
                </div>
                <div class="bg-white p-4 rounded-3xl shadow-lg border-2 border-indigo-100">
                    <h3 class="text-xs font-bold text-indigo-500 mb-4 uppercase tracking-widest text-center">AI Result</h3>
                    <div class="aspect-square checkerboard rounded-2xl overflow-hidden flex items-center justify-center shadow-inner">
                        <img id="result-preview" class="max-w-full max-h-full object-contain">
                    </div>
                </div>
            </div>
            <div class="flex flex-col sm:flex-row justify-center gap-4 py-4">
                <button id="download-btn" class="bg-green-500 text-white px-10 py-4 rounded-2xl font-bold shadow-xl hover:bg-green-600 transition-all">다운로드 (PNG)</button>
                <button onclick="location.reload()" class="bg-slate-200 text-slate-700 px-8 py-4 rounded-2xl font-medium">다른 이미지 하기</button>
            </div>
        </section>
    </main>

    <script type="module">
        // 가장 안정적인 ESM 방식으로 라이브러리 로드
        import imglyRemoveBackground from 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/+esm';

        const fileInput = document.getElementById('file-input');
        const selectBtn = document.getElementById('select-btn');
        const uploadSection = document.getElementById('upload-section');
        const processingSection = document.getElementById('processing-section');
        const resultSection = document.getElementById('result-section');
        const progressBar = document.getElementById('progress-bar');
        const procTitle = document.getElementById('proc-title');
        const procMsg = document.getElementById('proc-msg');
        const initLoader = document.getElementById('init-loader');

        // 엔진 로드 체크 및 UI 전환
        if (imglyRemoveBackground) {
            console.log("AI Engine Connected Successfully!");
            initLoader.classList.add('hidden');
            uploadSection.classList.remove('hidden');
        }

        selectBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', e => {
            if (e.target.files.length > 0) handleFiles(e.target.files[0]);
        });

        // 업로드 섹션 드롭 지원
        uploadSection.addEventListener('drop', e => {
            e.preventDefault();
            if (e.dataTransfer.files.length > 0) handleFiles(e.dataTransfer.files[0]);
        });

        async function handleFiles(file) {
            if (!file.type.startsWith('image/')) return alert('이미지 파일만 선택해 주세요.');

            uploadSection.classList.add('hidden');
            processingSection.classList.remove('hidden');
            document.getElementById('original-preview').src = URL.createObjectURL(file);

            try {
                const blob = await imglyRemoveBackground(file, {
                    progress: (p) => {
                        const percent = Math.round(p * 100);
                        progressBar.style.width = percent + '%';
                        if (p < 0.9) {
                            procMsg.textContent = `AI 모델을 다운로드하고 있습니다... ${percent}%`;
                        } else {
                            procTitle.textContent = "배경 제거 작업 중...";
                            procMsg.textContent = "거의 완료되었습니다! 조금만 더 기다려 주세요.";
                        }
                    },
                    model: 'medium'
                });

                document.getElementById('result-preview').src = URL.createObjectURL(blob);
                processingSection.classList.add('hidden');
                resultSection.classList.remove('hidden');

                document.getElementById('download-btn').onclick = () => {
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = file.name.replace(/\.[^/.]+$/, "") + "_smileslife_nobg.png";
                    a.click();
                };
            } catch (error) {
                console.error(error);
                alert("작업 중 오류가 발생했습니다: " + error.message + "\n다시 한번 시도해 주세요.");
                location.reload();
            }
        }
    </script>
</body>
</html>
