<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 배경 제거기 | SmilesLife</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .checkerboard {
            background-image: linear-gradient(45deg, #f0f0f0 25%, transparent 25%), linear-gradient(-45deg, #f0f0f0 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #f0f0f0 75%), linear-gradient(-45deg, transparent 75%, #f0f0f0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
    </style>
    <script>
        // [초긴급] 기존에 설치된 잘못된 보안 서비스 워커 제거
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(registrations => {
                for(let registration of registrations) {
                    registration.unregister();
                    console.log("Old ServiceWorker Unregistered");
                }
            });
        }
        // 드래그 앤 드롭 새 창 열림 방지 (최우선 실행)
        window.addEventListener('dragover', e => e.preventDefault(), false);
        window.addEventListener('drop', e => e.preventDefault(), false);
    </script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans text-slate-900">

    <header class="bg-white shadow-sm py-6 relative">
        <a href="../../index.html" class="absolute left-8 top-1/2 -translate-y-1/2 text-slate-400 hover:text-indigo-600 transition-colors flex items-center gap-2">
            <i class="fas fa-home"></i> 홈으로
        </a>
        <h1 class="text-2xl font-bold text-center text-indigo-600">AI 배경 제거기</h1>
    </header>

    <main class="flex-grow container mx-auto px-4 py-12 max-w-4xl">
        <div id="status-bar" class="mb-8 p-4 rounded-xl bg-blue-50 border border-blue-200 text-blue-800 text-sm text-center">
            엔진 초기화 중... 잠시만 기다려 주세요.
        </div>

        <section id="upload-section" class="bg-white rounded-3xl shadow-xl p-12 border-2 border-dashed border-indigo-100 flex flex-col items-center">
            <i class="fas fa-cloud-upload-alt text-5xl text-indigo-200 mb-6"></i>
            <h2 class="text-xl font-bold mb-8">이미지를 드래그하거나 선택하세요</h2>
            <input type="file" id="file-input" class="hidden" accept="image/*">
            <button id="select-btn" class="bg-indigo-600 text-white px-10 py-4 rounded-2xl font-bold shadow-lg hover:bg-indigo-700 transition-all">
                이미지 선택하기
            </button>
        </section>

        <section id="loading-section" class="hidden bg-white rounded-3xl shadow-xl p-12 text-center">
            <div class="animate-spin text-4xl text-indigo-600 mb-6"><i class="fas fa-circle-notch"></i></div>
            <h2 id="loading-title" class="text-xl font-bold mb-2">AI 분석 중...</h2>
            <p id="loading-msg" class="text-slate-500 text-sm mb-6">최초 1회 모델 다운로드 중 (약 40MB)</p>
            <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-indigo-600 h-full w-0 transition-all"></div>
            </div>
        </section>

        <section id="result-section" class="hidden space-y-8">
            <div class="grid md:grid-cols-2 gap-8">
                <div class="bg-white p-4 rounded-2xl shadow shadow-inner"><img id="original-preview" class="w-full h-auto rounded-lg"></div>
                <div class="bg-white p-4 rounded-2xl shadow checkerboard"><img id="result-preview" class="w-full h-auto rounded-lg"></div>
            </div>
            <div class="flex justify-center gap-4">
                <button id="download-btn" class="bg-green-500 text-white px-8 py-4 rounded-xl font-bold shadow-lg">다운로드</button>
                <button onclick="location.reload()" class="bg-slate-200 text-slate-700 px-8 py-4 rounded-xl">다시 하기</button>
            </div>
        </section>
    </main>

    <!-- 라이브러리 로드 (CORS 문제 방지를 위해 crossorigin 추가) -->
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/bundle.js" crossorigin="anonymous"></script>

    <script>
        const fileInput = document.getElementById('file-input');
        const selectBtn = document.getElementById('select-btn');
        const uploadSection = document.getElementById('upload-section');
        const loadingSection = document.getElementById('loading-section');
        const resultSection = document.getElementById('result-section');
        const progressBar = document.getElementById('progress-bar');
        const loadingTitle = document.getElementById('loading-title');
        const loadingMsg = document.getElementById('loading-msg');
        const statusBar = document.getElementById('status-bar');

        // 엔진 로드 체크
        window.onload = () => {
            if (typeof imglyRemoveBackground !== 'undefined') {
                statusBar.textContent = "엔진 준비 완료! 이미지를 업로드해 주세요.";
                statusBar.className = "mb-8 p-4 rounded-xl bg-green-50 border border-green-200 text-green-800 text-sm text-center";
            } else {
                statusBar.textContent = "엔진 로드 실패. 인터넷 연결을 확인하고 새로고침 해주세요.";
                statusBar.className = "mb-8 p-4 rounded-xl bg-red-50 border border-red-200 text-red-800 text-sm text-center";
            }
        };

        selectBtn.addEventListener('click', () => fileInput.click());

        uploadSection.addEventListener('drop', e => {
            e.preventDefault();
            if (e.dataTransfer.files.length > 0) handleFiles(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', e => {
            if (e.target.files.length > 0) handleFiles(e.target.files[0]);
        });

        async function handleFiles(file) {
            if (!file.type.startsWith('image/')) return alert('이미지 파일만 가능합니다.');
            if (typeof imglyRemoveBackground === 'undefined') return alert('엔진이 아직 준비되지 않았습니다.');

            uploadSection.classList.add('hidden');
            loadingSection.classList.remove('hidden');
            document.getElementById('original-preview').src = URL.createObjectURL(file);

            try {
                const blob = await imglyRemoveBackground(file, {
                    progress: (p) => {
                        const percent = Math.round(p * 100);
                        progressBar.style.width = percent + '%';
                        if (p < 0.9) {
                            loadingMsg.textContent = "AI 모델 다운로드 중... " + percent + "%";
                        } else {
                            loadingTitle.textContent = "배경 제거 중...";
                            loadingMsg.textContent = "거의 완료되었습니다!";
                        }
                    }
                });

                document.getElementById('result-preview').src = URL.createObjectURL(blob);
                loadingSection.classList.add('hidden');
                resultSection.classList.remove('hidden');

                document.getElementById('download-btn').onclick = () => {
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = "result_nobg.png";
                    a.click();
                };
            } catch (error) {
                alert("오류 발생: " + error.message);
                location.reload();
            }
        }
    </script>
</body>
</html>
