        let currentLang = 'ko';

        function initLanguage() {
            const urlParams = new URLSearchParams(window.location.search);
            let lang = urlParams.get('lang') || localStorage.getItem('smileslife-preferred-lang');
            
            if (!lang) {
                const userLang = navigator.language || navigator.userLanguage;
                if (userLang.startsWith('ko')) lang = 'ko';
                else if (userLang.startsWith('es')) lang = 'es';
                else if (userLang.startsWith('ja')) lang = 'ja';
                else if (userLang.startsWith('zh')) lang = 'zh-TW';
                else lang = 'en';
            } else {
                if (lang === 'ko' || lang === 'ko-kr') lang = 'ko';
                else if (lang === 'es') lang = 'es';
                else if (lang === 'ja') lang = 'ja';
                else if (lang.startsWith('zh')) lang = 'zh-TW';
                else lang = 'en';
            }
            
            currentLang = lang;
            document.getElementById('lang-select').value = lang;
            applyLanguage(lang);
            localStorage.setItem('smileslife-preferred-lang', lang);
        }

        function applyLanguage(lang) {
            const t = TRANSLATIONS[lang] || TRANSLATIONS['ko'];
            
            document.title = t.title;
            const descMeta = document.querySelector('meta[name="description"]');
            if (descMeta) descMeta.setAttribute('content', t.metaDesc);
            const ogTitle = document.querySelector('meta[property="og:title"]');
            if (ogTitle) ogTitle.setAttribute('content', t.metaOgTitle);
            const ogDesc = document.querySelector('meta[property="og:description"]');
            if (ogDesc) ogDesc.setAttribute('content', t.metaDesc);
            
            document.getElementById('header-title').textContent = t.headerTitle;
            
            if (elements.status && !elements.status.classList.contains('hidden')) {
                document.getElementById('engine-text').textContent = t.engineLoading;
            }
            
            document.getElementById('sidebar-title-text').textContent = t.sidebarTitle;
            document.getElementById('label-shrink').textContent = t.labelShrink;
            document.getElementById('help-shrink').textContent = t.helpShrink;
            document.getElementById('label-smooth').textContent = t.labelSmooth;
            document.getElementById('label-thresh').textContent = t.labelThresh;
            
            document.getElementById('download-btn-text').textContent = t.downloadBtn;
            document.getElementById('download-desc').textContent = t.downloadDesc;
            
            document.getElementById('upload-title').textContent = t.uploadTitle;
            document.getElementById('upload-desc').textContent = t.uploadDesc;
            document.getElementById('select-btn-text').textContent = t.selectBtn;
            
            document.getElementById('preview-title-text').textContent = t.previewTitle;
            document.getElementById('loading-title').textContent = t.loadingTitle;
            document.getElementById('loading-desc').textContent = t.loadingDesc;
            document.getElementById('reset-btn-text').textContent = t.resetBtn;
        }

        document.getElementById('lang-select').onchange = (e) => {
            const newLang = e.target.value;
            const url = new URL(window.location.href);
            url.searchParams.set('lang', newLang);
            window.history.pushState({}, '', url);
            currentLang = newLang;
            applyLanguage(newLang);
            localStorage.setItem('smileslife-preferred-lang', newLang);
        };

        // Initialize language settings before loading the model
        initLanguage();

        // 엔진 로드 (직접 ONNX 세션을 생성하여 Transformers.js의 라이브러리 차원 CORS 버그 회피)
        async function init() {
            try {
                // briaai/RMBG-1.4의 정량화(Quantized) 모델 ONNX 파일을 직접 로드 (약 43MB)
                session = await ort.InferenceSession.create(
                    'https://huggingface.co/briaai/RMBG-1.4/resolve/main/onnx/model_quantized.onnx',
                    {
                        executionProviders: ['wasm'],
                        freeDimensionOverrides: {}
                    }
                );
                
                elements.status.classList.add('hidden');
                elements.upload.classList.remove('hidden');
                console.log("Pro AI Engine (RMBG-1.4 via ONNX Web) Ready!");
            } catch (err) {
                const t = TRANSLATIONS[currentLang] || TRANSLATIONS['ko'];
                document.getElementById('engine-text').textContent = t.engineFail + err.message;
                console.error(err);
            }
        }
        init();

        document.getElementById('select-btn').onclick = () => document.getElementById('file-input').click();
        document.getElementById('file-input').onchange = e => { if (e.target.files[0]) handleFile(e.target.files[0]); };

        async function handleFile(file) {
            elements.upload.classList.add('hidden');
            elements.preview.classList.remove('hidden');
            elements.loading.classList.remove('hidden');

            const url = URL.createObjectURL(file);
            originalImg = new Image();
            originalImg.src = url;
            await originalImg.decode();

            // 브라우저가 화면을 즉시 갱신하고 로딩 오버레이를 그리도록 딜레이 부여
            setTimeout(async () => {
                try {
                    // 1. 이미지 전처리 (1024x1024 해상도로 픽셀 추출)
                    const inputCanvas = document.createElement('canvas');
                    inputCanvas.width = 1024;
                    inputCanvas.height = 1024;
                    const iCtx = inputCanvas.getContext('2d');
                    iCtx.drawImage(originalImg, 0, 0, 1024, 1024);

                    const imgData = iCtx.getImageData(0, 0, 1024, 1024);
                    const pixels = imgData.data;

                    // 2. [1, 3, 1024, 1024] 채널 우선 형태로 데이터 변환 및 정규화
                    const floatData = new Float32Array(3 * 1024 * 1024);
                    const imageSize = 1024 * 1024;

                    for (let i = 0; i < imageSize; i++) {
                        const r = pixels[i * 4];
                        const g = pixels[i * 4 + 1];
                        const b = pixels[i * 4 + 2];

                        // 정규화 공식: (x / 255.0) - 0.5 (mean 0.5, std 1.0)
                        floatData[i] = (r / 255.0) - 0.5;
                        floatData[i + imageSize] = (g / 255.0) - 0.5;
                        floatData[i + 2 * imageSize] = (b / 255.0) - 0.5;
                    }

                    // 3. 인퍼런스용 텐서 생성
                    const inputTensor = new ort.Tensor('float32', floatData, [1, 3, 1024, 1024]);

                    // 4. 모델 실행
                    const feeds = {};
                    feeds[session.inputNames[0]] = inputTensor;
                    const outputMap = await session.run(feeds);
                    
                    // 마스크 결과 데이터 추출
                    rawMask = outputMap[session.outputNames[0]];

                    elements.loading.classList.add('hidden');
                    elements.download.disabled = false;
                    applyCorrection();
                } catch (err) {
                    const t = TRANSLATIONS[currentLang] || TRANSLATIONS['ko'];
                    alert(t.errorProc + err.message);
                    location.reload();
                }
            }, 50);
        }

        function applyCorrection() {
            if (!originalImg || !rawMask) return;

            const w = originalImg.width;
            const h = originalImg.height;
            elements.canvas.width = w;
            elements.canvas.height = h;
            const ctx = elements.canvas.getContext('2d');

            const shrink = parseInt(elements.shrink.value);
            const smooth = parseInt(elements.smooth.value);
            const thresh = parseInt(elements.thresh.value) / 100; // 0~1 사이 값

            // 1. 마스크 텐서 데이터를 기반으로 1024x1024 크기의 마스크 캔버스 생성
            const maskData = rawMask.data;
            const maskWidth = 1024;
            const maskHeight = 1024;

            const mCanvas = document.createElement('canvas');
            mCanvas.width = maskWidth;
            mCanvas.height = maskHeight;
            const mCtx = mCanvas.getContext('2d');
            const mData = mCtx.createImageData(maskWidth, maskHeight);
            for (let i = 0; i < maskData.length; i++) {
                const v = Math.round(maskData[i] * 255);
                const idx = i * 4;
                mData.data[idx] = v;     // R
                mData.data[idx+1] = v;   // G
                mData.data[idx+2] = v;   // B
                mData.data[idx+3] = v;   // A (알파 채널을 마스크 신뢰도 값으로 할당하여 투명 배경화 처리)
            }
            mCtx.putImageData(mData, 0, 0);

            // 2. 합성
            ctx.clearRect(0, 0, w, h);
            ctx.save();
            
            // --- 정밀 보정 알고리즘 (Erosion + Smooth) ---
            // shrink: 테두리를 안쪽으로 깎아냄 (Contrast를 높이고 Brightness를 낮춤)
            // smooth: 흐릿하게 뭉갬 (Blur)
            const blurSize = smooth;
            const contrast = 100 + (shrink * 120); 
            const brightness = 100 - (shrink * 18); 
            
            ctx.filter = `blur(${blurSize}px) contrast(${contrast}%) brightness(${brightness}%)`;
            ctx.drawImage(mCanvas, 0, 0, w, h);
            
            ctx.globalCompositeOperation = 'source-in';
            ctx.filter = 'none'; 
            ctx.drawImage(originalImg, 0, 0);
            ctx.restore();

            // 3. 미세 잔상 임계값 필터 (Threshold)
            const finalData = ctx.getImageData(0, 0, w, h);
            const p = finalData.data;
            for (let i = 0; i < p.length; i += 4) {
                if (p[i+3] < (thresh * 255)) p[i+3] = 0;
            }
            ctx.putImageData(finalData, 0, 0);
        }

        ['shrink', 'smooth', 'thresh'].forEach(key => {
            elements[key].oninput = (e) => {
                elements[key + 'Val'].textContent = e.target.value;
                applyCorrection();
            };
        });

        elements.download.onclick = () => {
            const link = document.createElement('a');
            link.href = elements.canvas.toDataURL('image/png');
            link.download = "smileslife_pro_refined.png";
            link.click();
        };

        // 드래그 앤 드롭
        window.ondragover = e => e.preventDefault();
        window.ondrop = e => {
            e.preventDefault();
            if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
        };
    </script>
</body>
</html>
