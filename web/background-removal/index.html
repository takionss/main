<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 배경 제거기 | 스마트한 누끼 따기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 1. 보안 통행증 우선 로드 -->
    <script src="../../coi-serviceworker.js"></script>
    <!-- 2. AI 엔진 라이브러리 직접 로드 (전역 변수 방식) -->
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/bundle.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans text-slate-900">

    <header class="bg-white shadow-sm py-6 relative">
        <a href="../../index.html" class="absolute left-8 top-1/2 -translate-y-1/2 text-slate-400 hover:text-indigo-600 transition-colors flex items-center gap-2 font-medium">
            <i class="fas fa-home"></i> 홈으로
        </a>
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-3xl font-bold text-indigo-600 flex items-center justify-center gap-2">
                <i class="fas fa-magic"></i> AI 배경 제거기
            </h1>
            <p class="text-slate-500 mt-2 text-sm md:text-base text-center">서버 전송 없는 100% 개인정보 보호 배경 제거 서비스</p>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-4xl">
        
        <!-- 상태 안내 영역 -->
        <div id="status-bar" class="mb-8 p-4 rounded-2xl bg-blue-50 border border-blue-100 text-blue-800 text-sm flex items-center justify-center gap-3 transition-all">
            <div id="status-spinner" class="animate-spin w-4 h-4 border-2 border-blue-600 border-t-transparent rounded-full"></div>
            <p id="status-text">AI 엔진을 불러오는 중입니다...</p>
        </div>
        
        <section id="upload-section" class="bg-white rounded-3xl shadow-xl p-8 md:p-12 border-2 border-dashed border-indigo-100 hover:border-indigo-400 transition-all duration-300 opacity-50 pointer-events-none">
            <div id="drop-zone" class="flex flex-col items-center justify-center cursor-pointer py-10">
                <div class="w-20 h-20 bg-indigo-50 rounded-full flex items-center justify-center mb-6 text-indigo-500 text-3xl">
                    <i class="fas fa-cloud-upload-alt"></i>
                </div>
                <h2 class="text-2xl font-semibold mb-2 text-center">이미지를 드래그하거나 클릭하세요</h2>
                <p class="text-slate-400 mb-8 text-sm">엔진 로드가 완료되면 활성화됩니다.</p>
                <input type="file" id="file-input" class="hidden" accept="image/*">
                <button id="select-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-xl font-medium transition-colors shadow-lg disabled:bg-slate-300" disabled>
                    이미지 선택하기
                </button>
            </div>
        </section>

        <!-- 로딩 애니메이션 (작업 중 표시) -->
        <section id="loading-section" class="hidden bg-white rounded-3xl shadow-xl p-12 text-center animate-fade-in">
            <div class="flex flex-col items-center">
                <div class="relative w-24 h-24 mb-6">
                    <div class="absolute inset-0 border-4 border-indigo-50 rounded-full"></div>
                    <div class="absolute inset-0 border-4 border-indigo-600 rounded-full border-t-transparent animate-spin"></div>
                </div>
                <h2 class="text-2xl font-semibold mb-2">배경 지우는 중...</h2>
                <p id="proc-msg" class="text-slate-500 text-sm">AI가 이미지를 분석하고 있습니다.</p>
                <div class="w-full max-w-xs bg-slate-100 h-2 rounded-full mt-8 overflow-hidden">
                    <div id="progress-bar" class="bg-indigo-600 h-full w-0 transition-all duration-300"></div>
                </div>
            </div>
        </section>

        <!-- 결과 표시 -->
        <section id="result-section" class="hidden space-y-8 animate-fade-in">
            <div class="grid md:grid-cols-2 gap-8">
                <div class="bg-white p-4 rounded-3xl shadow-lg">
                    <h3 class="text-xs font-bold text-slate-400 mb-4 uppercase">Original</h3>
                    <div class="aspect-square bg-slate-50 rounded-2xl overflow-hidden flex items-center justify-center">
                        <img id="original-preview" class="max-w-full max-h-full object-contain" src="">
                    </div>
                </div>
                <div class="bg-white p-4 rounded-3xl shadow-lg border-2 border-indigo-50">
                    <h3 class="text-xs font-bold text-indigo-500 mb-4 uppercase">Transparent Result</h3>
                    <div class="aspect-square checkerboard rounded-2xl overflow-hidden flex items-center justify-center">
                        <img id="result-preview" class="max-w-full max-h-full object-contain" src="">
                    </div>
                </div>
            </div>
            <div class="flex flex-col sm:flex-row items-center justify-center gap-4 py-4">
                <button id="download-btn" class="w-full sm:w-auto bg-green-500 hover:bg-green-600 text-white px-10 py-4 rounded-2xl font-bold shadow-lg flex items-center justify-center gap-2 text-lg">
                    <i class="fas fa-download"></i> PNG 다운로드
                </button>
                <button id="retry-btn" class="w-full sm:w-auto bg-slate-200 hover:bg-slate-300 text-slate-700 px-8 py-4 rounded-2xl font-medium flex items-center justify-center gap-2">
                    <i class="fas fa-redo"></i> 다시 하기
                </button>
            </div>
        </section>
    </main>

    <footer class="py-8 text-center text-slate-400 text-xs">
        <p>© 2026 AI Utility Web. 브라우저 로컬 WASM 엔진을 사용하여 안전합니다.</p>
    </footer>

    <!-- 메인 로직 (모듈 아님, 일반 스크립트로 로드) -->
    <script src="script.js"></script>
</body>
</html>
