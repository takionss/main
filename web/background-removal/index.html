<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 배경 제거기 (v2) | SmilesLife</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 구글 Mediapipe 엔진 (보안 설정 필요 없음) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
    <style>
        .checkerboard {
            background-image: linear-gradient(45deg, #f0f0f0 25%, transparent 25%), linear-gradient(-45deg, #f0f0f0 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #f0f0f0 75%), linear-gradient(-45deg, transparent 75%, #f0f0f0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans text-slate-900">

    <header class="bg-white shadow-sm py-6 relative">
        <a href="../../index.html" class="absolute left-8 top-1/2 -translate-y-1/2 text-slate-400 hover:text-indigo-600 transition-colors">
            <i class="fas fa-home"></i> 홈으로
        </a>
        <h1 class="text-2xl font-bold text-center text-indigo-600 tracking-tight">AI 배경 제거기 (v2)</h1>
    </header>

    <main class="flex-grow container mx-auto px-4 py-12 max-w-4xl">
        <div id="loading-engine" class="mb-8 p-4 rounded-xl bg-blue-50 border border-blue-100 text-blue-800 text-sm text-center flex items-center justify-center gap-3">
            <div class="animate-spin w-4 h-4 border-2 border-current border-t-transparent rounded-full"></div>
            <span>AI 엔진 로딩 중...</span>
        </div>

        <section id="upload-section" class="bg-white rounded-3xl shadow-xl p-12 border-2 border-dashed border-indigo-100 flex flex-col items-center">
            <i class="fas fa-cloud-upload-alt text-6xl text-indigo-100 mb-6"></i>
            <h2 class="text-xl font-bold mb-8 text-slate-700">이미지를 드래그하거나 선택하세요</h2>
            <input type="file" id="file-input" class="hidden" accept="image/*">
            <button id="select-btn" class="bg-indigo-600 text-white px-10 py-4 rounded-2xl font-bold shadow-lg hover:bg-indigo-700 active:scale-95 transition-all">
                이미지 선택하기
            </button>
        </section>

        <section id="processing-section" class="hidden bg-white rounded-3xl shadow-xl p-12 text-center animate-pulse">
            <div class="text-5xl text-indigo-600 mb-6"><i class="fas fa-magic"></i></div>
            <h2 class="text-2xl font-bold mb-2">배경 제거 중...</h2>
            <p class="text-slate-400 text-sm">잠시만 기다려 주세요.</p>
        </section>

        <section id="result-section" class="hidden space-y-8">
            <div class="grid md:grid-cols-2 gap-8 text-center">
                <div class="bg-white p-4 rounded-3xl shadow">
                    <p class="text-xs font-bold text-slate-400 mb-3 uppercase">Original</p>
                    <canvas id="original-canvas" class="w-full h-auto rounded-xl"></canvas>
                </div>
                <div class="bg-white p-4 rounded-3xl shadow-lg border-2 border-indigo-50">
                    <p class="text-xs font-bold text-indigo-500 mb-3 uppercase">AI Result</p>
                    <div class="checkerboard rounded-xl overflow-hidden">
                        <canvas id="result-canvas" class="w-full h-auto"></canvas>
                    </div>
                </div>
            </div>
            <div class="flex justify-center gap-4 py-4">
                <button id="download-btn" class="bg-green-500 text-white px-10 py-4 rounded-2xl font-bold shadow-xl hover:bg-green-600 transition-all">다운로드 (PNG)</button>
                <button onclick="location.reload()" class="bg-slate-200 text-slate-700 px-8 py-4 rounded-2xl font-medium transition-all">다시 하기</button>
            </div>
        </section>
    </main>

    <script>
        const selfieSegmentation = new SelfieSegmentation({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
        });

        selfieSegmentation.setOptions({ modelSelection: 1 });

        const loadingEngine = document.getElementById('loading-engine');
        const uploadSection = document.getElementById('upload-section');
        const processingSection = document.getElementById('processing-section');
        const resultSection = document.getElementById('result-section');
        const fileInput = document.getElementById('file-input');
        const resultCanvas = document.getElementById('result-canvas');
        const originalCanvas = document.getElementById('original-canvas');

        let originalImage = null;

        // 엔진 초기화 성공 시
        selfieSegmentation.initialize().then(() => {
            loadingEngine.classList.add('hidden');
            console.log("Mediapipe Ready!");
        });

        document.getElementById('select-btn').onclick = () => fileInput.click();

        window.ondragover = e => e.preventDefault();
        window.ondrop = e => {
            e.preventDefault();
            if (e.dataTransfer.files.length > 0) processFile(e.dataTransfer.files[0]);
        };

        fileInput.onchange = e => {
            if (e.target.files.length > 0) processFile(e.target.files[0]);
        };

        async function processFile(file) {
            if (!file.type.startsWith('image/')) return alert("이미지 파일만 가능합니다.");
            
            uploadSection.classList.add('hidden');
            processingSection.classList.remove('hidden');

            const img = new Image();
            img.src = URL.createObjectURL(file);
            await img.decode();
            originalImage = img;

            // 실행
            await selfieSegmentation.send({image: img});
        }

        selfieSegmentation.onResults((results) => {
            const width = results.image.width;
            const height = results.image.height;

            originalCanvas.width = width;
            originalCanvas.height = height;
            originalCanvas.getContext('2d').drawImage(results.image, 0, 0);

            resultCanvas.width = width;
            resultCanvas.height = height;
            const ctx = resultCanvas.getContext('2d');

            // 1. 마스크 그리기
            ctx.clearRect(0, 0, width, height);
            ctx.drawImage(results.segmentationMask, 0, 0, width, height);

            // 2. 합성 (기존 이미지와 마스크를 겹쳐서 배경 제거)
            ctx.globalCompositeOperation = 'source-in';
            ctx.drawImage(results.image, 0, 0, width, height);
            
            processingSection.classList.add('hidden');
            resultSection.classList.remove('hidden');

            document.getElementById('download-btn').onclick = () => {
                const a = document.createElement('a');
                a.href = resultCanvas.toDataURL('image/png');
                a.download = "no_bg.png";
                a.click();
            };
        });
    </script>
</body>
</html>
