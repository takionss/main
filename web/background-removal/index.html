<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 배경 제거기 Pro | SmilesLife</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .checkerboard {
            background-image: linear-gradient(45deg, #f0f0f0 25%, transparent 25%), linear-gradient(-45deg, #f0f0f0 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #f0f0f0 75%), linear-gradient(-45deg, transparent 75%, #f0f0f0 75%);
            background-size: 20px 20px;
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans text-slate-900">

    <header class="bg-white shadow-sm py-6 relative">
        <a href="../../index.html" class="absolute left-8 top-1/2 -translate-y-1/2 text-slate-400 hover:text-indigo-600 transition-colors flex items-center gap-2 font-medium">
            <i class="fas fa-home"></i> 홈으로
        </a>
        <h1 class="text-2xl font-bold text-center text-indigo-600 tracking-tight">AI 배경 제거 Pro</h1>
    </header>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-4xl">
        <!-- 엔진 상태 안내 -->
        <div id="engine-status" class="mb-8 p-6 rounded-3xl bg-white border border-indigo-100 shadow-sm flex flex-col items-center gap-4 transition-all">
            <div class="flex items-center gap-3 text-indigo-600 font-bold text-lg">
                <div class="animate-spin w-5 h-5 border-2 border-indigo-600 border-t-transparent rounded-full"></div>
                <span id="engine-text">정밀 AI 엔진을 구성하고 있습니다...</span>
            </div>
            <p class="text-slate-400 text-xs text-center">초기 실행 시 고성능 AI 모델(약 30MB)을 한 번 다운로드합니다.</p>
        </div>

        <section id="upload-section" class="hidden bg-white rounded-3xl shadow-xl p-12 border-2 border-dashed border-indigo-100 flex flex-col items-center">
            <div class="w-20 h-20 bg-indigo-50 rounded-full flex items-center justify-center mb-6 text-indigo-500 text-3xl">
                <i class="fas fa-file-image"></i>
            </div>
            <h2 class="text-2xl font-bold mb-8">고화질 배경 제거를 시작하세요</h2>
            <input type="file" id="file-input" class="hidden" accept="image/*">
            <button id="select-btn" class="bg-indigo-600 text-white px-12 py-4 rounded-2xl font-bold shadow-lg hover:bg-indigo-700 active:scale-95 transition-all">
                사진 불러오기
            </button>
        </section>

        <section id="processing-section" class="hidden bg-white rounded-3xl shadow-xl p-12 text-center animate-pulse">
            <div class="text-6xl text-indigo-600 mb-8"><i class="fas fa-wand-magic-sparkles"></i></div>
            <h2 class="text-2xl font-bold mb-4 tracking-tight">전문가용 엔진이 분석 중입니다...</h2>
            <p id="proc-msg" class="text-slate-400 text-sm">머리카락 한 올까지 정밀하게 깎는 중</p>
        </section>

        <section id="result-section" class="hidden space-y-8 animate-fade-in text-center">
            <div class="grid md:grid-cols-2 gap-8">
                <div class="bg-white p-2 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-[10px] font-bold text-slate-300 mb-2 uppercase text-center tracking-widest">Input Photo</p>
                    <img id="original-preview" class="w-full h-auto rounded-lg">
                </div>
                <div class="bg-white p-2 rounded-2xl shadow-xl border-2 border-indigo-100 overflow-hidden">
                    <p class="text-[10px] font-bold text-indigo-400 mb-2 uppercase text-center tracking-widest">Pro Refined Result</p>
                    <div class="checkerboard rounded-lg overflow-hidden">
                        <canvas id="result-canvas" class="w-full h-auto"></canvas>
                    </div>
                </div>
            </div>
            <div class="flex flex-col sm:flex-row justify-center gap-4 py-8">
                <button id="download-btn" class="bg-indigo-600 text-white px-12 py-4 rounded-2xl font-bold shadow-xl hover:bg-indigo-700 transition-all flex items-center justify-center gap-2">
                    <i class="fas fa-download"></i> 정밀 제거본 저장 (PNG)
                </button>
                <button onclick="location.reload()" class="bg-slate-200 text-slate-700 px-8 py-4 rounded-2xl font-medium transition-all">다른 사진 하기</button>
            </div>
        </section>
    </main>

    <footer class="py-8 text-center text-slate-400 text-xs">
        <p>© 2026 SmilesLife. BRIA RMBG-1.4 AI Model 적용 버전.</p>
    </footer>

    <!-- Transformers.js 라이브러리 (최고 사양) -->
    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

        // 1. 설정 최적화
        env.allowLocalModels = false;
        env.useBrowserCache = true;

        let remover;
        const engineStatus = document.getElementById('engine-status');
        const engineText = document.getElementById('engine-text');
        const uploadSection = document.getElementById('upload-section');
        const processingSection = document.getElementById('processing-section');
        const resultSection = document.getElementById('result-section');
        const fileInput = document.getElementById('file-input');
        const resultCanvas = document.getElementById('result-canvas');

        // 2. 엔진 초기화
        async function loadEngine() {
            try {
                remover = await pipeline('image-segmentation', 'Xenova/modnet');
                engineStatus.classList.add('hidden');
                uploadSection.classList.remove('hidden');
                console.log("Pro AI Engine Ready!");
            } catch (err) {
                engineText.textContent = "엔진 로드 실패. 다시 시도해 주세요.";
                console.error(err);
            }
        }
        loadEngine();

        document.getElementById('select-btn').onclick = () => fileInput.click();
        fileInput.onchange = e => { if (e.target.files.length > 0) processFile(e.target.files[0]); };

        async function processFile(file) {
            uploadSection.classList.add('hidden');
            processingSection.classList.remove('hidden');

            const url = URL.createObjectURL(file);
            document.getElementById('original-preview').src = url;

            try {
                // AI 실행
                const output = await remover(url);
                const mask = output.mask; // { width, height, data }

                const img = new Image();
                img.src = url;
                await img.decode();

                const width = img.width;
                const height = img.height;
                resultCanvas.width = width;
                resultCanvas.height = height;
                const ctx = resultCanvas.getContext('2d');

                // 1. 원본 그리기
                ctx.drawImage(img, 0, 0);

                // 2. 마스크를 캔버스 데이터로 변환 (알파 채널 조작)
                const imgData = ctx.getImageData(0, 0, width, height);
                const pixels = imgData.data;

                // 마스크 데이터를 캔버스 크기에 맞게 리사이징하는 임시 캔버스
                const maskCanvas = document.createElement('canvas');
                maskCanvas.width = mask.width;
                maskCanvas.height = mask.height;
                const mCtx = maskCanvas.getContext('2d');
                const mData = mCtx.createImageData(mask.width, mask.height);
                for (let i = 0; i < mask.data.length; ++i) {
                    const val = mask.data[i];
                    const idx = i * 4;
                    mData.data[idx] = val;
                    mData.data[idx+1] = val;
                    mData.data[idx+2] = val;
                    mData.data[idx+3] = 255;
                }
                mCtx.putImageData(mData, 0, 0);

                // 마스크를 원본 크기로 확대/축소하여 겹침
                const finalMaskCanvas = document.createElement('canvas');
                finalMaskCanvas.width = width;
                finalMaskCanvas.height = height;
                const fmCtx = finalMaskCanvas.getContext('2d');
                
                // --- 테두리 잔상 제거 핵심 비법 (Erosion 효과) ---
                // 마스크를 미세하게 흐릿하게 만든 후 대비를 높이면 테두리가 안쪽으로 깎임
                fmCtx.filter = 'blur(1px) contrast(200%) brightness(90%)'; 
                fmCtx.drawImage(maskCanvas, 0, 0, width, height);

                const finalMaskData = fmCtx.getImageData(0, 0, width, height).data;

                for (let i = 0; i < pixels.length; i += 4) {
                    // 마스크의 밝기 값을 원본 이미지의 투명도(Alpha)로 적용
                    const maskVal = finalMaskData[i]; 
                    pixels[i+3] = maskVal < 50 ? 0 : maskVal; // 배경 근처는 더 과감하게 삭제
                }

                ctx.putImageData(imgData, 0, 0);

                processingSection.classList.add('hidden');
                resultSection.classList.remove('hidden');

                document.getElementById('download-btn').onclick = () => {
                    const a = document.createElement('a');
                    a.href = resultCanvas.toDataURL('image/png');
                    a.download = "pro_no_bg.png";
                    a.click();
                };
            } catch (error) {
                alert("처리 오류: " + error.message);
                location.reload();
            }
        }
    </script>
</body>
</html>
