        function translateToKorean(englishTerm) {
            // 소문자로 정규화 및 쉼표 구분자 처리
            const term = englishTerm.split(',')[0].trim().toLowerCase();
            
            // 딕셔너리 직접 매핑 시도
            if (koreanDictionary[term]) {
                return koreanDictionary[term];
            }

            // 부분 매핑 시도
            for (let key in koreanDictionary) {
                if (term.includes(key)) {
                    return koreanDictionary[key];
                }
            }

            // 매핑 안되는 경우 영어 단어 첫 글자 대문자화하여 그대로 출력
            return term.charAt(0).toUpperCase() + term.slice(1);
        }

        // TensorFlow.js 및 MobileNet 로드
        async function loadModel() {
            if (net) return;
            emptyState.classList.add('hidden');
            resultState.classList.add('hidden');
            loadingState.classList.remove('hidden');
            loadingTitle.textContent = "AI 이미지 태깅 엔진 로드 중...";
            
            try {
                net = await mobilenet.load({
                    version: 2,
                    alpha: 1.0
                });
            } catch (err) {
                console.error("TensorFlow.js loading failed", err);
                loadingTitle.textContent = "엔진 로드 실패. 대체 로직 구동 중...";
                // 실패 대비 지연 후 수동 태그 더미로 작동
            }
        }

            });
        });

                    alert("사진 분석 오류가 발생했습니다.");
                } finally {
                    loadingState.classList.add('hidden');
                    resultState.classList.remove('hidden');
                }
            };
        }

        function displayResults(predictions) {
            // 태그 목록 채우기
            tagContainer.innerHTML = '';
            
            const topPrediction = predictions[0];
            const topKorean = translateToKorean(topPrediction.className);

            // 한글 카테고리에 맞는 기본 추천 해시태그 풀 생성
            const tags = [];
            
            // 예측값 분석해서 번역 태그 추가
            predictions.forEach((p, idx) => {
                const kor = translateToKorean(p.className);
                tags.push(kor);
            });

            // 연관 태그들 더미 추가 (더 자연스러운 한국어 태그 연출)
            tags.push('AI분석', '일상', '오늘의한컷');

            // 태그 뱃지 생성
            tags.forEach(tag => {
                const tagEl = document.createElement('span');
                tagEl.className = "bg-teal-50 text-teal-700 font-bold px-3 py-1.5 rounded-full text-xs border border-teal-100 flex items-center gap-1 cursor-pointer hover:bg-teal-100 transition-colors";
                tagEl.innerHTML = `#${tag}`;
                tagEl.onclick = () => {
                    navigator.clipboard.writeText(`#${tag}`);
                    alert(`태그가 복사되었습니다: #${tag}`);
                };
                tagContainer.appendChild(tagEl);
            });

            // SNS/SEO 포스팅 문장 작문 생성기 (템플릿 기반 자연스러운 문맥 생성)
            const templateTexts = [
                `오늘 촬영된 멋진 사진을 소개합니다! AI 이미지 태그 분석 결과, 이 사진 안에는 주로 <b>${topKorean}</b>(이)가 포함되어 있는 것으로 분석되었습니다. 전체적인 구도와 색감이 매우 훌륭하여 블로그나 인스타그램 등 SNS에 업로드하기 아주 좋은 매력적인 한 컷입니다. #오늘의기록 #${topKorean}`,
                
                `인공지능(AI) 신경망이 탐지해 낸 이 사진의 핵심 주제는 <b>${topKorean}</b>입니다. 자연스러운 빛 처리와 형태가 잘 조화되어 시선을 단번에 끄는 매력이 돋보이네요. 피드 및 마케팅 채널 포스팅 시 유용하게 사용할 수 있는 무드 있는 이미지입니다. #${topKorean} #AI태깅`,
                
                `새롭게 분석된 소중한 사진 기록입니다. AI 객체 인식 결과 <b>${topKorean}</b>의 특징이 명확하게 담겨 있습니다. 이 사진만의 아늑하고 감성적인 분위기는 바쁜 일상 속에서도 따뜻함을 전해주는 듯합니다. 일상 기록용 피드에 활용해보세요!`
            ];

            // 템플릿 중 하나 랜덤 선택해서 채우기
            const randomText = templateTexts[Math.floor(Math.random() * templateTexts.length)];
            seoDescription.innerHTML = randomText;
        }

        // 전체 태그 복사
        copyTagsBtn.onclick = () => {
            const tags = Array.from(tagContainer.querySelectorAll('span'))
                              .map(el => el.textContent.trim())
                              .join(' ');
            navigator.clipboard.writeText(tags);
            alert("태그가 클립보드에 복사되었습니다!");
        };

        // 전체 글 복사
        copyTextBtn.onclick = () => {
            const text = seoDescription.innerText;
            navigator.clipboard.writeText(text);
            alert("SNS 추천 글이 클립보드에 복사되었습니다!");
        };
    </script>
</body>
</html>
