<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메모장</title>
    <style>
        :root {
            --bg-color: #f5f6fa;
            --container-bg: rgba(255, 255, 255, 0.8);
            --border-color: rgba(0, 0, 0, 0.08);
            --text-color: #2f3640;
            --text-secondary: #718093;
            --accent-color: #0078D4;
            --accent-hover: #005a9e;
            --textarea-bg: #ffffff;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            --header-bg: rgba(245, 246, 250, 0.85);
        }

        [data-theme="dark"] {
            --bg-color: #1e1e24;
            --container-bg: rgba(30, 30, 36, 0.8);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-color: #f5f6fa;
            --text-secondary: #a4b0be;
            --accent-color: #0084ff;
            --accent-hover: #3399ff;
            --textarea-bg: #2d2d34;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --header-bg: rgba(45, 45, 52, 0.85);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: auto;
            transition: background 0.3s, color 0.3s;
        }

        .notepad-container {
            width: 100%;
            height: calc(100vh - 140px);
            min-height: 400px;
            display: flex;
            flex-direction: column;
            background: var(--container-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            transition: background 0.3s, border-color 0.3s;
            flex-shrink: 0;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            user-select: none;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 16px;
        }

        .header-title img {
            width: 20px;
            height: 20px;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .btn:hover {
            background: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        .btn-primary {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .editor-container {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        textarea {
            width: 100%;
            height: 100%;
            flex: 1;
            resize: none;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            font-size: 15px;
            line-height: 1.6;
            background: var(--textarea-bg);
            color: var(--text-color);
            outline: none;
            transition: background 0.3s, border-color 0.3s;
            font-family: inherit;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px;
            background: var(--header-bg);
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-secondary);
            user-select: none;
        }

        .stats {
            display: flex;
            gap: 15px;
        }

        .save-status {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4cd137;
            display: inline-block;
        }

        .dot.dirty {
            background: #e1b12c;
        }
        
        /* Google Auto Ads Optimization Space styling */
        .adsense-auto-wrapper {
            width: 100%;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border-radius: 12px;
            border: 1px dashed var(--border-color);
            padding: 16px;
            margin: 20px auto 0 auto;
            max-width: 90%;
            box-sizing: border-box;
            clear: both;
            flex-shrink: 0;
        }
        [data-theme="dark"] .adsense-auto-wrapper {
            background: var(--textarea-bg);
        }
        .adsense-title {
            font-size: 10px;
            color: var(--text-secondary);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 5px;
            display: block;
        }
        .adsense-content {
            width: 100%;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .adsense-placeholder {
            font-size: 12px;
            color: var(--text-secondary);
        }
    </style>
    <script src="../../adsense-loader.js"></script>
</head>
<body>

    <div class="notepad-container">
        <div class="header">
            <div class="header-title">
                <span>📝 메모장</span>
            </div>
            <div class="toolbar">
                <button class="btn" onclick="clearEditor()">새 메모</button>
                <button class="btn btn-primary" onclick="downloadTxt()">파일 저장 (.txt)</button>
                <button class="btn" onclick="toggleTheme()" id="theme-btn">다크 모드</button>
            </div>
        </div>
        <div class="editor-container">
            <textarea id="editor" placeholder="여기에 메모를 입력하세요... (자동 저장됩니다)" oninput="onTextChange()"></textarea>
        </div>
        <div class="footer">
            <div class="stats">
                <span id="char-count">글자 수: 0</span>
                <span id="line-count">줄 수: 1</span>
            </div>
            <div class="save-status">
                <span class="dot" id="save-dot"></span>
                <span id="save-text">저장 완료</span>
            </div>
        </div>
    </div>

    <!-- Google Auto Ads Optimization Space -->
    <div class="adsense-auto-wrapper">
        <span class="adsense-title">Sponsored Advertisement</span>
        <div class="adsense-content">
            <p class="adsense-placeholder">광고 영역 (Google Adsense Space)</p>
        </div>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const charCount = document.getElementById('char-count');
        const lineCount = document.getElementById('line-count');
        const saveDot = document.getElementById('save-dot');
        const saveText = document.getElementById('save-text');
        
        let saveTimeout;

        // Load saved note
        window.addEventListener('DOMContentLoaded', () => {
            const savedText = localStorage.getItem('smiles_notes');
            if (savedText) {
                editor.value = savedText;
                updateStats();
            }

            const savedTheme = localStorage.getItem('smiles_notes_theme');
            if (savedTheme === 'dark') {
                document.body.setAttribute('data-theme', 'dark');
                document.getElementById('theme-btn').innerText = '라이트 모드';
            }
        });

        function onTextChange() {
            updateStats();
            saveDot.className = 'dot dirty';
            saveText.innerText = '저장 중...';

            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                localStorage.setItem('smiles_notes', editor.value);
                saveDot.className = 'dot';
                saveText.innerText = '저장 완료';
            }, 800);
        }

        function updateStats() {
            const text = editor.value;
            charCount.innerText = `글자 수: ${text.length}`;
            const lines = text.split('\n').length;
            lineCount.innerText = `줄 수: ${lines}`;
        }

        function clearEditor() {
            if (editor.value.trim() !== '' && !confirm('메모를 비우시겠습니까?')) {
                return;
            }
            editor.value = '';
            onTextChange();
            editor.focus();
        }

        function downloadTxt() {
            const text = editor.value;
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            
            // Set filename based on first line, or default
            const firstLine = text.split('\n')[0].trim().substring(0, 15);
            const filename = firstLine ? `${firstLine}.txt` : 'memo.txt';
            
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            const btn = document.getElementById('theme-btn');
            
            if (currentTheme === 'dark') {
                document.body.removeAttribute('data-theme');
                localStorage.setItem('smiles_notes_theme', 'light');
                btn.innerText = '다크 모드';
            } else {
                document.body.setAttribute('data-theme', 'dark');
                localStorage.setItem('smiles_notes_theme', 'dark');
                btn.innerText = '라이트 모드';
            }
        }
    </script>
</body>
</html>
