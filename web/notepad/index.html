<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메모장</title>
    <style>
        :root {
            --bg-color: #f5f6fa;
            --container-bg: rgba(255, 255, 255, 0.8);
            --border-color: rgba(0, 0, 0, 0.08);
            --text-color: #2f3640;
            --text-secondary: #718093;
            --accent-color: #0078D4;
            --accent-hover: #005a9e;
            --textarea-bg: #ffffff;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            --header-bg: rgba(245, 246, 250, 0.85);
        }

        [data-theme="dark"] {
            --bg-color: #1e1e24;
            --container-bg: rgba(30, 30, 36, 0.8);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-color: #f5f6fa;
            --text-secondary: #a4b0be;
            --accent-color: #0084ff;
            --accent-hover: #3399ff;
            --textarea-bg: #2d2d34;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --header-bg: rgba(45, 45, 52, 0.85);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: auto;
            transition: background 0.3s, color 0.3s;
        }

        .notepad-container {
            width: 100%;
            height: calc(100vh - 140px);
            min-height: 400px;
            display: flex;
            flex-direction: column;
            background: var(--container-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            transition: background 0.3s, border-color 0.3s;
            flex-shrink: 0;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            user-select: none;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 16px;
        }

        .header-title img {
            width: 20px;
            height: 20px;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .btn:hover {
            background: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        .btn-primary {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .editor-container {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        textarea {
            width: 100%;
            height: 100%;
            flex: 1;
            resize: none;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            font-size: 15px;
            line-height: 1.6;
            background: var(--textarea-bg);
            color: var(--text-color);
            outline: none;
            transition: background 0.3s, border-color 0.3s;
            font-family: inherit;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px;
            background: var(--header-bg);
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-secondary);
            user-select: none;
        }

        .stats {
            display: flex;
            gap: 15px;
        }

        .save-status {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4cd137;
            display: inline-block;
        }

        .dot.dirty {
            background: #e1b12c;
        }
        
        /* Google Auto Ads Optimization Space styling */
        .adsense-auto-wrapper {
            width: 100%;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border-radius: 12px;
            border: 1px dashed var(--border-color);
            padding: 16px;
            margin: 20px auto 0 auto;
            max-width: 90%;
            box-sizing: border-box;
            clear: both;
            flex-shrink: 0;
        }
        
        .adsense-title {
            font-size: 10px;
            color: var(--text-secondary);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 5px;
            display: block;
        }
        .adsense-content {
            width: 100%;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .adsense-placeholder {
            font-size: 12px;
            color: var(--text-secondary);
        }
    </style>
    <script src="../../adsense-loader.js"></script>
</head>
<body>

    <div class="notepad-container">
        <div class="header">
            <div class="header-title">
                <span data-i18n="headerTitle">📝 메모장</span>
            </div>
            <div class="toolbar" style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                <button class="btn" onclick="clearEditor()" data-i18n="newMemo">새 메모</button>
                <button class="btn btn-primary" onclick="downloadTxt()" data-i18n="saveTxt">파일 저장 (.txt)</button>
                <button class="btn" onclick="toggleTheme()" id="theme-btn" data-i18n="darkMode">다크 모드</button>
                <select id="lang-select" onchange="changeLanguage(this.value)" style="padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--container-bg); color: var(--text-color); font-size: 13px; font-weight: 500; cursor: pointer; outline: none;">
                    <option value="ko">한국어</option>
                    <option value="en">English</option>
                    <option value="es">Español</option>
                    <option value="ja">日本語</option>
                    <option value="zh-TW">繁體中文</option>
                </select>
            </div>
        </div>
        <div class="editor-container">
            <textarea id="editor" placeholder="여기에 메모를 입력하세요... (자동 저장됩니다)" oninput="onTextChange()"></textarea>
        </div>
        <div class="footer">
            <div class="stats">
                <span id="char-count">글자 수: 0</span>
                <span id="line-count">줄 수: 1</span>
            </div>
            <div class="save-status">
                <span class="dot" id="save-dot"></span>
                <span id="save-text" data-i18n="saved">저장 완료</span>
            </div>
        </div>
    </div>

            <!-- Google Auto Ads Optimization Space -->
        <div class="adsense-container" style="clear: both; margin: 20px auto; width: 100%; max-width: 970px; min-height: 50px;"></div>


    <script>
        const TRANSLATIONS = {
            ko: {
                htmlTitle: "메모장",
                headerTitle: "📝 메모장",
                newMemo: "새 메모",
                saveTxt: "파일 저장 (.txt)",
                darkMode: "다크 모드",
                lightMode: "라이트 모드",
                placeholder: "여기에 메모를 입력하세요... (자동 저장됩니다)",
                charCount: "글자 수: ",
                lineCount: "줄 수: ",
                saved: "저장 완료",
                saving: "저장 중...",
                confirmClear: "메모를 비우시겠습니까?"
            },
            en: {
                htmlTitle: "Notepad",
                headerTitle: "📝 Notepad",
                newMemo: "New Note",
                saveTxt: "Save File (.txt)",
                darkMode: "Dark Mode",
                lightMode: "Light Mode",
                placeholder: "Type your note here... (Auto-saved)",
                charCount: "Characters: ",
                lineCount: "Lines: ",
                saved: "Saved",
                saving: "Saving...",
                confirmClear: "Are you sure you want to clear the note?"
            },
            es: {
                htmlTitle: "Bloc de notas",
                headerTitle: "📝 Bloc de notas",
                newMemo: "Nueva Nota",
                saveTxt: "Guardar archivo (.txt)",
                darkMode: "Modo Oscuro",
                lightMode: "Modo Claro",
                placeholder: "Escriba su nota aquí... (Autoguardado)",
                charCount: "Caracteres: ",
                lineCount: "Líneas: ",
                saved: "Guardado",
                saving: "Guardando...",
                confirmClear: "¿Está seguro de que desea borrar la nota?"
            },
            ja: {
                htmlTitle: "メモ帳",
                headerTitle: "📝 メモ帳",
                newMemo: "新規メモ",
                saveTxt: "ファイルを保存 (.txt)",
                darkMode: "ダークモード",
                lightMode: "ライトモード",
                placeholder: "ここにメモを入力してください... (自動保存されます)",
                charCount: "文字数: ",
                lineCount: "行数: ",
                saved: "保存完了",
                saving: "保存中...",
                confirmClear: "メモを空にしますか？"
            },
            "zh-TW": {
                htmlTitle: "記事本",
                headerTitle: "📝 記事本",
                newMemo: "新增記事",
                saveTxt: "儲存檔案 (.txt)",
                darkMode: "深色模式",
                lightMode: "淺色模式",
                placeholder: "在此輸入記事... (自動儲存)",
                charCount: "字數: ",
                lineCount: "行數: ",
                saved: "已儲存",
                saving: "儲存中...",
                confirmClear: "您確定要清除記事嗎？"
            }
        };

        let currentLang = 'ko';

        function initLanguage() {
            const urlParams = new URLSearchParams(window.location.search);
            const langParam = urlParams.get('lang');
            const storedLang = localStorage.getItem('smileslife-preferred-lang');
            
            let defaultLang = 'ko';
            if (langParam && TRANSLATIONS[langParam]) {
                defaultLang = langParam;
            } else if (storedLang && TRANSLATIONS[storedLang]) {
                defaultLang = storedLang;
            }
            
            changeLanguage(defaultLang);
        }

        function changeLanguage(lang) {
            if (!TRANSLATIONS[lang]) return;
            currentLang = lang;
            localStorage.setItem('smileslife-preferred-lang', lang);
            
            const select = document.getElementById('lang-select');
            if (select) select.value = lang;
            
            document.title = TRANSLATIONS[lang].htmlTitle;
            document.documentElement.lang = lang;
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (TRANSLATIONS[lang][key]) {
                    el.textContent = TRANSLATIONS[lang][key];
                }
            });

            const btn = document.getElementById('theme-btn');
            const currentTheme = document.body.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                btn.innerText = TRANSLATIONS[lang].lightMode;
            } else {
                btn.innerText = TRANSLATIONS[lang].darkMode;
            }

            document.getElementById('editor').placeholder = TRANSLATIONS[lang].placeholder;
            updateStats();
        }

        const editor = document.getElementById('editor');
        const charCount = document.getElementById('char-count');
        const lineCount = document.getElementById('line-count');
        const saveDot = document.getElementById('save-dot');
        const saveText = document.getElementById('save-text');
        
        let saveTimeout;

        // Load saved note
        window.addEventListener('DOMContentLoaded', () => {
            initLanguage();
            
            const savedText = localStorage.getItem('smiles_notes');
            if (savedText) {
                editor.value = savedText;
                updateStats();
            }

            const savedTheme = localStorage.getItem('smiles_notes_theme');
            if (savedTheme === 'dark') {
                document.body.setAttribute('data-theme', 'dark');
                document.getElementById('theme-btn').innerText = TRANSLATIONS[currentLang].lightMode;
            }
        });

        function onTextChange() {
            updateStats();
            saveDot.className = 'dot dirty';
            saveText.innerText = TRANSLATIONS[currentLang].saving;

            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                localStorage.setItem('smiles_notes', editor.value);
                saveDot.className = 'dot';
                saveText.innerText = TRANSLATIONS[currentLang].saved;
            }, 800);
        }

        function updateStats() {
            const text = editor.value;
            charCount.innerText = `${TRANSLATIONS[currentLang].charCount}${text.length}`;
            const lines = text.split('\n').length;
            lineCount.innerText = `${TRANSLATIONS[currentLang].lineCount}${lines}`;
        }

        function clearEditor() {
            if (editor.value.trim() !== '' && !confirm(TRANSLATIONS[currentLang].confirmClear)) {
                return;
            }
            editor.value = '';
            onTextChange();
            editor.focus();
        }

        function downloadTxt() {
            const text = editor.value;
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            
            // Set filename based on first line, or default
            const firstLine = text.split('\n')[0].trim().substring(0, 15);
            const filename = firstLine ? `${firstLine}.txt` : 'memo.txt';
            
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            const btn = document.getElementById('theme-btn');
            
            if (currentTheme === 'dark') {
                document.body.removeAttribute('data-theme');
                localStorage.setItem('smiles_notes_theme', 'light');
                btn.innerText = TRANSLATIONS[currentLang].darkMode;
            } else {
                document.body.setAttribute('data-theme', 'dark');
                localStorage.setItem('smiles_notes_theme', 'dark');
                btn.innerText = TRANSLATIONS[currentLang].lightMode;
            }
        }
    </script>
</body>
</html>
