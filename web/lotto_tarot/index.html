<!DOCTYPE html>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap');
        
        body {
            background-color: #0b0c10;
            color: #66fcf1;
            font-family: 'Gowun Dodum', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            margin: 0; 
            padding: 20px;
            overflow-x: hidden;
        }
        h1 { text-shadow: 0 0 10px #45a29e; font-size: 2.2em; margin-bottom: 30px; }
        
        /* Language Selector Container */
        .lang-selector-container {
            position: absolute;
            top: 20px;
            right: 20px;
        }
        #langSelect {
            background: #1f2833;
            color: #66fcf1;
            border: 1px solid #45a29e;
            padding: 8px 12px;
            border-radius: 5px;
            font-family: inherit;
            font-size: 0.9em;
            cursor: pointer;
            outline: none;
            transition: 0.3s;
        }
        #langSelect:hover {
            border-color: #66fcf1;
            box-shadow: 0 0 10px rgba(102, 252, 241, 0.5);
        }

        .card-container {
            display: flex; justify-content: center; gap: 20px; margin-bottom: 30px;
            perspective: 1000px;
            flex-wrap: wrap;
        }
        .card {
            width: 150px; height: 260px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        .card.flipped { transform: rotateY(180deg); }
        
        .card-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; 
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.2);
        }
        .card-front {
            background: linear-gradient(135deg, #1f2833 0%, #0b0c10 100%);
            border: 2px solid #45a29e;
            display: flex; align-items: center; justify-content: center;
            color: #45a29e; font-size: 2em;
        }
        .card-back {
            transform: rotateY(180deg);
            background-size: cover;
            background-position: center;
            border: 2px solid #c5c6c7;
        }
        
        button {
            background: transparent; color: #66fcf1;
            border: 2px solid #66fcf1; padding: 15px 30px;
            font-size: 1.2em; border-radius: 30px; cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
            box-shadow: 0 0 10px rgba(102, 252, 241, 0.3);
            margin-bottom: 20px;
        }
        button:hover {
            background: #66fcf1; color: #0b0c10;
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.8);
        }
        button:disabled { border-color: #45a29e; color: #45a29e; cursor: not-allowed; background: transparent; box-shadow: none; }
        
        #result-text {
            font-size: 1.1em; line-height: 1.8; color: #c5c6c7;
            display: inline-block; background: #1f2833; padding: 25px;
            border-radius: 10px; min-width: 350px; max-width: 600px;
            border: 1px solid #45a29e;
            margin: 0 auto;
        }
        .text-left { text-align: left; }
        .text-center { text-align: center; }
        .highlight { color: #f1c40f; font-weight: bold; }
        .wish-text { color: #ff7272; font-size: 1.1em; } /* 염원을 담은 붉은빛 텍스트 */
        
        /* 🎱 실제 로또 공 3D 스타일 적용 */
        .ball-container { display: flex; align-items: center; margin-top: 10px; gap: 8px; flex-wrap: wrap; }
        .game-label { font-weight: bold; color: #66fcf1; margin-right: 5px; width: 85px; }
        .ball {
            width: 36px; height: 36px;
            border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 1.1em;
            color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.4), inset 3px 3px 8px rgba(255,255,255,0.7), 2px 2px 5px rgba(0,0,0,0.5);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0; transform: scale(0);
        }
        
        .ball-yellow { background: #fbc400; color: #333; text-shadow: none; }
        .ball-blue   { background: #69c8f2; }
        .ball-red    { background: #ff7272; }
        .ball-gray   { background: #aaaaaa; }
        .ball-green  { background: #b0d840; }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* 모바일 최적화 반응형 레이아웃 */
        @media (max-width: 500px) {
            .lang-selector-container {
                position: relative;
                top: 0;
                right: 0;
                margin-bottom: 15px;
                text-align: right;
            }
            h1 { font-size: 1.6em; margin-bottom: 20px; }
            .card-container {
                gap: 8px;
                flex-wrap: nowrap !important;
            }
            .card {
                width: 95px;
                height: 165px;
            }
            .card-front {
                font-size: 1.5em;
            }
            button {
                font-size: 1em;
                padding: 12px 24px;
            }
            #result-text {
                font-size: 0.85em !important;
                padding: 15px !important;
                min-width: 100% !important;
                box-sizing: border-box;
            }
            .ball-container {
                gap: 5px;
                flex-wrap: nowrap !important;
                justify-content: flex-start;
            }
            .game-label {
                width: 52px;
                font-size: 0.8em;
                margin-right: 2px;
            }
            .ball {
                width: 28px;
                height: 28px;
                font-size: 0.9em;
            }
        }

            },
            "zh-TW": {
                title: "🔮 命運塔羅彩券預測器",
                tab_title: "🔮 尊榮塔羅彩券預測器",
                btn_shuffle: "洗牌命運之卡",
                btn_shuffling: "正將您的虔誠意念注入卡片中... 🌀",
                btn_retry: "帶著新的願望重新抽取",
                init_msg: `<br>閉上雙眼，在腦海中浮現 <span class="highlight">您必須贏得頭獎的強烈理由</span>。<br>當您的祈願達到頂點時，請按下按鈕。<br><br>`,
                loading_msg: `<br>強烈的祈願正滲透進塔羅牌中...<br><br>`,
                revelation: "✨ [命運的啟示]",
                prediction_desc: "融入了您虔誠的意念與上述卡片的能量，<br><span class='highlight'>這是本次頭獎的預測號碼！</span>",
                game_label: "組",
                major_label: " (大阿爾克那)",
                majors: [
                    { name: "愚者", meaning: "全新的開始與無限的可能" },
                    { name: "魔術師", meaning: "創造力與堅強的意志" },
                    { name: "女祭司", meaning: "直覺與隱藏的智慧" },
                    { name: "皇后", meaning: "豐饒與溫暖的能量" },
                    { name: "皇帝", meaning: "穩定與強大的領導力" },
                    { name: "教皇", meaning: "信仰與精神的教誨" },
                    { name: "戀人", meaning: "和諧的結合與積極的選擇" },
                    { name: "戰車", meaning: "勇往直前的推進力與勝利" },
                    { name: "力量", meaning: "溫柔的魅力與堅韌" },
                    { name: "隱士", meaning: "深邃的洞察力與領悟" },
                    { name: "命運之輪", meaning: "命運的轉折點與意想不到的好運" },
                    { name: "正義", meaning: "公正的判決與完美的平衡" },
                    { name: "倒吊人", meaning: "全新的視角與奉獻" },
                    { name: "死神", meaning: "戲劇性的轉變與新生" },
                    { name: "節制", meaning: "調和與順暢的流動" },
                    { name: "惡魔", meaning: "致命的魅力與潛藏的慾望" },
                    { name: "高塔", meaning: "突如其來的變革與陳舊事物的解脫" },
                    { name: "星星", meaning: "希望與璀璨的未來" },
                    { name: "月亮", meaning: "直覺與內在的潛意識" },
                    { name: "太陽", meaning: "耀眼的成功與積極的能量" },
                    { name: "審判", meaning: "命運的復活與決定性的回報" },
                    { name: "世界", meaning: "完美的成就與美好結局" }
                ],
                suits: {
                    "wa": { name: "權杖", meaning: "熱情與行動力提升，將帶來迅速的成果。" },
                    "cu": { name: "聖杯", meaning: "情感與直覺變得豐富，將吸引意想不到的好運。" },
                    "sw": { name: "寶劍", meaning: "憑藉敏銳的判斷力，洞察幸運的數字。" },
                    "pe": { name: "金幣", meaning: "強烈注入了物質富足與金錢好運。" }
                },
                ranks: { "ac": "王牌(Ace)", "02": "2", "03": "3", "04": "4", "05": "5", "06": "6", "07": "7", "08": "8", "09": "9", "10": "10", "pa": "侍從", "kn": "騎士", "qu": "女王", "ki": "國王" }
            }
        };

        function buildTarotDeck() {
            tarotDeck.length = 0;
            const langData = DICTIONARY[currentLang];
            
            // Majors
            langData.majors.forEach((card, i) => {
                let numStr = i < 10 ? '0' + i : i.toString();
                tarotDeck.push({
                    name: card.name + langData.major_label,
                    url: `${BASE_URL}ar${numStr}.jpg`,
                    type: "major",
                    meaning: card.meaning
                });
            });
            
            // Suits
            for (let s in langData.suits) {
                for (let r in langData.ranks) {
                    tarotDeck.push({
                        name: `${langData.suits[s].name} ${langData.ranks[r]}`,
                        url: `${BASE_URL}${s}${r}.jpg`,
                        type: s,
                        meaning: langData.suits[s].meaning
                    });
                }
            }
        }

        function initLanguage() {
            const urlParams = new URLSearchParams(window.location.search);
            let lang = urlParams.get('lang');
            
            if (!lang) {
                lang = localStorage.getItem('smileslife-preferred-lang');
            }
            
            if (!lang) {
                const userLang = navigator.language || navigator.userLanguage;
                if (userLang.startsWith('ko')) lang = 'ko';
                else if (userLang.startsWith('es')) lang = 'es';
                else if (userLang.startsWith('ja')) lang = 'ja';
                else if (userLang.startsWith('zh')) lang = 'zh-TW';
                else lang = 'en';
            }
            
            if (!DICTIONARY[lang]) {
                lang = 'ko';
            }
            
            setLanguage(lang);
        }

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('smileslife-preferred-lang', lang);
            document.getElementById('langSelect').value = lang;
            
            document.title = DICTIONARY[lang].tab_title;
            document.getElementById('page-title').innerHTML = DICTIONARY[lang].title;
            
            const drawBtn = document.getElementById('drawBtn');
            if (!drawBtn.disabled) {
                drawBtn.innerText = DICTIONARY[lang].btn_shuffle;
            }
            
            const resultBox = document.getElementById('result-text');
            if (resultBox.classList.contains('text-center') && !resultBox.classList.contains('wish-text')) {
                resultBox.innerHTML = DICTIONARY[lang].init_msg;
            }
            
            buildTarotDeck();
        }

        function changeLanguage(lang) {
            setLanguage(lang);
        }

        function getWeightedRandom(weights, offset = 1) {
            let sum = weights.reduce((a, b) => a + b, 0);
            let rand = Math.random() * sum;
            for (let i = 0; i < weights.length; i++) {
                if (rand < weights[i]) return i + offset;
                rand -= weights[i];
            }
            return weights.length - 1 + offset;
        }

        function getBallColor(num) {
            if (num <= 10) return "ball-yellow";
            if (num <= 20) return "ball-blue";
            if (num <= 30) return "ball-red";
            if (num <= 40) return "ball-gray";
            return "ball-green";
        }

        async function drawCards() {
            const btn = document.getElementById('drawBtn');
            const resultBox = document.getElementById('result-text');
            btn.disabled = true;
            btn.innerText = DICTIONARY[currentLang].btn_shuffling;
            
            for(let i=0; i<3; i++) {
                document.getElementById(`card${i}`).classList.remove('flipped');
            }
            
            resultBox.className = "text-center wish-text";
            resultBox.innerHTML = DICTIONARY[currentLang].loading_msg;
            
            await new Promise(r => setTimeout(r, 1500));

            let shuffled = [...tarotDeck].sort(() => 0.5 - Math.random());
            let chosenCards = shuffled.slice(0, 3);
            
            for(let i=0; i<3; i++) {
                document.getElementById(`img${i}`).style.backgroundImage = `url(${chosenCards[i].url})`;
                document.getElementById(`card${i}`).classList.add('flipped');
                await new Promise(r => setTimeout(r, 800));
            }
            
            // Adapt lottery rules dynamically
            let maxNum = 45;
            let selectCount = 6;
            let hasExtra = false;
            let extraMax = 0;
            let extraOffset = 1;
            let extraColor = "";

            if (currentLang === 'ko') {
                maxNum = 45;
                selectCount = 6;
            } else if (currentLang === 'en') {
                maxNum = 69;
                selectCount = 5;
                hasExtra = true;
                extraMax = 26;
                extraOffset = 1;
                extraColor = "ball-red";
            } else if (currentLang === 'es') {
                maxNum = 49;
                selectCount = 6;
                hasExtra = true;
                extraMax = 10; // 0 to 9
                extraOffset = 0;
                extraColor = "ball-yellow";
            } else if (currentLang === 'ja') {
                maxNum = 43;
                selectCount = 6;
            } else if (currentLang === 'zh-TW') {
                maxNum = 38;
                selectCount = 6;
                hasExtra = true;
                extraMax = 8;
                extraOffset = 1;
                extraColor = "ball-red";
            }

            let weights = new Array(maxNum).fill(1.0);
            let zoneSize = Math.floor(maxNum / 4);

            chosenCards.forEach(card => {
                if (card.type === "wa") {
                    for (let i = 0; i < zoneSize; i++) weights[i] += 1.5;
                } else if (card.type === "cu") {
                    for (let i = zoneSize; i < 2 * zoneSize; i++) weights[i] += 1.5;
                } else if (card.type === "sw") {
                    for (let i = 2 * zoneSize; i < 3 * zoneSize; i++) weights[i] += 1.5;
                } else if (card.type === "pe") {
                    for (let i = 3 * zoneSize; i < maxNum; i++) weights[i] += 1.5;
                } else {
                    let luckyZone = Math.floor(Math.random() * 4);
                    let start = luckyZone * zoneSize;
                    let end = luckyZone === 3 ? maxNum : (luckyZone + 1) * zoneSize;
                    for (let i = start; i < end; i++) weights[i] += 2.0;
                }
            });

            let lottoGames = [];
            for (let g = 0; g < 5; g++) {
                let predicted = new Set();
                while (predicted.size < selectCount) {
                    predicted.add(getWeightedRandom(weights, 1));
                }
                let mainNums = Array.from(predicted).sort((a, b) => a - b);
                let extraNum = null;
                if (hasExtra) {
                    extraNum = Math.floor(Math.random() * extraMax) + extraOffset;
                }
                lottoGames.push({ mainNums, extraNum });
            }
            
            let introText = `${DICTIONARY[currentLang].revelation}<br>`;
            chosenCards.forEach(c => {
                introText += `- ${c.name} : ${c.meaning}<br>`;
            });
            introText += `<br>${DICTIONARY[currentLang].prediction_desc}<br>`;
            introText += `<hr style='border: 1px dashed #45a29e; margin: 15px 0;'>`;

            let ballsHTML = `<div>`;
            lottoGames.forEach((game, idx) => {
                let gameNum = (idx + 1).toString().padStart(2, '0');
                ballsHTML += `<div class="ball-container"><div class="game-label">${DICTIONARY[currentLang].game_label} ${gameNum}</div>`;
                game.mainNums.forEach((num, ballIdx) => {
                    let delay = (ballIdx * 0.1) + "s";
                    ballsHTML += `<div class="ball ${getBallColor(num)}" style="animation-delay: ${delay}">${num}</div>`;
                });
                if (game.extraNum !== null) {
                    let delay = (game.mainNums.length * 0.1) + "s";
                    ballsHTML += `<div class="ball ${extraColor}" style="animation-delay: ${delay}">${game.extraNum}</div>`;
                }
                ballsHTML += `</div>`;
            });
            ballsHTML += `</div>`;
            
            resultBox.className = "text-left";
            resultBox.innerHTML = "";
            let charIndex = 0;
            let isTag = false;
            let currentHTML = "";

            function typeWriter() {
                if(charIndex < introText.length) {
                    let char = introText.charAt(charIndex);
                    currentHTML += char;
                    if(char === '<') isTag = true;
                    if(char === '>') isTag = false;
                    
                    resultBox.innerHTML = currentHTML;
                    charIndex++;
                    
                    if(isTag) {
                        typeWriter();
                    } else {
                        setTimeout(typeWriter, 20);
                    }
                } else {
                    resultBox.innerHTML += ballsHTML;
                    btn.disabled = false;
                    btn.innerText = DICTIONARY[currentLang].btn_retry;
                }
            }
            typeWriter();
        }
    </script>
