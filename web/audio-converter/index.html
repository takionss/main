<body class="bg-slate-50 min-h-screen flex flex-col font-sans text-slate-900">

    <!-- Header -->
    <header class="bg-white shadow-sm py-6 relative">
        <a href="../../index.html" class="absolute left-8 top-1/2 -translate-y-1/2 text-slate-400 hover:text-indigo-600 transition-colors flex items-center gap-2 font-medium">
            <i class="fas fa-home"></i> 홈으로
        </a>
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-3xl font-bold text-green-600 flex items-center justify-center gap-2">
                <i class="fas fa-file-audio"></i> 오디오 만능 변환기
            </h1>
            <p class="text-slate-500 mt-2">MP3, WAV, AAC 등 모든 오디오 파일을 브라우저에서 즉시 변환하세요.</p>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-12 max-w-3xl">
        
        <!-- App Container -->
        <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100">
            
            <!-- Upload Area -->
            <div id="upload-container" class="p-8 md:p-12 text-center border-b border-slate-50">
                <div id="drop-zone" class="border-2 border-dashed border-slate-200 rounded-2xl p-10 hover:border-green-400 hover:bg-green-50 transition-all cursor-pointer group">
                    <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-400 group-hover:bg-green-100 group-hover:text-green-500 transition-colors">
                        <i class="fas fa-music text-2xl"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-2">오디오 파일을 업로드하세요</h3>
                    <p class="text-slate-400 mb-6 text-sm">또는 여기로 드래그 앤 드롭 하세요</p>
                    <input type="file" id="file-input" class="hidden" accept="audio/*">
                    <button onclick="document.getElementById('file-input').click()" class="bg-green-500 hover:bg-green-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg transition-all">
                        파일 선택하기
                    </button>
                </div>
            </div>

            <!-- Conversion Logic Area (Hidden initially) -->
            <div id="convert-container" class="hidden p-8 md:p-12 space-y-8 animate-fade-in">
                <!-- File Info Card -->
                <div class="bg-slate-50 rounded-2xl p-6 flex items-center gap-6">
                    <div class="w-12 h-12 bg-white rounded-xl shadow-sm flex items-center justify-center text-green-500 text-xl">
                        <i id="file-icon" class="fas fa-file-audio"></i>
                    </div>
                    <div class="flex-grow">
                        <h4 id="file-name" class="font-bold text-slate-800 truncate max-w-[250px]">filename.mp3</h4>
                        <p id="file-info" class="text-xs text-slate-400 uppercase tracking-wider">MP3 • 4.5 MB</p>
                    </div>
                    <button onclick="resetApp()" class="text-slate-300 hover:text-red-500 transition-colors p-2">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <!-- Settings -->
                <div class="grid sm:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-3 flex items-center gap-2">
                            <i class="fas fa-sign-out-alt text-green-500"></i> 변환할 형식 선택
                        </label>
                        <select id="format-select" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-green-500 transition-colors font-medium">
                            <option value="mp3">MP3 (MPEG-1 Audio Layer III)</option>
                            <option value="wav">WAV (Waveform Audio File Format)</option>
                            <option value="aac">AAC (Advanced Audio Coding)</option>
                            <option value="ogg">OGG (Ogg Vorbis Audio)</option>
                            <option value="m4a">M4A (Apple Audio)</option>
                        </select>
                    </div>
                    <div class="flex flex-col justify-end">
                        <button id="convert-btn" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-3.5 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
                            <i class="fas fa-sync-alt"></i> 지금 변환하기
                        </button>
                    </div>
                </div>

                <!-- Progress Bar (Hidden during idle) -->
                <div id="progress-container" class="hidden space-y-3">
                    <div class="flex justify-between text-sm">
                        <span id="status-text" class="text-slate-500 font-medium italic animate-pulse">인코딩 진행 중...</span>
                        <span id="progress-val" class="text-green-600 font-bold">0%</span>
                    </div>
                    <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
                        <div id="progress-bar" class="bg-green-500 h-full w-0 transition-all duration-300"></div>
                    </div>
                </div>

                <!-- Result Card -->
                <div id="result-container" class="hidden bg-green-50 border border-green-100 rounded-2xl p-6 text-center space-y-4">
                    <div class="w-12 h-12 bg-green-500 text-white rounded-full flex items-center justify-center mx-auto mb-2 text-xl shadow-lg shadow-green-200">
                        <i class="fas fa-check"></i>
                    </div>
                    <h3 class="text-lg font-bold text-green-800">변환이 완료되었습니다!</h3>
                    <button id="download-btn" class="inline-flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white px-10 py-3.5 rounded-xl font-bold transition-all shadow-md">
                        <i class="fas fa-download"></i> 변환된 파일 다운로드
                    </button>
                </div>
            </div>

            <!-- Initializing Overlay -->
            <div id="init-overlay" class="hidden absolute inset-0 bg-white/90 backdrop-blur-sm z-10 flex flex-col items-center justify-center text-center p-8">
                <div class="relative w-16 h-16 mb-6">
                    <div class="absolute inset-0 border-4 border-slate-100 rounded-full"></div>
                    <div class="absolute inset-0 border-4 border-green-500 rounded-full border-t-transparent animate-spin"></div>
                </div>
                <h3 class="text-xl font-bold mb-2">엔진 초기화 중...</h3>
                <p class="text-slate-400 text-sm">최초 실행 시 변환 엔진(WASM)을 다운로드하느라<br>몇 초 정도 시간이 걸릴 수 있습니다.</p>
            </div>

        </div>
