<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>SmilesLife Web OS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; 
            overflow: hidden; user-select: none; 
            background: url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2560&auto=format&fit=crop') center/cover no-repeat;
        }

        #boot-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #111; color: #fff; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer;
        }
        
        .custom-logo-lg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 30px; width: 60px; height: 60px; }
        .custom-logo-lg div { border-radius: 6px; width: 100%; height: 100%; }
        
        .c-1 { background: #FF5722; }
        .c-2 { background: #4CAF50; }
        .c-3 { background: #FFC107; }
        .c-4 { background: #E91E63; }

        #boot-screen h1 { font-size: 2rem; font-weight: 400; margin-bottom: 10px; }
        #boot-screen p { font-size: 1rem; color: #888; animation: pulse 2s infinite; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        #desktop {
            width: 100vw; height: calc(100vh - 48px); padding: 20px;
            display: flex; flex-direction: column; flex-wrap: wrap;
            align-content: flex-start; gap: 15px;
        }

        .icon { width: 80px; text-align: center; cursor: pointer; color: white; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        .icon:hover { background: rgba(255,255,255,0.1); border-radius: 5px; }
        .icon-img { width: 45px; height: 45px; margin: 5px auto; border-radius: 8px; object-fit: cover; display: block; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

        .folder-icon { width: 80px; text-align: center; cursor: pointer; color: #333; font-size: 14px; }
        .folder-icon:hover { background: rgba(0,0,0,0.05); border-radius: 5px; }
        .folder-icon img { width: 45px; height: 45px; margin: 5px auto; border-radius: 8px; object-fit: cover; display: block; }

        .window { 
            position: absolute; top: calc(50% - 24px); left: 50%; transform: translate(-50%, -50%); 
            width: 85vw; height: 80vh; max-height: calc(100vh - 100px); 
            background: #ffffff; border: 1px solid rgba(0,0,0,0.1); border-radius: 8px; 
            display: flex; flex-direction: column; z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,0.2); overflow: hidden;
        }
        
        .window-header { 
            background: #f3f3f3; color: #333; padding: 0 15px; height: 40px;
            display: flex; justify-content: space-between; align-items: center; 
            cursor: move; font-size: 14px; font-weight: 600;
        }
        .close-btn { background: transparent; border: none; width: 40px; height: 100%; cursor: pointer; font-size: 16px; color: #333; transition: 0.2s; }
        .close-btn:hover { background: #e81123; color: white; }
        
        .window-body { flex: 1; position: relative; background: #fff; }
        .window-body iframe { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; }
        
        #window-folder { 
            width: 100%; height: 100%; position: absolute; top: 0; left: 0; 
            padding: 20px; display: none; gap: 20px; flex-wrap: wrap; 
            overflow-y: auto; background: #f9f9f9; align-content: flex-start;
        }

        #taskbar { 
            width: 100vw; height: 48px; background: rgba(243, 243, 243, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255,255,255,0.5); position: absolute; bottom: 0; left: 0; 
            display: flex; justify-content: flex-start; align-items: center; padding: 0 10px; gap: 10px; z-index: 100;
        }
        
        #start-btn { 
            width: 44px; height: 44px; background: transparent; border: none; border-radius: 6px; cursor: pointer; 
            display: flex; justify-content: center; align-items: center; transition: 0.2s;
        }
        #start-btn:hover { background: rgba(255,255,255,0.5); }
        
        .custom-logo-sm { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; width: 22px; height: 22px; }
        .custom-logo-sm div { border-radius: 3px; width: 100%; height: 100%; }

        #taskbar-apps { display: flex; gap: 5px; margin-left: 5px; height: 100%; align-items: center; }
        .taskbar-app { 
            display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px;
            background: rgba(255, 255, 255, 0.6); border-radius: 4px; 
            border-bottom: 3px solid #E91E63; 
            font-size: 13px; color: #333; cursor: pointer;
        }
        .taskbar-app img { width: 20px; height: 20px; border-radius: 4px; object-fit: cover; }

        #start-menu { 
            position: absolute; bottom: 60px; left: 10px;
            width: 400px; max-height: 500px; background: rgba(243, 243, 243, 0.9); backdrop-filter: blur(20px);
            border: 1px solid rgba(0,0,0,0.1); border-radius: 12px; display: none; flex-direction: column; z-index: 99; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.15); padding: 20px;
        }
        .start-menu-title { font-size: 14px; font-weight: bold; margin-bottom: 15px; color: #333; }
        .start-menu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .start-menu-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; padding: 10px 5px; border-radius: 5px; transition: 0.2s; font-size: 12px; color: #333; text-align: center; }
        .start-menu-item:hover { background: rgba(255,255,255,0.8); }
        .menu-icon-sm { width: 32px; height: 32px; margin-bottom: 8px; border-radius: 6px; object-fit: cover; }
    </style>
</head>
<body>

    <div id="boot-screen" onclick="startSystem()">
        <div class="custom-logo-lg">
            <div class="c-1"></div><div class="c-2"></div><div class="c-3"></div><div class="c-4"></div>
        </div>
        <h1>SmilesLife Web OS</h1>
        <p>화면을 클릭하여 시작하세요</p>
    </div>

    <div id="desktop"></div>
    
    <div id="start-menu">
        <div class="start-menu-title">고정됨</div>
        <div class="start-menu-grid" id="start-menu-grid"></div>
    </div>

    <div id="app-window" class="window" style="display: none;">
        <div class="window-header">
            <span id="window-title">프로그램</span>
            <button class="close-btn" onclick="closeWindow()">✕</button>
        </div>
        <div class="window-body">
            <iframe id="window-iframe" src=""></iframe>
            <div id="window-folder"></div>
        </div>
    </div>

    <div id="taskbar">
        <button id="start-btn" onclick="toggleStartMenu(event)">
            <div class="custom-logo-sm">
                <div class="c-1"></div><div class="c-2"></div><div class="c-3"></div><div class="c-4"></div>
            </div>
        </button>
        <div id="taskbar-apps"></div>
    </div>

    <script>
        // 알려준 시트 주소를 CSV 내보내기 주소로 변환
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1RRpkarZGReZMb243IsGNQfP1Urzs5Fh24uWRbfkwVdM/export?format=csv&gid=0';
        let siteDataList = []; 

        function startSystem() {
            const docElm = document.documentElement;
            if (docElm.requestFullscreen) { docElm.requestFullscreen(); }
            else if (docElm.webkitRequestFullscreen) { docElm.webkitRequestFullscreen(); }
            document.getElementById('boot-screen').style.display = 'none';
            loadMenuData();
        }

        async function loadMenuData() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const data = await response.text();
                
                // 줄바꿈이 있는 CSV 데이터를 안전하게 파싱하기 위한 정규식 처리
                const rows = data.split(/\r?\n/).slice(1);
                const desktop = document.getElementById('desktop');
                const startMenuGrid = document.getElementById('start-menu-grid');
                const defaultIcon = 'https://cdn-icons-png.flaticon.com/512/732/732225.png';
                const folderIconImg = 'https://cdn-icons-png.flaticon.com/512/716/716784.png'; 

                const mySiteFolder = document.createElement('div');
                mySiteFolder.className = 'icon';
                mySiteFolder.innerHTML = `<img src="${folderIconImg}" class="icon-img" alt="폴더"><div>내사이트</div>`;
                mySiteFolder.ondblclick = () => {
                    openFolder('내사이트', folderIconImg);
                    closeStartMenu();
                };
                desktop.appendChild(mySiteFolder);

                rows.forEach(row => {
                    if (!row.trim()) return;
                    
                    // 쉼표(,)를 기준으로 나누되 쌍따옴표 내부의 쉼표는 무시하는 로직 추가
                    const regex = /(".*?"|[^",\s]+)(?=\s*,|\s*$)/g;
                    let columns = [];
                    let match;
                    while (match = regex.exec(row)) {
                        columns.push(match[1].replace(/^"|"$/g, ''));
                    }

                    if(columns.length < 2) return;

                    const name = columns[0] ? columns[0].trim() : '';
                    const url = columns[1] ? columns[1].trim() : '';
                    const iconUrl = (columns[2] && columns[2].trim() !== '') ? columns[2].trim() : defaultIcon;

                    siteDataList.push({ name, url, iconUrl });

                    const icon = document.createElement('div');
                    icon.className = 'icon';
                    icon.innerHTML = `<img src="${iconUrl}" class="icon-img" alt="icon"><div>${name}</div>`;
                    icon.ondblclick = () => { 
                        openWindow(name, url, iconUrl);
                        closeStartMenu();
                    };
                    desktop.appendChild(icon);

                    const menuItem = document.createElement('div');
                    menuItem.className = 'start-menu-item';
                    menuItem.innerHTML = `<img src="${iconUrl}" class="menu-icon-sm" alt="icon"><span>${name}</span>`;
                    menuItem.onclick = () => {
                        openWindow(name, url, iconUrl);
                        closeStartMenu();
                    };
                    startMenuGrid.appendChild(menuItem);
                });
            } catch (error) {
                console.error('데이터 로드 실패:', error);
            }
        }

        function toggleStartMenu(event) {
            event.stopPropagation();
            const menu = document.getElementById('start-menu');
            menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
        }

        function closeStartMenu() { document.getElementById('start-menu').style.display = 'none'; }
        document.body.addEventListener('click', closeStartMenu);

        function addTaskbarApp(title, iconUrl) {
            const taskbarApps = document.getElementById('taskbar-apps');
            taskbarApps.innerHTML = `<div class="taskbar-app"><img src="${iconUrl}" alt="icon"><span>${title}</span></div>`;
        }

        function openWindow(title, url, iconUrl) {
            const win = document.getElementById('app-window');
            document.getElementById('window-title').innerText = title;
            document.getElementById('window-folder').style.display = 'none';
            
            const iframe = document.getElementById('window-iframe');
            iframe.style.display = 'block';
            iframe.src = url;
            win.style.display = 'flex';
            
            addTaskbarApp(title, iconUrl);
        }

        function openFolder(title, iconUrl) {
            const win = document.getElementById('app-window');
            document.getElementById('window-title').innerText = title;
            document.getElementById('window-iframe').style.display = 'none';
            document.getElementById('window-iframe').src = '';
            
            const folder = document.getElementById('window-folder');
            folder.style.display = 'flex';
            folder.innerHTML = '';
            
            siteDataList.forEach(site => {
                const icon = document.createElement('div');
                icon.className = 'folder-icon';
                icon.innerHTML = `<img src="${site.iconUrl}" alt="icon"><div>${site.name}</div>`;
                icon.ondblclick = () => { openWindow(site.name, site.url, site.iconUrl); };
                folder.appendChild(icon);
            });

            win.style.display = 'flex';
            addTaskbarApp(title, iconUrl);
        }

        function closeWindow() {
            document.getElementById('app-window').style.display = 'none';
            document.getElementById('window-iframe').src = '';
            document.getElementById('taskbar-apps').innerHTML = '';
        }
    </script>
</body>
</html>
