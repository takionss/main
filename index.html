<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmilesLife - 접속 모드 선택</title>
    
    <!-- SNS 공유용 메타 태그 -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="SmilesLife 모드 선택">
    <meta property="og:description" content="일반 모드와 윈도우 모드 중 원하는 환경을 선택해 보세요.">
    <meta property="og:image" content="https://smileslife.co.kr/images/desktop.png">
    
    <link rel="icon" href="https://smileslife.co.kr/images/change.png" type="image/png">
    
    <!-- 구글 폰트 적용 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    
    <!-- 자동 리다이렉트 스크립트 (헤드 상단 배치하여 렌더링 깜빡임 제거) -->
    <script>
        (function() {
            // URL에 ?select=true가 있는 경우 자동 리다이렉트를 건너뜁니다.
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('select') === 'true') {
                return;
            }
            
            function getLanguagePrefix() {
                const userLang = (navigator.language || navigator.userLanguage).toLowerCase();
                if (userLang.startsWith('en')) return 'en';
                if (userLang.startsWith('es')) return 'es';
                if (userLang.startsWith('ja')) return 'ja';
                if (userLang.startsWith('zh-tw') || userLang === 'zh-hk' || userLang === 'zh-mo') return 'zh-TW';
                return 'ko';
            }
            
            const preferredMode = localStorage.getItem('smileslife-preferred-mode');
            const lang = getLanguagePrefix();
            if (preferredMode === 'win') {
                window.location.replace('index_win.html?lang=' + lang);
            } else if (preferredMode === 'normal') {
                const path = lang === 'ko' ? 'index_normal.html' : lang + '/index_normal.html';
                window.location.replace(path);
            }
        })();
    </script>

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0b0f19 0%, #111827 50%, #1e1b4b 100%);
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --accent-blue: #0078D4;
            --accent-green: #10b981;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover-border: rgba(255, 255, 255, 0.2);
            --card-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 40px 20px;
        }

        /* 배경 우주 성운 장식 */
        .glow-sphere {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            opacity: 0.15;
            pointer-events: none;
        }
        .sphere-1 {
            top: -10%;
            left: 10%;
            width: 40vw;
            height: 40vw;
            background: #4f46e5;
        }
        .sphere-2 {
            bottom: -10%;
            right: 10%;
            width: 50vw;
            height: 50vw;
            background: #06b6d4;
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 1000px;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        .header {
            animation: fadeInDown 0.8s ease-out;
        }

        .logo-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            width: 48px;
            height: 48px;
            margin: 0 auto 20px auto;
        }
        .logo-box div {
            border-radius: 4px;
        }
        .c-1 { background: #FF5722; }
        .c-2 { background: #4CAF50; }
        .c-3 { background: #FFC107; }
        .c-4 { background: #E91E63; }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            background: linear-gradient(to right, #ffffff, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 1.15rem;
            color: var(--text-secondary);
            font-weight: 300;
        }

        /* 카드 선택 영역 */
        .cards-wrapper {
            display: flex;
            gap: 30px;
            width: 100%;
            margin-top: 20px;
            justify-content: center;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .card {
            flex: 1;
            max-width: 440px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px 30px;
            cursor: pointer;
            position: relative;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            text-decoration: none;
            color: var(--text-primary);
        }

        .card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 24px;
            padding: 1px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            transition: all 0.4s;
        }

        .card:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--glass-hover-border);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }

        /* 카드 아이콘 연출 */
        .card-icon {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2rem;
            margin-bottom: 25px;
            transition: all 0.4s;
        }

        .card:hover .card-icon {
            transform: scale(1.1) rotate(3deg);
            background: rgba(255, 255, 255, 0.08);
        }

        /* 각 카드 포인트 컬러 */
        .card-normal:hover .card-icon {
            color: var(--accent-green);
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.2);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .card-win:hover .card-icon {
            color: #3b82f6;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.3);
        }

        .card h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: -0.3px;
        }

        .card p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.6;
            font-weight: 300;
            word-break: keep-all;
        }

        /* 항상 이 모드로 접속 설정 */
        .preference-box {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            color: var(--text-secondary);
            user-select: none;
            padding: 8px 16px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            transition: all 0.3s;
            animation: fadeIn 1.2s ease-out 0.4s both;
        }

        .preference-box:hover {
            border-color: var(--glass-hover-border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
        }

        .preference-box input {
            cursor: pointer;
            accent-color: var(--accent-blue);
        }

        /* 저작권 표기 */
        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.25);
            font-weight: 300;
            letter-spacing: 0.5px;
            animation: fadeIn 1.2s ease-out 0.6s both;
        }

        /* 애니메이션 키프레임 */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 768px) {
            .cards-wrapper {
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }
            .card {
                width: 100%;
                padding: 30px 20px;
            }
            .header h1 {
                font-size: 2.2rem;
            }
        }

        .lang-select-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
        }
        .lang-select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
            outline: none;
            font-size: 0.85rem;
            font-family: inherit;
            transition: all 0.2s;
        }
        .lang-select:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .lang-select option {
            background: #0b0f19;
            color: white;
        }
    </style>
</head>
<body>

    <div class="lang-select-container">
        <select class="lang-select" onchange="changeLanguage(this.value)">
            <option value="ko">한국어</option>
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="ja">日本語</option>
            <option value="zh-TW">繁體中文</option>
        </select>
    </div>

    <div class="glow-sphere sphere-1"></div>
    <div class="glow-sphere sphere-2"></div>

    <div class="container">
        <!-- 상단 헤더 -->
        <div class="header">
            <div class="logo-box" style="display: flex; justify-content: center; align-items: center; font-size: 3rem; margin-bottom: 20px;">
                😊
            </div>
            <h1>SmilesLife</h1>
            <p id="header-subtitle">작업 환경에 최적화된 접속 모드를 선택해 주세요.</p>
        </div>

        <!-- 카드 구성 -->
        <div class="cards-wrapper">
            <!-- 1. 일반 모드 -->
            <div class="card card-normal" onclick="selectMode('normal')">
                <div class="card-icon">💻</div>
                <h2 id="normal-title">일반 모드</h2>
                <p id="normal-desc">모든 서비스와 게임을 한눈에 볼 수 있는 깔끔한 카드 리스트 형식입니다. 모바일과 PC 환경 구분 없이 빠르고 간편하게 실행할 수 있습니다.</p>
            </div>

            <!-- 2. 윈도우 모드 -->
            <div class="card card-win" onclick="selectMode('win')">
                <div class="card-icon">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px; width: 34px; height: 34px;">
                        <div style="background: #FF5722; border-radius: 2px;"></div>
                        <div style="background: #4CAF50; border-radius: 2px;"></div>
                        <div style="background: #FFC107; border-radius: 2px;"></div>
                        <div style="background: #E91E63; border-radius: 2px;"></div>
                    </div>
                </div>
                <h2 id="win-title">윈도우 모드</h2>
                <p id="win-desc">실제 컴퓨터 바탕화면처럼 여러 창을 띄우고 동시에 작업할 수 있습니다.<br><span style="font-weight: 600; color: #3b82f6;">※ 선택 시 브라우저가 전체 화면 모드로 전환됩니다.</span></p>
            </div>
        </div>

        <!-- 옵션 설정 -->
        <label class="preference-box" for="remember-preference">
            <input type="checkbox" id="remember-preference">
            <span id="remember-text">선택한 접속 모드 기억하기 (이후 자동 접속)</span>
        </label>

        <!-- 저작권 -->
        <div class="footer">
            © 2026 SmilesLife. Designed with luxury aesthetics. | 
            <a href="https://www.flaticon.com" target="_blank" style="color: rgba(255,255,255,0.25); text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='#0078D4'" onmouseout="this.style.color='rgba(255,255,255,0.25)'">Icons by Flaticon</a>
        </div>
    </div>

    <script>
        const DICTIONARY = {
            'ko': {
                't_title': 'SmilesLife - 접속 모드 선택',
                'header-subtitle': '작업 환경에 최적화된 접속 모드를 선택해 주세요.',
                'normal-title': '일반 모드',
                'normal-desc': '모든 서비스와 게임을 한눈에 볼 수 있는 깔끔한 카드 리스트 형식입니다. 모바일과 PC 환경 구분 없이 빠르고 간편하게 실행할 수 있습니다.',
                'win-title': '윈도우 모드',
                'win-desc': '실제 컴퓨터 바탕화면처럼 여러 창을 띄우고 동시에 작업할 수 있습니다.<br><span style="font-weight: 600; color: #3b82f6;">※ 선택 시 브라우저가 전체 화면 모드로 전환됩니다.</span>',
                'remember-text': '선택한 접속 모드 기억하기 (이후 자동 접속)'
            },
            'en': {
                't_title': 'SmilesLife - Choose Access Mode',
                'header-subtitle': 'Please choose the access mode optimized for your workspace.',
                'normal-title': 'Normal Mode',
                'normal-desc': 'A clean card list format displaying all services and games at a glance. Run them quickly and easily on both mobile and PC.',
                'win-title': 'Windows Mode',
                'win-desc': 'Open multiple windows and multitask just like a real computer desktop.<br><span style="font-weight: 600; color: #3b82f6;">※ Browser switches to full-screen mode upon selection.</span>',
                'remember-text': 'Remember my choice (automatic access next time)'
            },
            'es': {
                't_title': 'SmilesLife - Seleccionar Modo de Acceso',
                'header-subtitle': 'Por favor, elija el modo de acceso optimizado para su espacio de trabajo.',
                'normal-title': 'Modo Normal',
                'normal-desc': 'Un formato de lista de tarjetas limpio que muestra todos los servicios y juegos de un vistazo. Ejecútelos rápida y fácilmente tanto en móviles como en PC.',
                'win-title': 'Modo Windows',
                'win-desc': 'Abra múltiples ventanas y realice múltiples tareas como en un escritorio de computadora real.<br><span style="font-weight: 600; color: #3b82f6;">※ El navegador cambia al modo de pantalla completa al seleccionarlo.</span>',
                'remember-text': 'Recordar mi elección (acceso automático la próxima vez)'
            },
            'ja': {
                't_title': 'SmilesLife - 接続モードの選択',
                'header-subtitle': '作業環境に最適化された接続モードを選択してください。',
                'normal-title': 'ノーマルモード',
                'normal-desc': 'すべてのサービスやゲームを一覧できるクリーンなカードリスト形式です。モバイルとPC環境を問わず、迅速かつ簡単に実行できます。',
                'win-title': 'ウィンドウモード',
                'win-desc': '実際のコンピュータのデスクトップのように、複数のウィンドウを開いて同時に作業できます。<br><span style="font-weight: 600; color: #3b82f6;">※ 選択すると、ブラウザが全画面表示モードに切り替わります。</span>',
                'remember-text': '選択した接続モードを記憶する（次回から自動接続）'
            },
            'zh-TW': {
                't_title': 'SmilesLife - 選擇存取模式',
                'header-subtitle': '請選擇適合您工作環境의 存取模式。',
                'normal-title': '一般模式',
                'normal-desc': '乾淨的卡片列表格式，所有服務與遊戲一目了然。在手機與電腦上皆可快速且輕鬆地執行。',
                'win-title': 'Windows 模式',
                'win-desc': '像真實的電腦桌面一樣，打開多個視窗並同時進行多工處理。<br><span style="font-weight: 600; color: #3b82f6;">※ 選擇後瀏覽器將切換為全螢幕模式。</span>',
                'remember-text': '記住我選擇的模式（下次自動登入）'
            }
        };

        function getLanguagePrefix() {
            const userLang = (navigator.language || navigator.userLanguage).toLowerCase();
            if (userLang.startsWith('en')) return 'en';
            if (userLang.startsWith('es')) return 'es';
            if (userLang.startsWith('ja')) return 'ja';
            if (userLang.startsWith('zh-tw') || userLang === 'zh-hk' || userLang === 'zh-mo') return 'zh-TW';
            return 'ko';
        }

        function applyLanguage(lang) {
            const trans = DICTIONARY[lang] || DICTIONARY['ko'];
            document.title = trans['t_title'];
            document.getElementById('header-subtitle').innerHTML = trans['header-subtitle'];
            document.getElementById('normal-title').innerHTML = trans['normal-title'];
            document.getElementById('normal-desc').innerHTML = trans['normal-desc'];
            document.getElementById('win-title').innerHTML = trans['win-title'];
            document.getElementById('win-desc').innerHTML = trans['win-desc'];
            document.getElementById('remember-text').innerHTML = trans['remember-text'];
        }

        function changeLanguage(lang) {
            applyLanguage(lang);
        }

        function selectMode(mode) {
            const rememberCheckbox = document.getElementById('remember-preference');
            const selectEl = document.querySelector('.lang-select');
            const lang = selectEl ? selectEl.value : getLanguagePrefix();
            
            if (rememberCheckbox && rememberCheckbox.checked) {
                localStorage.setItem('smileslife-preferred-mode', mode);
            } else {
                localStorage.removeItem('smileslife-preferred-mode');
            }
            
            if (mode === 'win') {
                try {
                    const docElm = document.documentElement;
                    if (docElm.requestFullscreen) {
                        docElm.requestFullscreen().catch(() => {});
                    } else if (docElm.webkitRequestFullscreen) {
                        docElm.webkitRequestFullscreen();
                    }
                } catch (err) {}
                
                document.documentElement.style.overflow = 'hidden';
                document.body.style.overflow = 'hidden';
                
                setTimeout(() => {
                    try {
                        window.history.replaceState({}, '', 'index_win.html?lang=' + lang);
                    } catch (e) {}

                    const iframe = document.createElement('iframe');
                    iframe.src = 'index_win.html?lang=' + lang;
                    iframe.style.position = 'fixed';
                    iframe.style.top = '0';
                    iframe.style.left = '0';
                    iframe.style.width = '100vw';
                    iframe.style.height = '100vh';
                    iframe.style.border = 'none';
                    iframe.style.zIndex = '999999';
                    iframe.setAttribute('allow', 'fullscreen');
                    document.body.appendChild(iframe);
                }, 150);
            } else {
                window.location.href = lang === 'ko' ? 'index_normal.html' : lang + '/index_normal.html';
            }
        }
        
        window.addEventListener('DOMContentLoaded', () => {
            const preferredMode = localStorage.getItem('smileslife-preferred-mode');
            if (preferredMode) {
                document.getElementById('remember-preference').checked = true;
            }
            
            // Auto-detect and pre-select language dropdown
            const defaultLang = getLanguagePrefix();
            const selectEl = document.querySelector('.lang-select');
            if (selectEl) {
                selectEl.value = defaultLang;
            }
            applyLanguage(defaultLang);
        });
    </script>
</body>
</html>
