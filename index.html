<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmilesLife - 접속 모드 선택</title>
    
    <!-- SNS 공유용 메타 태그 -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="SmilesLife 모드 선택">
    <meta property="og:description" content="일반 모드와 윈도우 모드 중 원하는 환경을 선택해 보세요.">
    <meta property="og:image" content="https://smileslife.co.kr/images/desktop.png">
    
    <link rel="icon" href="https://smileslife.co.kr/images/desktop.png" type="image/png">
    
    <!-- 구글 폰트 적용 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    
    <!-- 자동 리다이렉트 스크립트 (헤드 상단 배치하여 렌더링 깜빡임 제거) -->
    <script>
        (function() {
            // URL에 ?select=true가 있는 경우 자동 리다이렉트를 건너뜁니다.
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('select') === 'true') {
                return;
            }
            
            const preferredMode = localStorage.getItem('smileslife-preferred-mode');
            if (preferredMode === 'win') {
                window.location.replace('index_win.html');
            } else if (preferredMode === 'normal') {
                window.location.replace('index_normal.html');
            }
        })();
    </script>

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0b0f19 0%, #111827 50%, #1e1b4b 100%);
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --accent-blue: #0078D4;
            --accent-green: #10b981;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover-border: rgba(255, 255, 255, 0.2);
            --card-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 40px 20px;
        }

        /* 배경 우주 성운 장식 */
        .glow-sphere {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            opacity: 0.15;
            pointer-events: none;
        }
        .sphere-1 {
            top: -10%;
            left: 10%;
            width: 40vw;
            height: 40vw;
            background: #4f46e5;
        }
        .sphere-2 {
            bottom: -10%;
            right: 10%;
            width: 50vw;
            height: 50vw;
            background: #06b6d4;
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 1000px;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        .header {
            animation: fadeInDown 0.8s ease-out;
        }

        .logo-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            width: 48px;
            height: 48px;
            margin: 0 auto 20px auto;
        }
        .logo-box div {
            border-radius: 4px;
        }
        .c-1 { background: #FF5722; }
        .c-2 { background: #4CAF50; }
        .c-3 { background: #FFC107; }
        .c-4 { background: #E91E63; }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            background: linear-gradient(to right, #ffffff, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 1.15rem;
            color: var(--text-secondary);
            font-weight: 300;
        }

        /* 카드 선택 영역 */
        .cards-wrapper {
            display: flex;
            gap: 30px;
            width: 100%;
            margin-top: 20px;
            justify-content: center;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .card {
            flex: 1;
            max-width: 440px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px 30px;
            cursor: pointer;
            position: relative;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            text-decoration: none;
            color: var(--text-primary);
        }

        .card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 24px;
            padding: 1px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            transition: all 0.4s;
        }

        .card:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--glass-hover-border);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }

        /* 카드 아이콘 연출 */
        .card-icon {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2rem;
            margin-bottom: 25px;
            transition: all 0.4s;
        }

        .card:hover .card-icon {
            transform: scale(1.1) rotate(3deg);
            background: rgba(255, 255, 255, 0.08);
        }

        /* 각 카드 포인트 컬러 */
        .card-normal:hover .card-icon {
            color: var(--accent-green);
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.2);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .card-win:hover .card-icon {
            color: #3b82f6;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.3);
        }

        .card h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: -0.3px;
        }

        .card p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.6;
            font-weight: 300;
            word-break: keep-all;
        }

        /* 항상 이 모드로 접속 설정 */
        .preference-box {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            color: var(--text-secondary);
            user-select: none;
            padding: 8px 16px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            transition: all 0.3s;
            animation: fadeIn 1.2s ease-out 0.4s both;
        }

        .preference-box:hover {
            border-color: var(--glass-hover-border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
        }

        .preference-box input {
            cursor: pointer;
            accent-color: var(--accent-blue);
        }

        /* 저작권 표기 */
        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.25);
            font-weight: 300;
            letter-spacing: 0.5px;
            animation: fadeIn 1.2s ease-out 0.6s both;
        }

        /* 애니메이션 키프레임 */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 768px) {
            .cards-wrapper {
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }
            .card {
                width: 100%;
                padding: 30px 20px;
            }
            .header h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="glow-sphere sphere-1"></div>
    <div class="glow-sphere sphere-2"></div>

    <div class="container">
        <!-- 상단 헤더 -->
        <div class="header">
            <div class="logo-box">
                <div class="c-1"></div><div class="c-2"></div><div class="c-3"></div><div class="c-4"></div>
            </div>
            <h1>SmilesLife</h1>
            <p>작업 환경에 최적화된 접속 모드를 선택해 주세요.</p>
        </div>

        <!-- 카드 구성 -->
        <div class="cards-wrapper">
            <!-- 1. 일반 모드 -->
            <div class="card card-normal" onclick="selectMode('normal')">
                <div class="card-icon">📱</div>
                <h2>일반 모드</h2>
                <p>모든 서비스와 게임을 한눈에 볼 수 있는 깔끔한 카드 리스트 형식입니다. 모바일과 PC 환경 구분 없이 빠르고 간편하게 실행할 수 있습니다.</p>
            </div>

            <!-- 2. 윈도우 모드 -->
            <div class="card card-win" onclick="selectMode('win')">
                <div class="card-icon">💻</div>
                <h2>윈도우 모드</h2>
                <p>실제 컴퓨터 바탕화면처럼 창을 띄우고 여러 작업을 동시에 진행할 수 있습니다. PC 환경에 최적화된 몰입감 높은 가상 운영체제 형식입니다.</p>
            </div>
        </div>

        <!-- 옵션 설정 -->
        <label class="preference-box" for="remember-preference">
            <input type="checkbox" id="remember-preference">
            <span>선택한 접속 모드 기억하기 (이후 자동 접속)</span>
        </label>

        <!-- 저작권 -->
        <div class="footer">
            © 2026 SmilesLife. Designed with luxury aesthetics. | 
            <a href="https://www.flaticon.com" target="_blank" style="color: rgba(255,255,255,0.25); text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='#0078D4'" onmouseout="this.style.color='rgba(255,255,255,0.25)'">Icons by Flaticon</a>
        </div>
    </div>

    <script>
        function selectMode(mode) {
            const rememberCheckbox = document.getElementById('remember-preference');
            
            if (rememberCheckbox && rememberCheckbox.checked) {
                localStorage.setItem('smileslife-preferred-mode', mode);
            } else {
                localStorage.removeItem('smileslife-preferred-mode');
            }
            
            if (mode === 'win') {
                window.location.href = 'index_win.html';
            } else {
                window.location.href = 'index_normal.html';
            }
        }
        
        // 이전에 선택을 저장했었다면 체크박스를 활성화해 둡니다.
        window.addEventListener('DOMContentLoaded', () => {
            const preferredMode = localStorage.getItem('smileslife-preferred-mode');
            if (preferredMode) {
                document.getElementById('remember-preference').checked = true;
            }
        });
    </script>
</body>
</html>
