<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmilesLife - 내 삶의 편리함</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; }
    </style>
</head>
<body class="bg-white text-gray-800">

    <!-- Nav -->
    <nav class="sticky top-0 z-50 bg-white border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    <a href="https://smileslife.co.kr" class="text-2xl font-extrabold text-blue-600 tracking-tight">SmilesLife</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Product Grid -->
    <section class="py-20 bg-white">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center mb-16">
                <h2 class="text-3xl font-bold text-gray-900">주요 서비스</h2>
                <div class="mt-2 w-20 h-1 bg-blue-600 mx-auto rounded-full"></div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                <!-- Card 1 -->
                <div class="group p-8 rounded-3xl border border-gray-100 hover:border-blue-200 hover:shadow-2xl transition-all bg-white text-center">
                    <div class="w-20 h-20 bg-blue-50 rounded-2xl flex items-center justify-center mx-auto mb-6 group-hover:bg-blue-600 transition-colors">
                        <i class="fa-solid fa-file-zipper text-3xl text-blue-600 group-hover:text-white"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-2">스마일집</h3>
                    <p class="text-gray-500 text-sm mb-6">강력한 압축 기능과 보안을 한번에 제공합니다.</p>
                    <button class="w-full py-2 rounded-lg border border-blue-600 text-blue-600 font-bold hover:bg-blue-600 hover:text-white transition">다운로드</button>
                </div>

                <!-- Card 2 -->
                <div class="group p-8 rounded-3xl border border-gray-100 hover:border-blue-200 hover:shadow-2xl transition-all bg-white text-center">
                    <div class="w-20 h-20 bg-green-50 rounded-2xl flex items-center justify-center mx-auto mb-6 group-hover:bg-green-600 transition-colors">
                        <i class="fa-solid fa-shield-virus text-3xl text-green-600 group-hover:text-white"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-2">스마일케어</h3>
                    <p class="text-gray-500 text-sm mb-6">랜섬웨어로부터 당신의 데이터를 보호합니다.</p>
                    <button class="w-full py-2 rounded-lg border border-green-600 text-green-600 font-bold hover:bg-green-600 hover:text-white transition">다운로드</button>
                </div>

                <!-- Card 3 -->
                <div class="group p-8 rounded-3xl border border-gray-100 hover:border-blue-200 hover:shadow-2xl transition-all bg-white text-center">
                    <div class="w-20 h-20 bg-orange-50 rounded-2xl flex items-center justify-center mx-auto mb-6 group-hover:bg-orange-600 transition-colors">
                        <i class="fa-solid fa-image text-3xl text-orange-600 group-hover:text-white"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-2">스마일뷰</h3>
                    <p class="text-gray-500 text-sm mb-6">모든 포맷의 이미지를 가장 빠르게 확인하세요.</p>
                    <button class="w-full py-2 rounded-lg border border-orange-600 text-orange-600 font-bold hover:bg-orange-600 hover:text-white transition">다운로드</button>
                </div>

                <!-- Card 4 -->
                <div class="group p-8 rounded-3xl border border-gray-100 hover:border-blue-200 hover:shadow-2xl transition-all bg-white text-center">
                    <div class="w-20 h-20 bg-purple-50 rounded-2xl flex items-center justify-center mx-auto mb-6 group-hover:bg-purple-600 transition-colors">
                        <i class="fa-solid fa-keyboard text-3xl text-purple-600 group-hover:text-white"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-2">스마일패스</h3>
                    <p class="text-gray-500 text-sm mb-6">복잡한 비밀번호, 이제 기억할 필요 없습니다.</p>
                    <button class="w-full py-2 rounded-lg border border-purple-600 text-purple-600 font-bold hover:bg-purple-600 hover:text-white transition">다운로드</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-50 border-t border-gray-100 py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <span class="text-xl font-bold text-gray-900">SmilesLife</span>
        </div>
    </footer>

</body>
</html>
