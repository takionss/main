<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>리다이렉트 중...</title>
    <script>
        (function() {
            const pathname = window.location.pathname; // 예: /why/sub-page
            
            // 주소가 정확히 /why 이거나 /why/ 인 경우 새로운 사이트 메인으로 리다이렉트
            if (pathname === '/why' || pathname === '/why/') {
                const targetUrl = 'https://curiosity.smileslife.co.kr/' + window.location.search + window.location.hash;
                window.location.replace(targetUrl);
            }
            // 그 외 /why/로 시작하는 하위 페이지들은 전체 경로(/why/...)를 그대로 유지하여 리다이렉트
            else if (pathname.startsWith('/why/')) {
                const targetUrl = 'https://curiosity.smileslife.co.kr' + pathname + window.location.search + window.location.hash;
                window.location.replace(targetUrl);
            } else {
                // /why 관련 주소가 아닌 진짜 없는 페이지인 경우 홈으로 이동
                window.location.replace('/');
            }
        })();
    </script>
</head>
<body>
    <p>페이지를 이동 중입니다. 잠시만 기다려주세요...</p>
</body>
</html>
